
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자동차검사 다국어 안내 R11</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf4f9;color:#1c3448;font-family:Arial,'Malgun Gothic',sans-serif;line-height:1.55}
header{background:#14598b;color:white;text-align:center;padding:22px 12px}
h1{margin:0;font-size:25px}
header p{margin:5px 0 0}
main{max-width:760px;margin:auto;padding:14px}
.card,details{background:white;border-radius:17px;padding:18px;margin-bottom:17px;box-shadow:0 2px 9px #1234}
h2{font-size:21px;margin:0 0 15px}
label{font-weight:800;display:block;margin:10px 0 5px}
select,input,button{font:inherit}
select,input[type=file]{width:100%;padding:11px;border:1px solid #b9cbd9;border-radius:9px;background:white}
.upload{background:#f4f9ff;border:2px dashed #bed3e5;border-radius:12px;padding:12px;margin-top:13px}
button{border:0;border-radius:11px;padding:13px;background:#176da7;color:white;font-weight:800;cursor:pointer}
#analyze{width:100%;font-size:19px;margin-top:16px}
button:disabled{opacity:.55}
.preview{display:none;align-items:center;gap:12px;margin-top:10px}
.preview canvas{max-width:105px;max-height:110px}
.preview button{font-size:13px;padding:9px}
.result{padding:21px;border-radius:16px;margin-bottom:16px}
.result.fail{background:#ffe6e7;color:#a51d28}
.result.pass{background:#def6e7;color:#15663b}
.result.unknown{background:#fff1d8;color:#78551c}
.decision{font-size:46px;font-weight:900}
.bigdate{font-size:33px;font-weight:900;border-top:1px solid;padding-top:8px;margin-top:12px}
.info{display:grid;grid-template-columns:43% 57%;border:1px solid #d7e4ee;border-radius:9px;overflow:hidden;margin:8px 0;font-size:16px}
.info>div{padding:11px}
.info>div:first-child{background:#eaf4fd;font-weight:800}
.item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #e4edf3;font-weight:800;font-size:17px}
.pill{border-radius:9px;padding:8px 13px;font-size:15px}
.good{background:#dff6e7;color:#146c3e}
.check{background:#ffe1e2;color:#a8202d}
.unknownpill{background:#eee;color:#626262}
.fault{padding:13px;border-left:5px solid #b62931;background:#fff1f1;margin:9px 0;border-radius:9px;font-size:18px;font-weight:800}
textarea{width:100%;min-height:130px;margin:6px 0 12px;border:1px solid #c7d8e4;border-radius:9px;padding:10px;font-size:13px}
summary{cursor:pointer;font-weight:800}
.notice{font-size:14px;color:#596b79}
#progress{font-weight:700;color:#176da7;margin-top:10px}
#error{color:#a8202d;font-weight:800}
.hidden{display:none}
@media(max-width:440px){
.card{padding:15px}
.decision{font-size:42px}
.bigdate{font-size:30px}
.item{font-size:16px}
}
</style>
</head>
<body>
<header>
<h1>자동차검사 다국어 안내</h1>
<p>Vehicle Inspection Guide</p>
</header>
<main>
<section class="card">
<h2>검사 진단서 판독</h2>
<label for="language">언어 / Language</label>
<select id="language">
<option value="ko">한국어</option>
<option value="en">English</option>
<option value="zh">中文</option>
<option value="vi">Tiếng Việt</option>
</select>
<div class="upload">
<label for="front">① 진단서 앞면 사진</label>
<input id="front" type="file" accept="image/*">
<div id="fp" class="preview">
<canvas id="fc"></canvas>
<button type="button" id="fr">↻ 앞면 회전</button>
</div>
</div>
<div class="upload">
<label for="back">② 진단서 뒷면 사진</label>
<input id="back" type="file" accept="image/*">
<div id="bp" class="preview">
<canvas id="bc"></canvas>
<button type="button" id="br">↻ 뒷면 회전</button>
</div>
</div>
<button id="analyze">검사 결과 분석하기</button>
<div id="progress"></div>
<div id="error"></div>
<p class="notice">현재 선택한 앞면·뒷면 사진만 분석합니다. 불확실한 정보는 추정하지 않습니다.</p>
</section>
<div id="output" class="hidden">
<section id="decisionBox" class="result unknown">
<div id="decisionTitle" class="decision"></div>
<div id="dateLabel"></div>
<div id="dateValue" class="bigdate"></div>
</section>
<section class="card">
<h2 id="infoTitle"></h2>
<div id="infoRows"></div>
<p class="notice">소유자명과 차대번호는 표시하지 않습니다.</p>
</section>
<section class="card">
<h2 id="itemsTitle"></h2>
<div id="itemRows"></div>
<p class="notice">판독 불가는 양호를 의미하지 않습니다.</p>
</section>
<section class="card">
<h2 id="faultTitle"></h2>
<div id="faultRows"></div>
</section>
<details>
<summary>OCR 원문 확인 (개인정보 제외)</summary>
<label>앞면</label>
<textarea id="frontRaw" readonly></textarea>
<label>뒷면</label>
<textarea id="backRaw" readonly></textarea>
<label>주요 판독 영역</label>
<textarea id="detailRaw" readonly></textarea>
</details>
</div>
</main>
<script>
'use strict';

const $=id=>document.getElementById(id);

const KEYS=[
'steering','driving','braking','lighting',
'emissions','instruments','sensors'
];

const LABELS={
ko:{
pass:'적합',fail:'부적합',unknown:'판정 확인 필요',
deadline:'재검사 기한',next:'다음 검사일',
verify:'원본 확인 필요',info:'자동차검사 기본정보',
items:'검사 항목별 진단의견',faults:'부적합 사유',
good:'양호',check:'점검요',unread:'판독 불가',
fields:['검사일자','자동차등록번호','차명','최초등록일','다음 검사일','재검사 기간','주행거리'],
names:['조향계통','주행계통','제동계통','등화장치','배출가스','계기계통','자가진단 센서 점검'],
recheck:'재검사 대상',
noFault:'부적합 사유를 판독하지 못했습니다.'
},
en:{
pass:'PASS',fail:'FAIL',unknown:'VERIFY RESULT',
deadline:'Reinspection Deadline',next:'Next Inspection Date',
verify:'Verify original',info:'Vehicle Details',
items:'Inspection Items',faults:'Reasons for Failure',
good:'Good',check:'Check Required',unread:'Not Verified',
fields:['Inspection Date','Plate Number','Vehicle Model','First Registration','Next Inspection','Reinspection Period','Mileage'],
names:['Steering','Driving','Brakes','Lighting','Emissions','Instruments','Diagnostic Sensors'],
recheck:'Reinspection Required',
noFault:'Defects could not be verified.'
},
zh:{
pass:'合格',fail:'不合格',unknown:'需核实',
deadline:'复检截止日期',next:'下次检查日期',
verify:'请核对原件',info:'车辆基本信息',
items:'检查项目',faults:'不合格原因',
good:'良好',check:'需要检查',unread:'无法确认',
fields:['检查日期','车牌号','车型','首次登记','下次检查','复检期限','里程'],
names:['转向','行驶','制动','灯光','尾气','仪表','诊断传感器'],
recheck:'需要复检',
noFault:'无法确认不合格项目。'
},
vi:{
pass:'ĐẠT',fail:'KHÔNG ĐẠT',unknown:'CẦN XÁC MINH',
deadline:'Hạn kiểm định lại',next:'Ngày kiểm định tiếp theo',
verify:'Kiểm tra bản gốc',info:'Thông tin xe',
items:'Hạng mục kiểm định',faults:'Lý do không đạt',
good:'Tốt',check:'Cần kiểm tra',unread:'Chưa xác minh',
fields:['Ngày kiểm định','Biển số','Loại xe','Đăng ký lần đầu','Kiểm định tiếp','Thời hạn kiểm định lại','Số km'],
names:['Hệ thống lái','Hệ thống vận hành','Phanh','Đèn','Khí thải','Đồng hồ','Cảm biến chẩn đoán'],
recheck:'Cần kiểm định lại',
noFault:'Không xác minh được lỗi.'
}
};

const FAULTS=[
['등화장치 임의변경','Unauthorized lighting modification','擅自改装照明装置','Tự ý thay đổi đèn'],
['물품적재장치 임의변경','Unauthorized cargo equipment modification','擅自改装载货装置','Tự ý thay đổi thiết bị chở hàng'],
['기타 [안개등 LED]','Fog lamp LED modification','雾灯LED改装','Thay đổi đèn sương mù LED'],
['기타 [활어운반장치 임의 설치]','Unauthorized live-fish carrier installation','擅自安装活鱼运输装置','Tự ý lắp thiết bị vận chuyển cá sống'],
['번호등 점등작동상태','License plate light operation','牌照灯工作状态','Tình trạng hoạt động đèn biển số']
];

let frontImage=null;
let backImage=null;
let result=null;
let worker=null;
let revision=0;

function compact(s){
return String(s||'')
.replace(/\s+/g,'')
.replace(/[|:;,.()\[\]]/g,'')
.toLowerCase();
}

function scrub(s){
return String(s||'').split('\n').map(line=>
/차\s*대\s*번\s*호|소\s*유\s*자/.test(line)
?'[개인정보 포함 행 비공개]'
:line.replace(/\b[A-HJ-NPR-Z0-9]{17}\b/gi,'[차대번호 비공개]')
).join('\n');
}

function canvas(w,h){
const c=document.createElement('canvas');
c.width=Math.max(1,Math.round(w));
c.height=Math.max(1,Math.round(h));
return c;
}

async function imageFile(file){
const url=URL.createObjectURL(file);
try{
const img=new Image();
await new Promise((ok,no)=>{
img.onload=ok;
img.onerror=no;
img.src=url;
});
const c=canvas(img.naturalWidth,img.naturalHeight);
c.getContext('2d').drawImage(img,0,0);
return c;
}finally{
URL.revokeObjectURL(url);
}
}

function rotate(c){
const out=canvas(c.height,c.width);
const x=out.getContext('2d');
x.translate(out.width/2,out.height/2);
x.rotate(Math.PI/2);
x.drawImage(c,-c.width/2,-c.height/2);
return out;
}

function preview(c,id,wrap){
const target=$(id);
const s=Math.min(1,250/Math.max(c.width,c.height));
target.width=Math.round(c.width*s);
target.height=Math.round(c.height*s);
target.getContext('2d').drawImage(c,0,0,target.width,target.height);
$(wrap).style.display='flex';
}

function crop(c,r,scale=2,contrast=false){
const sx=Math.floor(c.width*r[0]);
const sy=Math.floor(c.height*r[1]);
const sw=Math.max(1,Math.floor(c.width*r[2]));
const sh=Math.max(1,Math.floor(c.height*r[3]));
const out=canvas(sw*scale,sh*scale);
const x=out.getContext('2d',{willReadFrequently:true});
x.fillStyle='white';
x.fillRect(0,0,out.width,out.height);
x.drawImage(c,sx,sy,sw,sh,0,0,out.width,out.height);
if(contrast){
const d=x.getImageData(0,0,out.width,out.height);
for(let i=0;i<d.data.length;i+=4){
const p=d.data;
const v=p[i]*.3+p[i+1]*.59+p[i+2]*.11;
const q=Math.max(0,Math.min(255,(v-60)*1.3));
p[i]=p[i+1]=p[i+2]=q;
}
x.putImageData(d,0,0);
}
return out;
}

function page(c,w=1700){
const scale=w/c.width;
const out=canvas(w,c.height*scale);
out.getContext('2d').drawImage(c,0,0,out.width,out.height);
return out;
}

async function ocr(c,psm=6){
if(!worker){
worker=await Tesseract.createWorker('kor+eng',1,{
logger:m=>{
if(m.status==='recognizing text')
$('progress').textContent='OCR 분석 중 '+Math.round((m.progress||0)*100)+'%';
}
});
}
await worker.setParameters({
tessedit_pageseg_mode:String(psm),
preserve_interword_spaces:'1'
});
const a=await worker.recognize(c);
return a.data.text||'';
}

function validDate(y,m,d){
y=+y;m=+m;d=+d;
if(y<1990||y>2100||m<1||m>12||d<1||d>31)return false;
const z=new Date(Date.UTC(y,m-1,d));
return z.getUTCFullYear()===y&&z.getUTCMonth()===m-1&&z.getUTCDate()===d;
}

function dates(s){
const a=[];
const t=String(s||'').replace(/[OoＯ]/g,'0').replace(/뭘/g,'월');
const re=/((?:19|20)\d{2})\s*(?:년|[.\/-])\s*(\d{1,2})\s*(?:월|[.\/-])\s*(\d{1,2})\s*(?:일)?/g;
let m;
while((m=re.exec(t))){
if(validDate(m[1],m[2],m[3]))
a.push(`${m[1]}.${m[2].padStart(2,'0')}.${m[3].padStart(2,'0')}`);
}
return a;
}

function labeledDate(s,label){
const lines=String(s).split('\n');
for(let i=0;i<lines.length;i++){
if(!label.test(lines[i]))continue;
const same=dates(lines[i]);
if(same.length)return same[same.length-1];
const next=dates(lines[i+1]||'');
if(next.length)return next[next.length-1];
}
return null;
}

function pickDate(texts){
const counts=new Map();
for(const t of texts){
for(const d of dates(t))
counts.set(d,(counts.get(d)||0)+1);
}
const ranked=[...counts].sort((a,b)=>b[1]-a[1]);
if(ranked.length===1)return ranked[0][0];
if(ranked.length&&ranked[0][1]>ranked[1][1])return ranked[0][0];
return null;
}

function plate(s){
const m=String(s).match(/\d{2,3}\s*[가-힣]\s*\d{4}/);
return m?m[0].replace(/\s/g,''):null;
}

function decisionOf(s){
const t=compact(s);
const i=t.lastIndexOf('최종판정');
if(i>=0){
const nearby=t.slice(i,i+55);
if(/부적합/.test(nearby))return'fail';
if(/적합/.test(nearby))return'pass';
}
return'unknown';
}

function faultBlock(s){
const t=String(s||'');
const start=/<\s*부\s*적\s*합\s*>/.exec(t);
if(!start)return null;
let tail=t.slice(start.index+start[0].length);
const end=/<\s*종\s*합\s*의\s*견\s*>|종\s*합\s*의\s*견|최\s*종\s*판\s*정/.exec(tail);
if(end)tail=tail.slice(0,end.index);
return tail;
}

function faultsOf(texts){
const blocks=texts.map(faultBlock).filter(Boolean).map(s=>s.replace(/\n/g,' ').trim());
if(!blocks.length)return[];
const selected=blocks.sort((a,b)=>b.length-a.length)[0];
let depth=0,buf='',out=[];
for(const ch of selected){
if(ch==='[')depth++;
if(ch===']')depth--;
if((ch===','||ch==='，')&&depth===0){
out.push(buf.trim());
buf='';
}else buf+=ch;
}
if(buf.trim())out.push(buf.trim());
return out.filter(s=>
s.length>3&&s.length<100&&!/종합의견|재검사하시기|자동차관리법/.test(s)
);
}

function phraseStatus(s,anchor){
const t=compact(s);
const m=anchor.exec(t);
if(!m)return'unknown';
const tail=t.slice(m.index+m[0].length,m.index+m[0].length+38);
const v=/(점검요|불량|부적합|양호합니다|양호|정상)/.exec(tail);
if(!v)return'unknown';
return /점검요|불량|부적합/.test(v[1])?'check':'good';
}

function opinionStates(s){
const anchors=[
/조향계통|조향계동/,
/주행계통|주행계동/,
/제동계통|제동계동/,
/등화장치|등화계통/,
/배출가스/,
/계기계통|계기계동/
];
return Object.fromEntries(
KEYS.map((k,i)=>[k,i<6?phraseStatus(s,anchors[i]):'unknown'])
);
}

function drivingState(s){
const t=compact(s);
if(/(?:변속기|차축|주행).{0,22}(점검요|불량|부적합)/.test(t))return'check';
if(/(?:변속기|차축|주행).{0,22}(양호|좋음)/.test(t))return'good';
return'unknown';
}

function sensorState(s){
const t=compact(s);
const m=/(전자제어센서|센서진단결과)/.exec(t);
if(!m)return'unknown';
const near=t.slice(m.index,m.index+85);
if(/(?:진단결과|진단).{0,30}(이상|불량|고장)/.test(near))return'check';
if(/(?:진단결과|진단).{0,30}정상/.test(near))return'good';
return'unknown';
}

function modelOf(s){
const lines=String(s).split('\n');
for(let i=0;i<lines.length;i++){
const m=/차\s*명\s*[:：|]?\s*([가-힣A-Za-z0-9ⅡⅢ() -]{2,30})/.exec(lines[i]);
if(m){
const v=m[1].split(/최초|등록|차대|소유|주행/)[0].trim();
if(v.length>1)return v;
}
}
return null;
}

function mileageOf(s){
const m=String(s).match(/(\d{1,3}(?:,\d{3})+|\d{4,7})\s*km/i);
return m?Number(m[1].replace(/,/g,'')).toLocaleString('ko-KR')+' km':null;
}

function translateFault(s,language){
if(language==='ko')return s;
const ix={en:1,zh:2,vi:3}[language];
const c=compact(s);
for(const f of FAULTS){
if(c===compact(f[0])||c.includes(compact(f[0])))return f[ix];
}
return null;
}

function add(parent,tag,value,cls){
const el=document.createElement(tag);
if(cls)el.className=cls;
el.textContent=value;
parent.appendChild(el);
return el;
}

function render(){
if(!result)return;
const t=LABELS[$('language').value];
const r=result;
const box=$('decisionBox');
box.className='result '+r.decision;
$('decisionTitle').textContent=
r.decision==='pass'?t.pass:r.decision==='fail'?t.fail:t.unknown;
$('dateLabel').textContent=r.decision==='fail'?t.deadline:t.next;
$('dateValue').textContent=r.date||t.verify;
$('infoTitle').textContent=t.info;
$('itemsTitle').textContent=t.items;
$('faultTitle').textContent=t.faults;

const info=$('infoRows');
info.replaceChildren();
r.basic.forEach((v,i)=>{
const row=add(info,'div','','info');
add(row,'div',t.fields[i]);
add(row,'div',v==='RECHECK'?t.recheck:v||t.verify);
});

const items=$('itemRows');
items.replaceChildren();
KEYS.forEach((k,i)=>{
const row=add(items,'div','','item');
add(row,'span',t.names[i]);
const s=r.states[k];
add(row,'span',
s==='good'?t.good:s==='check'?t.check:t.unread,
'pill '+(s==='unknown'?'unknownpill':s)
);
});

const fs=$('faultRows');
fs.replaceChildren();
if(!r.faults.length)add(fs,'p',t.noFault,'notice');
for(const f of r.faults){
const trans=translateFault(f,$('language').value);
const card=add(fs,'div',
trans||($('language').value==='ko'?f:t.verify),'fault');
if($('language').value!=='ko')
add(card,'div',f,'notice');
}

$('frontRaw').value=scrub(r.frontText);
$('backRaw').value=scrub(r.backText);
$('detailRaw').value=scrub(r.detail);
$('output').classList.remove('hidden');
}

async function analyze(){
const rev=revision;
if(!frontImage||!backImage){
$('error').textContent='앞면과 뒷면 사진을 모두 선택해주세요.';
return;
}
const btn=$('analyze');
btn.disabled=true;
$('error').textContent='';
$('output').classList.add('hidden');
result=null;

try{
const f=page(frontImage);
const b=page(backImage);

$('progress').textContent='앞면 기본정보 분석 중...';
const frontFull=await ocr(page(frontImage,1250),3);
const frontTop=await ocr(crop(f,[.09,.075,.83,.15],2.2),6);
const frontTop2=await ocr(crop(f,[.09,.075,.83,.15],2.2,true),6);
const left=await ocr(crop(f,[.10,.095,.37,.11],2.5),6);
const right=await ocr(crop(f,[.48,.095,.43,.12],2.5),6);
const failDate1=await ocr(crop(f,[.42,.145,.27,.06],3),6);
const failDate2=await ocr(crop(f,[.42,.145,.27,.06],3,true),6);

$('progress').textContent='검사 항목별 판독 중...';
const opinion=await ocr(crop(f,[.66,.20,.18,.74],2.5),6);
const opinion2=await ocr(crop(f,[.66,.20,.18,.74],2.5,true),6);
const driving=await ocr(crop(f,[.43,.25,.24,.10],3),6);
const lighting=await ocr(crop(f,[.48,.54,.36,.15],2.3),6);

$('progress').textContent='뒷면 판정 및 부적합 사유 분석 중...';
const backFull=await ocr(page(backImage,1250),3);
const backDecision=await ocr(crop(b,[.10,.38,.84,.42],2),6);
const backDecision2=await ocr(crop(b,[.10,.38,.84,.42],2,true),6);
const sensor=await ocr(crop(b,[.42,.13,.48,.14],2.4),6);
const backPlate=await ocr(crop(b,[.10,.01,.32,.07],2.6),7);

if(rev!==revision)
throw Error('사진이 변경되었습니다. 다시 분석해주세요.');

const fp=plate(left)||plate(frontTop)||plate(frontFull);
const bp=plate(backPlate)||plate(backFull);

if(fp&&bp&&fp!==bp)
throw Error('앞면과 뒷면의 차량번호가 다릅니다. 같은 차량 사진을 선택해주세요.');

const backAll=backDecision+'\n'+backDecision2+'\n'+backFull;
const dec=decisionOf(backAll);
const defects=faultsOf([backDecision,backDecision2,backFull]);

const states=opinionStates(opinion+'\n'+opinion2);
const d=drivingState(driving);
if(d!=='unknown')states.driving=d;

const l=compact(lighting);
if(
defects.some(x=>/등화|번호등|전조등|안개등|방향지시등/.test(x))||
/점검요|불량|부적합/.test(l)
){
states.lighting='check';
}else if(
/등화|전조등|번호등|광도|광축|점등/.test(l)&&
(/양호|정상/.test(l)||dec==='pass')
){
states.lighting='good';
}

states.sensors=sensorState(sensor+'\n'+backFull);

const insp=labeledDate(
left+'\n'+frontTop+'\n'+frontTop2,
/검\s*사\s*일\s*자/
)||null;

const first=labeledDate(
right+'\n'+frontTop,
/최\s*초\s*등\s*록/
)||null;

const label=dec==='fail'
?/재\s*검\s*사\s*(기\s*간|기\s*한)/
/다\s*음\s*검\s*사\s*일/;

const labelDate=labeledDate(frontTop+'\n'+frontTop2,label);
const cellDate=pickDate([failDate1,failDate2]);

let finalDate=null;
if(labelDate&&cellDate&&labelDate===cellDate)
finalDate=labelDate;
else if(labelDate&&!cellDate)
finalDate=labelDate;
else if(
cellDate&&!labelDate&&dec==='fail'&&
dates(failDate1).includes(cellDate)&&
dates(failDate2).includes(cellDate)
)
finalDate=cellDate;

const registration=fp||bp;
const model=modelOf(right+'\n'+frontTop+'\n'+frontTop2);
const mileage=mileageOf(right+'\n'+frontTop+'\n'+frontFull);

const basic=[
insp,
registration,
model,
first,
dec==='fail'?'RECHECK':dec==='pass'?finalDate:null,
dec==='fail'?finalDate:null,
mileage
];

if(rev!==revision)
throw Error('사진이 변경되었습니다. 다시 분석해주세요.');

result={
decision:dec,
date:finalDate,
basic,
states,
faults:defects,
frontText:frontFull+'\n'+frontTop,
backText:backFull+'\n'+backDecision,
detail:
'[주행계통 진단결과]\n'+driving+
'\n[앞면 진단의견]\n'+opinion+'\n'+opinion2+
'\n[등화장치]\n'+lighting+
'\n[센서]\n'+sensor+
'\n[재검사 날짜]\n'+failDate1+'\n'+failDate2
};

render();
$('progress').textContent='분석 완료. 판독 불가 항목은 원본과 비교해주세요.';
$('output').scrollIntoView({behavior:'smooth'});
}catch(e){
$('error').textContent='분석 오류: '+e.message;
$('progress').textContent='';
}finally{
btn.disabled=false;
}
}

$('front').addEventListener('change',async e=>{
revision++;
const rev=revision;
result=null;
frontImage=null;
backImage=null;
$('back').value='';
$('bp').style.display='none';
$('output').classList.add('hidden');
if(!e.target.files[0])return;
try{
const c=await imageFile(e.target.files[0]);
if(rev!==revision)return;
frontImage=c;
preview(c,'fc','fp');
}catch(e){
$('error').textContent=e.message;
}
});

$('back').addEventListener('change',async e=>{
revision++;
const rev=revision;
result=null;
backImage=null;
$('output').classList.add('hidden');
if(!e.target.files[0])return;
try{
const c=await imageFile(e.target.files[0]);
if(rev!==revision)return;
backImage=c;
preview(c,'bc','bp');
}catch(e){
$('error').textContent=e.message;
}
});

$('fr').onclick=()=>{
if(frontImage){
revision++;
frontImage=rotate(frontImage);
preview(frontImage,'fc','fp');
result=null;
$('output').classList.add('hidden');
}
};

$('br').onclick=()=>{
if(backImage){
revision++;
backImage=rotate(backImage);
preview(backImage,'bc','bp');
result=null;
$('output').classList.add('hidden');
}
};

$('analyze').onclick=analyze;
$('language').onchange=render;
</script>
</body>
</html>
