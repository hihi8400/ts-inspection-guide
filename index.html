const cats=[
{
names:['조향계통','Steering System','转向系统','Hệ thống lái'],
heading:/조향\s*계[통동]/,

},
{
names:['주행계통','Driving System','行驶系统','Hệ thống vận hành'],
heading:/주행\s*계[통동]/,
anchor:/차축.{0,5}타이어|타이어\s*마모|변속기\s*작동|추진축|클러치\s*유격/
},
{
names:['제동계통','Braking System','制动系统','Hệ thống phanh'],
heading:/제동\s*계[통동]/,
anchor:/전체\s*브레이크|제동력|앞축\s*무게|제동\s*계[통동]/
},
{
names:['등화장치','Lighting','灯光装置','Hệ thống đèn'],
heading:/등[화하]\s*장치/,
anchor:/전조등|등[화하]\s*장치|광도\s*:/
},
{
names:['배출가스','Emissions','尾气排放','Khí thải'],
heading:/배출\s*가스/,
anchor:/배출\s*가스|매연\s*농도|일산화탄소/
},
{
names:['계기계통','Instrument System','仪表系统','Hệ thống đồng hồ'],
heading:/계기\s*계[통동]/,
anchor:/계기\s*계[통동]|속도계\s*오차|계기판/
},
{
names:[
'자가진단 센서 점검',
'Self-Diagnostic Sensor Check',
'自诊断传感器检查',
'Kiểm tra cảm biến tự chẩn đoán'
],
heading:/자가?\s*진단\s*센서|자기\s*진단\s*센서|전자\s*제어\s*센서/
}
];

const dictionary=[
[
/^등화장치임의변경$/,
[
'등화장치 임의변경',
'Unauthorized modification of lighting equipment',
'擅自改装灯光装置',
'Tự ý thay đổi hệ thống đèn'
]
],
[
/^물품적재장치임의변경$/,
[
'물품적재장치 임의변경',
'Unauthorized modification of cargo-loading equipment',
'擅自改装载货装置',
'Tự ý thay đổi thiết bị chở hàng'
]
],
[
/^활어운반장치임의설치$/,
[
'활어운반장치 임의 설치',
'Unauthorized installation of live-fish transport equipment',
'擅自安装活鱼运输装置',
'Tự ý lắp đặt thiết bị vận chuyển cá sống'
]
],
[
/^안개등LED$/i,
[
'안개등 LED',
'Fog lamp LED',
'雾灯 LED',
'Đèn sương mù LED'
]
],
[
/^안개등임의변경$/,
[
'안개등 임의변경',
'Unauthorized modification of fog lights',
'擅自改装雾灯',
'Tự ý thay đổi đèn sương mù'
]
]

const norm=s=>String(s||'')
.replace(/[\s<>〈〉\[\](){}|:：,，.·\-]/g,'');

const canon=s=>String(s||'')
.replace(/등하\s*장치/g,'등화장치')
.replace(/룰품\s*적재/g,'물품적재');

function dateValue(y,m,d){
y=+y;
m=+m;
d=+d;
const z=new Date(y,m-1,d);

return z.getFullYear()===y &&
z.getMonth()===m-1 &&
z.getDate()===d
?`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`
:null;
}

function dateMatches(s){
const found=[];

for(const m of String(s).matchAll(
/(20\d{2})\s*[년.\/-]\s*(\d{1,2})\s*[월.\/-]\s*(\d{1,2})\s*일?/g
)){
const d=dateValue(m[1],m[2],m[3]);
if(d)found.push(d);
}

return [...new Set(found)];
}

function decision(front,back){
const values=[];

for(const txt of [front,back]){
for(const line of txt.split(/\r?\n/)){
const m=line.match(
/최종\s*판정\s*[:：]?\s*(부\s*적\s*합|적\s*합|불합격|합격)/
);

if(m){
values.push(
/부\s*적\s*합|불합격/.test(m[1])
?'fail':'pass'
);
}
}
}

return new Set(values).size===1
?values[0]:'unknown';
}

function dateNearLabel(text,status){
if(status==='unknown')return null;

const key=status==='fail'
?/재\s*검\s*사\s*(?:기\s*간|기\s*한)/
:/다\s*음\s*검\s*사\s*(?:일|날짜|기\s*간)/;

const lines=String(text).split(/\r?\n/);
const found=[];

for(let i=0;i<lines.length;i++){
const m=key.exec(lines[i]);
if(!m)continue;

const right=lines[i]
.slice(m.index+m[0].length)
.split(
/최초\s*등록일|검사\s*일자|주행\s*거리|차\s*명|차량\s*번호|차대\s*번호/
)[0];

let ds=dateMatches(right);

if(!ds.length){
const following=lines.slice(i+1,i+3)
.join(' ')
.split(
/최초\s*등록일|검사\s*일자|주행\s*거리|차\s*명|차량\s*번호|차대\s*번호/
)[0];

ds=dateMatches(following.slice(0,120));
}

found.push(...ds);
}

const unique=[...new Set(found)];

return unique.length===1
?unique[0]:null;
}

function isStop(line){
return /[<〈\[]\s*종\s*합\s*의\s*견|종\s*합\s*진\s*단|진\s*단\s*결\s*과|^\s*\[\s*1\s*\]\s*등[화하]\s*장치가/.test(line);
}

function cleanFault(s){
return String(s)
.replace(/^[^가-힣\[]+/,'')
.replace(/^[\s;:：|.]+|[\s;:：|.]+$/g,'')
.trim();
}

function validFault(s){
return s.length>=4 &&
s.length<=65 &&
!/검사소|자동차관리법|원상복구|조치를|하시기|진단결과|정비하여|과태료|고객님|튜닝/.test(s) &&
/임의\s*변경|임의\s*설치|기타\s*[\[［(（]/.test(s);
}

function faultBlocks(text){
const lines=text.split(/\r?\n/);
const out=[];

for(let i=0;i<lines.length;i++){
const head=lines[i].match(
/[<〈\[]\s*부\s*적\s*합\s*[>〉\]]/
);

if(!head)continue;

let section=lines[i].slice(
head.index+head[0].length
);

for(let j=i+1;j<Math.min(i+4,lines.length);j++){
if(
isStop(lines[j]) ||
/최종\s*판정|<리콜정보>/.test(lines[j])
)break;

if(
section.split(/[,，]/).length>=4 &&
! /^\s*기타\s*[\[［(（]/.test(lines[j])
)break;

section+=' '+lines[j];
}

section=section.split(
/[<〈\[]\s*종\s*합\s*의\s*견/
)[0];

const parts=section
.split(/[,，]/)
.map(cleanFault)
.filter(validFault);

if(parts.length){
out.push(parts.slice(0,8));
}
}

return out;
}

function rankFault(s){
const k=norm(canon(s));

if(/^(등화장치|물품적재장치)임의변경$/.test(k)){
return 5;
}

if(/활어운반장치임의설치/.test(k)){
return 5;
}

if(/기타.*안개등/.test(k)){
return 4;
}

return 1;
}

function extractFaults(back){
const blocks=faultBlocks(back);

if(!blocks.length)return [];

blocks.sort((a,b)=>
b.reduce((s,x)=>s+rankFault(x),0)-
a.reduce((s,x)=>s+rankFault(x),0)
||b.length-a.length
);

const seen=new Set();

return blocks[0].filter(s=>{
const key=norm(canon(s));

if(seen.has(key))return false;

seen.add(key);
return true;
}).slice(0,8);
}

function translation(raw){
const key=norm(
canon(raw).trim()
.replace(/^기타\s*[\[(（]\s*/,'')
.replace(/[\])）]\s*$/,'')
);

for(const [re,v] of dictionary){
if(re.test(key))return v;
}

return null;
}

// OCR 단어 좌표를 진단서 전체 좌표로 변환
function tsvWords(tsv,region){
if(!tsv)return [];

const out=[];

for(const row of tsv.split(/\r?\n/).slice(1)){
const c=row.split('\t');

if(c.length<12||c[0]!=='5')continue;

const s=c.slice(11).join('\t').trim();
if(!s)continue;

const left=+c[6];
const top=+c[7];
const w=+c[8];
const h=+c[9];

if(![left,top,w,h].every(Number.isFinite)){
continue;
}

out.push({
s,
x:region.x+(left+w/2)*region.w/region.pw,
y:region.y+(top+h/2)*region.h/region.ph,
key:c.slice(1,5).join('_'),
confidence:+c[10]
});
}

return out;
}

// OCR 단어를 같은 행끼리 묶음
function makeLines(words){
const groups=new Map();

for(const w of words){
if(!groups.has(w.key)){
groups.set(w.key,[]);
}

groups.get(w.key).push(w);
}

return [...groups.values()].map(a=>{
a.sort((x,y)=>x.x-y.x);

return{
text:a.map(w=>w.s).join(' '),
x:Math.min(...a.map(w=>w.x)),
y:a.reduce((s,w)=>s+w.y,0)/a.length,
words:a
};
}).sort((a,b)=>a.y-b.y);
}

// 핵심 개선: 항목의 세로 영역과 진단의견 열을 연결
function tableStates(wordSets,width,height){
const results=Array(6).fill('unread');
const anchors=Array(6).fill(null);

// 검사 항목의 시작 위치 검색
for(const words of wordSets){
if(!words.length)continue;

const lines=makeLines(words);
let last=height*.15;

for(let i=0;i<6;i++){
const candidates=lines.filter(l=>
l.y>=last+height*.008 &&
l.y<=height*.98 &&
cats[i].anchor.test(l.text)
);

if(candidates.length){
anchors[i]=anchors[i]===null
?candidates[0].y
:Math.min(anchors[i],candidates[0].y);

last=candidates[0].y;
}else if(anchors[i]!==null){
last=anchors[i];
}
}
}

// 각 항목의 진단의견 열만 판독
for(const words of wordSets){
if(!words.length)continue;

const header=words.find(w=>
/진단\s*의견/.test(w.s) &&
w.x>width*.58
);

const xLimit=header
?Math.max(width*.69,header.x-width*.05)
:width*.75;

for(let i=0;i<6;i++){
if(anchors[i]===null)continue;

const next=anchors.slice(i+1)
.find(v=>v!==null);

const bottom=Math.min(
next===undefined?height:next-height*.009,
anchors[i]+height*.30
);

if(bottom<=anchors[i])continue;

// 해당 항목의 높이 + 진단의견 열에 있는 단어만 선택
const hits=words.filter(w=>
w.y>=anchors[i]-height*.012 &&
w.y<bottom &&
w.x>=xLimit &&
w.x<width*.995
);

const text=hits.map(w=>w.s).join(' ');

if(/점\s*검\s*요|점검\s*필요|불\s*량/.test(text)){
results[i]='need';
}else if(
/양\s*호|정\s*상/.test(text) &&
results[i]!=='need'
){
results[i]='good';
}
}
}

return results;
}

// 좌표가 없을 때는 명확한 텍스트만 사용
function textStates(front){
const states=Array(6).fill('unread');

for(const line of front.split(/\r?\n/)){
for(let i=0;i<6;i++){
if(!cats[i].heading.test(line))continue;

const after=line.slice(
line.search(cats[i].heading)
);

if(/점\s*검\s*요|점검\s*필요|불\s*량/.test(after)){
states[i]='need';
}else if(
/부분\s*양\s*호|진단의견\s*양\s*호/.test(after) &&
states[i]!=='need'
){
states[i]='good';
}
}

// 제동계통의 명시적인 진단의견
if(
/전체\s*브레이크.{0,95}부분\s*양\s*호/.test(line) &&
states[2]!=='need'
){
states[2]='good';
}
}

return states;
}

function allStates(front,back,faults,geometry){
const s=textStates(front);

// 표 좌표를 사용할 수 있으면 우선 적용
if(geometry){
const g=tableStates(
geometry.sets,
geometry.w,
geometry.h
);

for(let i=0;i<6;i++){
if(g[i]!=='unread'){
s[i]=g[i];
}
}
}

s.push('unread');

// 뒷면의 센서 진단결과
if(
/(?:전자\s*제어\s*센서[\s\S]{0,28}진단\s*결과|센서\s*진단\s*결과)[\s\S]{0,22}정\s*상/.test(back)
){
s[6]='good';
}

// 부적합 목록에 명시된 항목은 점검요
for(const raw of faults){
const k=norm(canon(raw));

if(/등화|안개등|전조등|제동등|방향지시등/.test(k)){
s[3]='need';
}

if(/조향|타이로드/.test(k)){
s[0]='need';
}

if(/브레이크|제동계통|제동력/.test(k)){
s[2]='need';
}

if(/타이어|주행계통|차축/.test(k)){
s[1]='need';
}

if(/배출가스|매연/.test(k)){
s[4]='need';
}

if(/계기계통|속도계/.test(k)){
s[5]='need';
}
}

return s;
}

let frontText='';
let backText='';
let dateText='';
let manualDate='';
let geometry=null;
let result=null;
let busy=false;

function parse(){
const status=decision(frontText,backText);
const faults=extractFaults(backText);

const fromFront=dateNearLabel(frontText,status);
const fromCrop=dateNearLabel(dateText,status);

const recognized=[
...new Set(
[fromFront,fromCrop].filter(Boolean)
)
];

return{
status,
date:manualDate||(
recognized.length===1?recognized[0]:null
),
faults,
states:allStates(
frontText,backText,faults,geometry
)
};
}

function el(tag,cls,value){
const e=document.createElement(tag);

if(cls)e.className=cls;
if(value!==undefined)e.textContent=value;

return e;
}

function render(){
if(!result)return;

const lang=$('lang').value;
const idx=languages.indexOf(lang);
const t=L[lang];

$('resultTitle').textContent=t.title;
$('itemTitle').textContent=t.items;
$('findingTitle').textContent=t.findings;
$('itemHelp').textContent=t.help;
$('warn').textContent=t.warn;

const hero=$('hero');
hero.replaceChildren();

const h=el(
'div',
'hero '+(
result.status==='fail'?'fail':
result.status==='pass'?'pass':'unknown'
)
);

h.append(el(
'b','',
result.status==='fail'?t.fail:
result.status==='pass'?t.pass:t.unknown
));

if(result.status!=='unknown'){
h.append(el(
'div','label',
result.status==='fail'?t.deadline:t.next
));

h.append(el(
'div','date',
result.date||t.date
));
}

hero.append(h);

$('rows').replaceChildren();

result.states.forEach((state,i)=>{
const tr=el('tr');

tr.append(el(
'td','',
cats[i].names[idx]
));

tr.append(el(
'td',
state==='good'?'good':
state==='need'?'need':'unread',
state==='good'?t.good:
state==='need'?t.need:t.unread
));

$('rows').append(tr);
});

$('findings').replaceChildren();

if(result.faults.length){
for(const raw of result.faults){
const tr=translation(raw);
const box=el('div','issue');

box.append(el(
'div','translated',
tr?tr[idx]:t.verify
));

box.append(el(
'div','original',
raw
));

$('findings').append(box);
}
}else if(
result.status==='pass' &&
/종합\s*진단\s*결과[\s\S]{0,65}(이상\s*없음|양호)/.test(backText)
){
$('findings').append(el(
'div','good',t.noIssues
));
}else{
$('findings').append(el(
'div','unread',t.missing
));
}

$('result').style.display='block';
}

function preview(side){
const file=$(side).files[0];
const img=$(side+'Img');

if(img.dataset.url){
URL.revokeObjectURL(img.dataset.url);
}

if(file){
img.dataset.url=URL.createObjectURL(file);
img.src=img.dataset.url;
img.style.display='block';
}
}

function canvasFor(file){
return new Promise((resolve,reject)=>{
const img=new Image();
const url=URL.createObjectURL(file);

img.onload=()=>{
const scale=Math.min(
2.4,
3000/img.width,
4000/img.height
);

const c=document.createElement('canvas');

c.width=Math.max(
1,Math.round(img.width*scale)
);

c.height=Math.max(
1,Math.round(img.height*scale)
);

c.getContext('2d').drawImage(
img,0,0,c.width,c.height
);

URL.revokeObjectURL(url);
resolve(c);
};

img.onerror=()=>{
URL.revokeObjectURL(url);
reject(Error('사진을 열 수 없습니다.'));
};

img.src=url;
});
}

function cropRect(c,x,y,w,h,scale=1){
const o=document.createElement('canvas');

o.width=Math.max(
1,Math.round(c.width*w*scale)
);

o.height=Math.max(
1,Math.round(c.height*h*scale)
);

o.getContext('2d').drawImage(
c,
c.width*x,
c.height*y,
c.width*w,
c.height*h,
0,0,
o.width,
o.height
);

return{
canvas:o,
region:{
x:c.width*x,
y:c.height*y,
w:c.width*w,
h:c.height*h,
pw:o.width,
ph:o.height
}
};
}

async function analyze(){
if(busy)return;

const f=$('front').files[0];
const b=$('back').files[0];

if(!f||!b){
$('progress').textContent=
'앞면과 뒷면을 모두 선택해 주세요.';
return;
}

if(!window.Tesseract){
$('progress').textContent=
'OCR를 불러오지 못했습니다. 인터넷을 확인하세요.';
return;
}

busy=true;
$('run').disabled=true;
let worker;

try{
$('progress').textContent='한글 OCR 준비 중...';

worker=await Tesseract.createWorker(
'kor+eng',1,{
logger:m=>{
if(m.status==='recognizing text'){
$('progress').textContent=
'문자 인식 '+Math.round(
(m.progress||0)*100
)+'%';
}
}
}
);

// 앞면 전체 OCR 및 좌표 분석
const fc=await canvasFor(f);

$('progress').textContent=
'앞면 전체 및 표 위치 분석 중...';

const all=await worker.recognize(
fc,{},{tsv:true}
);

const fullRegion={
x:0,
y:0,
w:fc.width,
h:fc.height,
pw:fc.width,
ph:fc.height
};

const sets=[
tsvWords(all.data.tsv,fullRegion)
];

// 표 부분을 확대하여 별도 판독
const table=cropRect(
fc,0,.22,1,.76,1.3
);

const tbl=await worker.recognize(
table.canvas,{},{tsv:true}
);

sets.push(
tsvWords(tbl.data.tsv,table.region)
);

frontText=
(all.data.text||'')+
'\n\n'+
(tbl.data.text||'');

geometry={
sets,
w:fc.width,
h:fc.height
};

// 앞면 날짜 영역 확대 판독
$('progress').textContent=
'앞면 날짜 영역 확대 판독 중...';

const dateCrop=cropRect(
fc,0,.08,1,.25,1.6
);

const d1=await worker.recognize(
dateCrop.canvas
);

dateText=d1.data.text||'';

// 날짜를 읽지 못했을 때 다른 OCR 설정으로 재시도
if(
!dateNearLabel(frontText+'\n'+dateText,'fail') &&
!dateNearLabel(frontText+'\n'+dateText,'pass')
){
await worker.setParameters({
tessedit_pageseg_mode:'6'
});

const d2=await worker.recognize(
dateCrop.canvas
);

dateText+='\n'+(d2.data.text||'');

await worker.setParameters({
tessedit_pageseg_mode:'3'
});
}

// 뒷면 부적합 항목 판독
$('progress').textContent=
'뒷면 부적합 항목 분석 중...';

const bc=await canvasFor(b);

const backAll=await worker.recognize(bc);

const backArea=cropRect(
bc,0,.38,1,.54,1.3
);

const backPart=await worker.recognize(
backArea.canvas
);

backText=
(backAll.data.text||'')+
'\n\n'+
(backPart.data.text||'');

manualDate='';
$('dateEdit').value='';

$('frontOcr').value=
frontText+
'\n\n[날짜 영역 재인식]\n'+
dateText;

$('backOcr').value=backText;

result=parse();
render();

$('progress').textContent=
'분석 완료 — 원본과 대조해 주세요.';

$('result').scrollIntoView({
behavior:'smooth'
});

}catch(e){
$('progress').textContent=
'분석 오류: '+e.message;
}finally{
if(worker){
await worker.terminate().catch(()=>{});
}

busy=false;
$('run').disabled=false;
}
}

function apply(){
const raw=$('dateEdit').value.trim();

if(raw){
if(
!/^20\d{2}\.\d{2}\.\d{2}$/.test(raw) ||
dateMatches(raw)[0]!==raw
){
$('progress').textContent=
'날짜는 원본 확인 후 YYYY.MM.DD 형식으로 입력하세요.';
return;
}

manualDate=raw;
}else{
manualDate='';
}

frontText=$('frontOcr').value;
backText=$('backOcr').value;

dateText='';
geometry=null;

result=parse();
render();

$('progress').textContent=
'수정 내용 적용 완료 — 원본과 대조해 주세요.';
}

$('lang').addEventListener(
'change',render
);

$('front').addEventListener(
'change',()=>preview('front')
);

$('back').addEventListener(
'change',()=>preview('back')
);

$('run').addEventListener(
'click',analyze
);

$('apply').addEventListener(
'click',apply
);
</script>
