
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자동차검사 다국어 결과 안내</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf3f9;color:#19304a;font-family:Arial,"Malgun Gothic",sans-serif}
header{background:#194e86;color:white;text-align:center;padding:24px 12px}
header h1{font-size:23px;margin:0 0 7px}
header p{margin:0;font-size:13px}
main{max-width:680px;margin:auto;padding:14px}
.card{background:white;border-radius:17px;padding:19px;margin-bottom:15px;box-shadow:0 2px 9px #0001}
h2{font-size:19px;margin:0 0 15px}
select,button{width:100%;padding:15px;border-radius:11px;font-size:16px}
select{border:1px solid #cbd5e1;background:white}
button{border:0;background:#1659a4;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55}
.upload{display:block;border:2px dashed #8eb1d4;background:#eff6ff;padding:18px;text-align:center;border-radius:12px;margin:12px 0;font-weight:bold}
.upload input{display:block;width:100%;margin-top:12px;font-size:14px}
.preview{display:none;width:100%;max-height:190px;object-fit:contain;margin:10px 0}
#result{display:none}
.hero{text-align:center;border-radius:16px;padding:22px 12px;margin:12px 0}
.hero small{font-size:14px;font-weight:bold}
.hero strong{display:block;font-size:32px;margin:9px 0;overflow-wrap:anywhere}
.fail{background:#ffe6e6;color:#a81e1e;border:2px solid #edb0b0}
.pass{background:#e3f7ea;color:#147642;border:2px solid #b2e2c2}
.unknown{background:#fff0d4;color:#855d0b;border:2px solid #eed59e}
table{width:100%;border-collapse:collapse}
td{padding:15px 7px;border-bottom:1px solid #e2e8f0;font-size:15px;vertical-align:middle}
td:first-child{width:38%;font-weight:bold}
.ok{color:#16834b;font-weight:bold}
.bad{color:#b52626;font-weight:bold}
.check{color:#91660e;font-weight:bold}
#progress{font-weight:bold;color:#175ba6;white-space:pre-wrap;line-height:1.7}
.note{font-size:12px;color:#64748b;line-height:1.7}
.warning{background:#fff3df;padding:13px;border-radius:10px;font-size:13px;line-height:1.7;margin-top:17px}
details{margin-top:15px}
pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}
</style>
</head>
<body>
<header>
<h1>자동차검사 결과 안내</h1>
<p>Vehicle Inspection Result</p>
</header>
<main>
<section class="card">
<h2>① 언어 선택 / Language</h2>
<select id="lang">
<option value="ko">한국어</option>
<option value="en">English</option>
<option value="zh">中文</option>
<option value="vi">Tiếng Việt</option>
</select>
</section>

<section class="card">
<h2>② 진단서 사진 / Photos</h2>
<label class="upload">
📷 앞면 사진 / Front
<input id="front" type="file" accept="image/*">
</label>
<img id="frontPreview" class="preview">
<label class="upload">
📷 뒷면 사진 / Back
<input id="back" type="file" accept="image/*">
</label>
<img id="backPreview" class="preview">
<p class="note">
개인정보를 가린 시험용 진단서만 사용하세요.
사진은 브라우저 안에서 OCR 처리합니다.
</p>
</section>

<section class="card">
<h2>③ 자동 분석 / Analysis</h2>
<button id="runBtn" type="button">진단서 분석하기</button>
<p id="progress" role="status" aria-live="polite">사진을 선택한 뒤 버튼을 눌러주세요.</p>
</section>

<section class="card" id="result">
<h2 id="resultTitle"></h2>
<div id="top"></div>
<h2 id="tableTitle"></h2>
<table><tbody id="rows"></tbody></table>
<div class="warning" id="warning"></div>
<details>
<summary>OCR 인식 내용 확인 / OCR text</summary>
<pre id="raw"></pre>
</details>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
"use strict";

const $ = id => document.getElementById(id);
const languages = ["ko","en","zh","vi"];

const labels = {
ko:{
result:"검사 결과",pass:"최종 합격",fail:"최종 불합격",
unknown:"판정 확인 필요",deadline:"재검사 기한",
noDate:"기한 확인 필요",table:"검사 항목별 결과",
good:"이상 없음",bad:"부적합",check:"확인 필요",
running:"사진 분석 중",done:"분석 완료",
warning:"OCR 시험용입니다. 판정, 부적합 사유, 재검사 기한은 반드시 원본 진단서에서 확인하세요."
},
en:{
result:"Inspection result",pass:"PASS",fail:"FAIL",
unknown:"VERIFY RESULT",deadline:"REINSPECTION DEADLINE",
noDate:"CHECK DEADLINE",table:"Inspection details",
good:"No issues",bad:"Failed",check:"Check required",
running:"Analyzing photos",done:"Analysis complete",
warning:"OCR test only. Verify the result, defects and deadline on the original report."
},
zh:{
result:"检测结果",pass:"检测合格",fail:"检测不合格",
unknown:"需确认结果",deadline:"复检截止日期",
noDate:"请确认日期",table:"各项检测结果",
good:"无异常",bad:"不合格",check:"需要确认",
running:"正在分析照片",done:"分析完成",
warning:"仅供OCR测试。请核对正式报告中的检测结果及复检期限。"
},
vi:{
result:"Kết quả kiểm định",pass:"ĐẠT",fail:"KHÔNG ĐẠT",
unknown:"CẦN XÁC MINH",deadline:"HẠN KIỂM ĐỊNH LẠI",
noDate:"CẦN KIỂM TRA NGÀY",table:"Kết quả từng hạng mục",
good:"Không có lỗi",bad:"Không đạt",check:"Cần kiểm tra",
running:"Đang phân tích ảnh",done:"Đã phân tích",
warning:"Chỉ để thử nghiệm OCR. Hãy kiểm tra kết quả và thời hạn trên giấy gốc."
}
};

const systems = [
{
name:["조향계통","Steering","转向系统","Hệ thống lái"],
terms:/조향|타이로드|조향핸들/,
faults:[
[/유격|불량|손상/,
["조향장치 이상","Steering fault","转向系统故障","Lỗi hệ thống lái"]]
]
},
{
name:["주행계통","Driving","行驶系统","Hệ thống vận hành"],
terms:/타이어|현가|차축|주행|휠/,
faults:[
[/타이어.{0,20}(마모|손상)/,
["타이어 마모·손상","Tire worn or damaged","轮胎磨损或损坏","Lốp mòn hoặc hỏng"]],
[/현가|차축|주행/,
["주행장치 이상","Driving system fault","行驶系统异常","Lỗi hệ thống vận hành"]]
]
},
{
name:["제동계통","Brakes","制动系统","Hệ thống phanh"],
terms:/제동|브레이크/,
faults:[
[/후축|후륜|뒷브레이크/,
["뒷브레이크 이상","Rear brake fault","后轮制动异常","Lỗi phanh sau"]],
[/전축|전륜|앞브레이크/,
["앞브레이크 이상","Front brake fault","前轮制动异常","Lỗi phanh trước"]],
[/주차제동|주차브레이크/,
["주차브레이크 이상","Parking brake fault","驻车制动故障","Lỗi phanh đỗ"]],
[/제동|브레이크/,
["브레이크 이상","Brake fault","制动异常","Lỗi phanh"]]
]
},
{
name:["등화장치","Lights","灯光系统","Hệ thống đèn"],
terms:/전조등|변별빔|하향등|제동등|번호판등|방향지시등|후미등/,
faults:[
[/전조등|변별빔|하향등/,
["전조등 광도·점등 이상","Headlight too dim or not working","前照灯亮度不足或不亮","Đèn pha yếu hoặc không sáng"]],
[/제동등/,
["제동등 점등 이상","Brake light not working","刹车灯不亮","Đèn phanh không sáng"]],
[/번호판등/,
["번호판등 점등 이상","License plate light not working","车牌灯不亮","Đèn biển số không sáng"]],
[/방향지시등/,
["방향지시등 이상","Turn signal fault","转向灯故障","Lỗi đèn xi nhan"]],
[/후미등/,
["후미등 이상","Rear light fault","尾灯故障","Lỗi đèn hậu"]]
]
},
{
name:["배출가스","Emissions","尾气排放","Khí thải"],
terms:/배출가스|매연|일산화탄소|탄화수소|\bCO\b|\bHC\b/,
faults:[
[/\bCO\b|일산화탄소/,
["CO 기준 초과","CO too high","CO超标","CO vượt mức"]],
[/\bHC\b|탄화수소/,
["HC 기준 초과","HC too high","HC超标","HC vượt mức"]],
[/매연/,
["매연 기준 초과","Smoke too high","烟度超标","Khói thải vượt mức"]],
[/배출가스/,
["배출가스 이상","Emissions fault","尾气排放异常","Lỗi khí thải"]]
]
},
{
name:["기타장치","Other","其他装置","Hệ thống khác"],
terms:/속도계|계기장치|경음기|차체/,
faults:[
[/속도계|계기장치|경음기|차체/,
["기타장치 이상","Other fault","其他装置异常","Lỗi hệ thống khác"]]
]
}
];

let latest = null;
let busy = false;

function status(text){
$("progress").textContent = text;
}

function preview(input,imgId){
const img=$(imgId);
if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);
if(input.files && input.files[0]){
const url=URL.createObjectURL(input.files[0]);
img.dataset.url=url;
img.src=url;
img.style.display="block";
status("사진 선택 완료. 분석 버튼을 눌러주세요.");
}
}

$("front").addEventListener("change",function(){
preview(this,"frontPreview");
});
$("back").addEventListener("change",function(){
preview(this,"backPreview");
});

/* 버튼 클릭을 직접 연결 */
$("runBtn").addEventListener("click",function(){
status("버튼 작동 확인! 분석을 시작합니다...");
setTimeout(function(){
analyze().catch(function(error){
status("분석 오류: "+error.message);
busy=false;
$("runBtn").disabled=false;
});
},50);
});

function node(tag,text,cls){
const e=document.createElement(tag);
e.textContent=text||"";
if(cls)e.className=cls;
return e;
}

function hero(parent,label,value,cls){
const box=node("div","","hero "+cls);
box.append(node("small",label));
box.append(node("strong",value));
parent.append(box);
}

/* 사진 크기 조절과 명암 보정 */
async function prepare(file){
const bitmap=await createImageBitmap(file);
const scale=Math.min(2,2400/bitmap.width);
const c=document.createElement("canvas");
c.width=Math.max(1,Math.round(bitmap.width*scale));
c.height=Math.max(1,Math.round(bitmap.height*scale));
const ctx=c.getContext("2d",{willReadFrequently:true});
ctx.drawImage(bitmap,0,0,c.width,c.height);
bitmap.close();

const im=ctx.getImageData(0,0,c.width,c.height);
for(let i=0;i<im.data.length;i+=4){
let v=.299*im.data[i]+.587*im.data[i+1]+.114*im.data[i+2];
v=Math.max(0,Math.min(255,(v-128)*1.4+128));
im.data[i]=im.data[i+1]=im.data[i+2]=v;
}
ctx.putImageData(im,0,0);
return c;
}

function crop(c,x,y,w,h){
const out=document.createElement("canvas");
out.width=Math.max(1,Math.round(c.width*w));
out.height=Math.max(1,Math.round(c.height*h));
out.getContext("2d").drawImage(
c,c.width*x,c.height*y,c.width*w,c.height*h,
0,0,out.width,out.height
);
return out;
}

function finalDecision(text){
const lines=text.split(/\n/);
for(let i=0;i<lines.length;i++){
if(!/최종\s*판정/.test(lines[i]))continue;
const s=lines.slice(i,i+2).join(" ");
if(/부\s*적\s*합/.test(s))return "fail";
if(/적\s*합/.test(s))return "pass";
}
return "unknown";
}

function getFaultLines(text){
const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
const start=lines.findIndex(x=>/종합\s*진단\s*결과/.test(x));
if(start<0)return [];
const part=[];
for(let i=start+1;i<Math.min(start+50,lines.length);i++){
if(/재검사|검사비용|검사책임자/.test(lines[i]))break;
part.push(lines[i]);
}
return part.filter(x=>/^\s*[\[(]?\d{1,2}[\])\].?/.test(x));
}

function isNegative(s){
return /부적합|불량|미달|초과|점등되지|작동하지|결함|기준치.*미달/.test(s);
}

function classify(back,front,final){
const faults=getFaultLines(back);
const frontLines=front.split(/\n/);

return systems.map(sys=>{
const matches=faults.filter(s=>sys.terms.test(s)&&isNegative(s));
if(matches.length){
const evidence=matches.join(" ");
const found=sys.faults.find(x=>x[0].test(evidence));
return {
status:"bad",
message:found?found[1]:
["검사 항목 이상","Inspection fault","检测项目异常","Lỗi kiểm định"]
};
}

if(final==="pass")return {status:"good"};

const good=frontLines.some(s=>
sys.terms.test(s)&&
/양호|적합|이상\s*없음/.test(s)&&
!/부적합|불량|미달|초과/.test(s)&&
s.length<80
);
return {status:good?"good":"unknown"};
});
}

function getDeadline(back){
const lines=back.split(/\n/);
for(let i=0;i<lines.length;i++){
if(!/재검사|까지/.test(lines[i]))continue;
const s=lines.slice(Math.max(0,i-1),i+3).join(" ");
let m=s.match(/(20\d{2})\s*[년.\-/]\s*(\d{1,2})\s*[월.\-/]\s*(\d{1,2})/);
if(m)return `${m[1]}.${m[2].padStart(2,"0")}.${m[3].padStart(2,"0")}`;
m=s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일?\s*까지/);
if(m)return `${m[1]}월 ${m[2]}일 (연도 확인)`;
}
return null;
}

function render(){
const lang=$("lang").value;
const idx=languages.indexOf(lang);
const t=labels[lang];
$("resultTitle").textContent=t.result;
$("tableTitle").textContent=t.table;
$("warning").textContent=t.warning;
if(!latest)return;

const top=$("top");
top.replaceChildren();

if(latest.final==="fail"){
hero(top,t.deadline,latest.date||t.noDate,"fail");
hero(top,t.result,t.fail,"fail");
}else if(latest.final==="pass"){
hero(top,t.result,t.pass,"pass");
}else{
hero(top,t.result,t.unknown,"unknown");
if(latest.date)hero(top,t.deadline,latest.date,"unknown");
}

const rows=$("rows");
rows.replaceChildren();

latest.statuses.forEach((s,i)=>{
const tr=node("tr");
tr.append(node("td",systems[i].name[idx]));
if(s.status==="good"){
tr.append(node("td","✓ "+t.good,"ok"));
}else if(s.status==="bad"){
tr.append(node("td","✕ "+t.bad+" · "+s.message[idx],"bad"));
}else{
tr.append(node("td","? "+t.check,"check"));
}
rows.append(tr);
});

$("result").style.display="block";
}

$("lang").addEventListener("change",render);

async function analyze(){
if(busy)return;

const front=$("front").files[0];
const back=$("back").files[0];

if(!front&&!back){
status("사진을 먼저 선택해주세요.");
return;
}

busy=true;
$("runBtn").disabled=true;
$("result").style.display="none";

let worker=null;

try{
if(!window.Tesseract){
throw new Error("OCR 프로그램을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.");
}

status("OCR 한글 인식 프로그램 준비 중...");

worker=await Tesseract.createWorker("kor+eng",1,{
logger:m=>{
if(m.status==="recognizing text"){
status("글자 인식 중... "+Math.round((m.progress||0)*100)+"%");
}
}
});

async function read(file,isBack){
if(!file)return "";
const c=await prepare(file);
let text=(await worker.recognize(c)).data.text;

if(isBack){
const regions=[
crop(c,.10,.35,.82,.30),
crop(c,.10,.57,.82,.32)
];
for(let i=0;i<regions.length;i++){
status("뒷면 중요 영역 분석 "+(i+1)+"/2");
text+="\n"+(await worker.recognize(regions[i])).data.text;
}
}
return text;
}

status("뒷면 분석 중...");
const backText=await read(back,true);

status("앞면 분석 중...");
const frontText=await read(front,false);

$("raw").textContent=
"--- BACK ---\n"+backText+
"\n--- FRONT ---\n"+frontText;

const final=finalDecision(backText);

latest={
final:final,
date:getDeadline(backText),
statuses:classify(backText,frontText,final)
};

render();
status("✓ 분석 완료");
$("result").scrollIntoView({behavior:"smooth"});

}catch(error){
status("분석 오류: "+error.message);
}finally{
if(worker){
try{await worker.terminate()}catch(e){}
}
busy=false;
$("runBtn").disabled=false;
}
}
</script>
</body>
</html>
