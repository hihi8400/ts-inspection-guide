
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11598e">
<title>자동차검사 결과 안내</title>
<style>
:root{
  --navy:#102d49;
  --blue:#135d93;
  --line:#d9e4ef;
  --muted:#526779;
  --red:#a92323;
  --green:#13733e;
  --bg:#eef5fc
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--navy);
  font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;
  line-height:1.5
}
header{
  background:linear-gradient(115deg,#166ba5,#094579);
  color:#fff;
  padding:18px max(16px,calc((100vw - 1120px)/2));
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px
}
header .brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  font-size:clamp(19px,3vw,28px)
}
header .brand span{font-size:28px}
header small{
  display:block;
  font-size:13px;
  font-weight:500;
  opacity:.88
}
header select{
  width:auto;
  max-width:145px;
  background:white;
  color:#16334c;
  border:0;
  border-radius:10px;
  padding:11px 9px;
  font-size:15px;
  font-weight:750
}
main{
  max-width:1150px;
  margin:auto;
  padding:16px 14px 32px
}
.panel{
  background:white;
  border:1px solid #dbe8f4;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 12px #173e6610
}
h2{
  margin:0 0 15px;
  font-size:clamp(19px,2.5vw,24px);
  font-weight:900;
  letter-spacing:-.4px
}
.inputs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}
.upload{
  display:block;
  background:#f4f9fe;
  border:2px dashed #9bbbd4;
  border-radius:12px;
  padding:15px;
  font-weight:800;
  font-size:17px
}
.upload input{
  display:block;
  width:100%;
  margin-top:9px;
  font-size:14px;
  font-weight:400
}
button{
  border:0;
  border-radius:11px;
  background:#155e97;
  color:#fff;
  padding:14px 18px;
  font-size:18px;
  font-weight:850;
  cursor:pointer
}
button:disabled{opacity:.55}
#analyze{
  width:100%;
  margin-top:12px
}
#progress{
  color:#235779;
  font-size:15px;
  font-weight:700;
  white-space:pre-wrap;
  margin:12px 0 0
}
#result{display:none}
.hero{
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:12px;
  border-radius:20px;
  padding:24px 27px;
  margin-bottom:16px;
  border:1px solid #e8d4d4
}
.hero.fail{
  background:#ffe8e9;
  color:#a01818
}
.hero.pass{
  background:#e1f4e8;
  color:#12643a;
  border-color:#d0e8d8
}
.hero.unknown{
  background:#fff1db;
  color:#785321;
  border-color:#eadab9
}
.hero .outcome{
  font-size:clamp(29px,4vw,42px);
  font-weight:950;
  line-height:1.15;
  overflow-wrap:anywhere
}
.hero .sub{
  font-size:16px;
  margin-top:5px
}
.hero .date-block{
  border-left:2px solid currentColor;
  padding-left:23px
}
.hero .date-label{
  font-size:20px;
  font-weight:800
}
.hero .date{
  font-size:clamp(25px,4vw,37px);
  font-weight:950;
  line-height:1.25;
  margin-top:6px;
  overflow-wrap:anywhere
}
.meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 18px
}
.field{
  display:grid;
  grid-template-columns:43% 57%;
  border:1px solid #d4e0eb;
  border-radius:9px;
  overflow:hidden;
  min-height:49px
}
.field .key{
  background:#eaf3fd;
  padding:11px 12px;
  font-weight:800;
  font-size:16px
}
.field .value{
  padding:11px 12px;
  font-size:17px;
  font-weight:750;
  overflow-wrap:anywhere
}
.field.important .value{
  color:#a71c1c;
  background:#fff0ef
}
.field .value.missing{color:#7b674b}
.privacy{
  color:#536879;
  font-size:14px;
  margin:14px 0 0
}
.columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}
.item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  border-bottom:1px solid var(--line);
  padding:13px 3px;
  min-height:61px
}
.item:last-child{border-bottom:0}
.item-name{
  font-size:17px;
  font-weight:800
}
.state{
  display:inline-block;
  text-align:center;
  min-width:102px;
  max-width:185px;
  border-radius:9px;
  padding:6px 10px;
  font-weight:850;
  font-size:16px;
  line-height:1.3
}
.state.good{
  color:#096c33;
  background:#dff6e5
}
.state.need{
  color:#a32323;
  background:#ffe3e2
}
.state.unread{
  color:#4e5864;
  background:#e8edf2
}
.fault{
  border-left:6px solid #bc252a;
  border-radius:11px;
  background:#fff0f0;
  padding:15px 17px;
  margin-bottom:12px
}
.fault .translated{
  font-size:19px;
  font-weight:900;
  color:#a41c22;
  overflow-wrap:anywhere
}
.fault .original{
  font-size:14px;
  color:#5c6470;
  margin-top:6px;
  overflow-wrap:anywhere
}
.hint{
  font-size:14px;
  color:#637283;
  line-height:1.6
}
.alert{
  font-size:15px;
  color:#b02727;
  font-weight:800
}
.notice{
  background:#fff2e1;
  color:#705334;
  border-radius:12px;
  padding:14px;
  font-size:14px;
  margin-top:12px
}
details{
  margin-top:16px;
  border-top:1px solid #dce6ef;
  padding-top:14px
}
summary{
  font-weight:850;
  cursor:pointer
}
details p{
  font-size:14px;
  color:#5b6976
}
details input,details select{
  width:100%;
  padding:10px;
  border:1px solid #c2cfdb;
  border-radius:9px;
  font-size:15px;
  background:white
}
.manual-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.manual-field{
  display:flex;
  flex-direction:column;
  gap:5px
}
.manual-field label{
  font-size:14px;
  font-weight:750
}
.manual-actions{margin-top:14px}
@media(max-width:700px){
  .columns,.meta{grid-template-columns:1fr}
  .inputs{grid-template-columns:1fr}
  .hero{
    grid-template-columns:1fr;
    padding:21px
  }
  .hero .date-block{
    border-left:0;
    border-top:1px solid currentColor;
    padding:15px 0 0
  }
  .hero .outcome{font-size:36px}
  .hero .date{font-size:32px}
  .panel{
    padding:16px;
    border-radius:17px
  }
}
@media(max-width:400px){
  .field .key{font-size:14px}
  .field .value{font-size:15px}
  .item-name{font-size:16px}
  .state{
    min-width:91px;
    font-size:14px
  }
  .manual-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span aria-hidden="true">🚘</span>
    <div id="brand">
      자동차검사 결과 안내
      <small>Vehicle Inspection Result</small>
    </div>
  </div>
  <select id="lang" aria-label="Language">
    <option value="ko">한국어</option>
    <option value="en">English</option>
    <option value="zh">中文</option>
    <option value="vi">Tiếng Việt</option>
  </select>
</header>

<main>

<section class="panel" id="uploadPanel">
  <h2 id="uploadTitle">진단서 사진 업로드</h2>
  <div class="inputs">
    <label class="upload" id="frontLabel">
      ① 앞면 사진
      <input id="front" type="file" accept="image/*">
    </label>
    <label class="upload" id="backLabel">
      ② 뒷면 사진
      <input id="back" type="file" accept="image/*">
    </label>
  </div>
  <button id="analyze">자동 분석하기</button>
  <p id="progress" role="status">
    앞면과 뒷면 사진을 선택해 주세요.
  </p>
</section>

<div id="result">

  <div id="hero" class="hero unknown">
    <div>
      <div id="verdict" class="outcome"></div>
      <div id="verdictSub" class="sub"></div>
    </div>
    <div class="date-block">
      <div id="dateLabel" class="date-label"></div>
      <div id="headlineDate" class="date"></div>
    </div>
  </div>

  <section class="panel">
    <h2 id="metaTitle"></h2>
    <div class="meta" id="meta"></div>
    <p id="privacy" class="privacy"></p>
  </section>

  <div class="columns">
    <section class="panel">
      <h2 id="itemsTitle"></h2>
      <div id="items"></div>
      <p id="itemHint" class="hint"></p>
    </section>

    <section class="panel">
      <h2 id="faultTitle"></h2>
      <div id="faults"></div>
      <p id="faultHint" class="alert"></p>
    </section>
  </div>

  <div class="notice" id="notice"></div>

  <details class="panel" id="review">
    <summary id="reviewTitle">
      검사원 확인·수정
    </summary>
    <p id="reviewHelp"></p>
    <div id="manual" class="manual-grid"></div>
    <button class="manual-actions" id="apply">
      확인한 내용 적용
    </button>
  </details>

</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

const unique=a=>[...new Set(a.filter(Boolean))];

const norm=s=>String(s||'')
.replace(/[\s<>〈〉\[\]【】(){}|:：,，.·\-]/g,'');

const make=(tag,cls,text)=>{
const e=document.createElement(tag);
if(cls)e.className=cls;
if(text!==undefined)e.textContent=text;
return e;
};

function validDate(y,m,d){
y=+y;
m=+m;
d=+d;

const a=new Date(y,m-1,d);

return y>=2020&&y<=2099&&
a.getFullYear()===y&&
a.getMonth()===m-1&&
a.getDate()===d
?`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`
:null;
}

function dates(s){
const out=[];

for(const m of String(s||'').matchAll(
/(20\d{2})\s*[^\d\n]{0,8}\s*(\d{1,2})\s*[^\d\n]{0,8}\s*(\d{1,2})(?!\d)/g
)){
const d=validDate(m[1],m[2],m[3]);
if(d)out.push(d);
}

for(const m of String(s||'').matchAll(
/(?<!\d)(20\d{2})(\d{2})(\d{2})(?!\d)/g
)){
const d=validDate(m[1],m[2],m[3]);
if(d)out.push(d);
}

return unique(out);
}

function plateFrom(s){
const a=String(s||'').match(
/(?<!\d)(\d{2,3})\s*([가-힣])\s*(\d{4})(?!\d)/
);

return a?`${a[1]}${a[2]}${a[3]}`:null;
}

function kmFrom(s){
const a=String(s||'').match(
/(?<!\d)(\d{1,3}(?:,\d{3})+|\d{1,7})\s*(?:km|㎞)/i
);

return a
?`${Number(a[1].replace(/,/g,'')).toLocaleString('en-US')} km`
:null;
}

function psmResult(s){
const a=String(s||'').replace(/\s+/g,'');

const good=/양호|정상|이상없음/.test(a);
const bad=/점검요|점검필요|불량|부적합/.test(a);

return good&&!bad
?'good'
:bad&&!good
?'need'
:'unread';
}

function linesFromTsv(tsv){
const groups=new Map();

for(const line of String(tsv||'').split(/\r?\n/).slice(1)){
const a=line.split('\t');

if(a.length<12||a[0]!=='5')continue;

const s=a.slice(11).join('\t').trim();
const [x,y,w,h]=a.slice(6,10).map(Number);

if(!s||![x,y,w,h].every(Number.isFinite))continue;

const key=a.slice(1,5).join('_');

if(!groups.has(key)){
groups.set(key,[]);
}

groups.get(key).push({s,x,y,w,h});
}

return [...groups.values()].map(a=>{
a.sort((x,y)=>x.x-y.x);

return {
text:a.map(x=>x.s).join(' '),
x:Math.min(...a.map(x=>x.x)),
y:Math.min(...a.map(x=>x.y)),
right:Math.max(...a.map(x=>x.x+x.w)),
bottom:Math.max(...a.map(x=>x.y+x.h))
};
}).sort((a,b)=>a.y-b.y);
}

function findRow(lines,re){
return lines.filter(l=>re.test(l.text));
}

function nearText(lines,anchor,width){
const y=(anchor.y+anchor.bottom)/2;

return lines.filter(l=>
Math.abs((l.y+l.bottom)/2-y)<
Math.max(15,anchor.bottom-anchor.y+9)&&
l.x>anchor.x-10&&
l.x<anchor.right+width
)
.sort((a,b)=>a.x-b.x)
.map(l=>l.text)
.join(' ');
}

function valuesAtLabel(text,labelRe,parser){
const rows=String(text||'').split(/\r?\n/);
const out=[];

for(let i=0;i<rows.length;i++){
const m=labelRe.exec(rows[i]);
if(!m)continue;

const tail=rows[i].slice(m.index+m[0].length);
const a=parser(tail);

if(a)out.push(a);

if(!a&&i+1<rows.length){
const b=parser(rows[i+1]);
if(b)out.push(b);
}
}

return unique(out);
}

function pick(values){
const v=unique(values);
return v.length===1?v[0]:null;
}

function labeledDates(text,re){
const rows=String(text||'').split(/\r?\n/);
const out=[];

for(let i=0;i<rows.length;i++){
const m=re.exec(rows[i]);
if(!m)continue;

const here=dates(
rows[i].slice(m.index+m[0].length)
);

out.push(...here);

if(!here.length&&i+1<rows.length){
out.push(...dates(rows[i+1].slice(0,80)));
}
}

return unique(out);
}

function parseStatus(front,back,statusCrops){

const all=[front,back,...statusCrops];

for(const s0 of all){

)){
evidence.push(
/^(부|불)/.test(m[1])?'fail':'pass'
);
}
}

const backN=String(back||'').replace(/\s+/g,'');

if(/[<〈\[]부적[합함][>〉\]]/.test(backN)){
evidence.push('fail');

if(

){

}

const e=unique(evidence);

return e.length===1?e[0]:'unknown';
}

}

for(const g of geo){

}else if(

k==='first'||

){

);

if(m){

.split(/최초|주행|등록|소유자|원동기/)[0]
.trim();

if(clean&&clean.length<40){

}
}
}

}
}

for(const k of [
'inspection',
'first',
'reinspection',
'next'
]){

for(const s of sources){

}

const plateCandidates=[];

for(const s of sources){

);
}

]);

for(const s of sources){

...valuesAtLabel(s,label.mileage,kmFrom)
);
}

v.mileage=pick([
...kmCandidates,
...geoValues.mileage
]);

const modelCandidates=[];

for(const s of sources){
const rows=s.split(/\r?\n/);

for(const row of rows){
const m=label.model.exec(row);
if(!m)continue;

const tail=row
.slice(m.index+m[0].length)
.split(
/최초\s*등록일|주행\s*거리|소유자\s*명|원동기\s*형식|차대\s*번호/
)[0]
.trim();

if(
tail&&
tail.length<38&&
/[가-힣A-Za-z]/.test(tail)&&
!/\d{4}년/.test(tail)
){
modelCandidates.push(tail);
}
}
}

v.model=pick([
...modelCandidates,
...geoValues.model
]);

if(/재\s*검사\s*대상/.test(combined)){
v.next='reinspectionTarget';
}

// 재검사 기간은 해당 라벨 또는 '까지'가
// 명시된 날짜에서만 추출한다.
const deadline=[];

for(const s of sources){

);

for(const line of s.split(/\r?\n/)){

}
}

for(const x of extra){

){
deadline.push(...dates(x.text));
}

if(x.kind==='reinspection-anchor'){
deadline.push(...dates(x.text));
}
}

v.reinspection=pick(deadline);

return v;
}

function cleanFault(s){
s=String(s||'')
.replace(/^[^가-힣]+/,'')
.trim();

if(/^기타\s*[\[［(（【]/.test(s)){
const m=s.match(
/^기타\s*[\[［(（【][^\]］)）】\n]{2,85}[\]］)）】]/
);

return m?m[0].trim():'';
}

return s.replace(/[;:：.]+$/,'').trim();
}

function plausible(s){
return s.length>=4&&
s.length<=95&&
/[가-힣]/.test(s)&&
!/검사소|자동차관리법|원상복구|하시기|진단결과|정비하여|과태료|고객님|합니다|바랍니다|종합의견/.test(s)&&
/임의\s*(?:변경|설치)|^기타\s*[\[［(（【]|불량|미달|파손|누유|초과|부식|손상|미점등|작동불량/.test(s);
}

function splitFaults(s){
const a=[];
let p='';
let depth=0;

for(const c of String(s)){
if('[［(（【'.includes(c))depth++;

if(']］)）】'.includes(c)){
depth=Math.max(0,depth-1);
}

if(
(c===','||c==='，'||c==='\n')&&
depth===0
){
if(p.trim())a.push(p.trim());
p='';
}else{
p+=c;
}
}

if(p.trim())a.push(p.trim());

return a.map(cleanFault).filter(plausible);
}

function faultBlocks(s,isolated=false){
const rows=String(s||'').split(/\r?\n/);
const blocks=[];

for(let i=0;i<rows.length;i++){
const h=rows[i].match(
/[<〈\[]?\s*부\s*적\s*[합함]\s*[>〉\]]/
);

if(!h&&!isolated)continue;

if(
!h&&
!(
/임의\s*(변경|설치)/.test(rows[i])&&
/기타\s*[\[［(（【]|[,，]/.test(rows[i])
)
)continue;

let t=h
?rows[i].slice(h.index+h[0].length)
:rows[i];

for(let j=i+1;j<Math.min(i+4,rows.length);j++){
if(
/종\s*합\s*의\s*견|\[\s*1\s*\]|최종\s*판정/.test(rows[j])
)break;

t+='\n'+rows[j];
}

t=t.split(
/종\s*합\s*의\s*견|\[\s*1\s*\]/
)[0];

const v=splitFaults(t);

if(v.length)blocks.push(v);
}

return blocks;
}

function parseFaults(back,crops){
const blocks=[
...faultBlocks(back),
...crops.flatMap(c=>faultBlocks(c,true))
];

const quality=s=>DICT.some(([re])=>
re.test(norm(s).replace(/^기타/,''))
)?6:2;

blocks.sort((a,b)=>
b.reduce((n,s)=>n+quality(s)+2,0)-
a.reduce((n,s)=>n+quality(s)+2,0)
);

return unique(
(blocks[0]||[]).map(s=>s.trim())
);
}

function faultTranslation(s){
const k=norm(s).replace(/^기타/,'');

return DICT.find(([r])=>r.test(k))?.[1]||null;
}

function fromCanvas(file){
return new Promise((resolve,reject)=>{
const img=new Image();
const url=URL.createObjectURL(file);

img.onload=()=>{
const scale=Math.min(
2.3,
3100/img.width,
4300/img.height
);

const c=document.createElement('canvas');

c.width=Math.round(img.width*scale);
c.height=Math.round(img.height*scale);

c.getContext('2d').drawImage(
img,0,0,c.width,c.height
);

URL.revokeObjectURL(url);
resolve(c);
};

img.onerror=()=>{
URL.revokeObjectURL(url);
reject(new Error('사진을 열 수 없습니다.'));
};

img.src=url;
});
}

function crop(c,x,y,w,h,scale=2,contrast=false){
x=Math.max(0,Math.min(.999,x));
y=Math.max(0,Math.min(.999,y));

w=Math.max(.001,Math.min(w,1-x));
h=Math.max(.001,Math.min(h,1-y));

const o=document.createElement('canvas');

o.width=Math.max(
1,
Math.round(c.width*w*scale)
);

o.height=Math.max(
1,
Math.round(c.height*h*scale)
);

const g=o.getContext('2d');

if(contrast){
g.filter='grayscale(1) contrast(1.6)';
}

g.drawImage(
c,
c.width*x,
c.height*y,
c.width*w,
c.height*h,
0,0,
o.width,
o.height
);

return o;
}

async function ocr(worker,c,psm='6',tsv=false){
await worker.setParameters({
tessedit_pageseg_mode:psm
});

const r=await worker.recognize(
c,
{},
tsv?{tsv:true}:{}
);

return r.data;
}

function regionAround(
c,l,
marginX=.02,
marginY=.008,
right=.43
){
const x=Math.max(
0,
l.x/c.width-marginX
);

const y=Math.max(
0,
l.y/c.height-marginY
);

return [
x,
y,
Math.min(
1-x,
(l.right-l.x)/c.width+right
),
Math.min(
1-y,
(l.bottom-l.y)/c.height+marginY*2
)
];
}

function estimateTable(fc,lines){
const heading=lines.find(l=>
/진단\s*항목|안전진단기준/.test(l.text)&&
l.y/fc.height>.15
);

const footer=lines.find(l=>
/다음장에\s*계속/.test(l.text)&&
l.y/fc.height>.6
);

return {
top:heading
?heading.y/fc.height
:.24,
bottom:footer
?footer.y/fc.height
:.93
};
}

async function readStates(worker,fc,lines){

);

);

];

for(let i=0;i<6;i++){
const y=top+
(bottom-top)*fractions[i];

(fractions[i+1]-fractions[i]);

y+.003,
w,
h-.006,
1.7,
true

worker,c,'6'

}

return out;
}

$('backLabel').firstChild.textContent=t.back;
$('analyze').textContent=t.go;
$('metaTitle').textContent='▤ '+t.meta;
$('privacy').textContent='ⓘ '+t.privacy;
$('itemsTitle').textContent='☑ '+t.items;
$('faultTitle').textContent='⚠ '+t.faults;
$('itemHint').textContent=t.itemHint;
$('notice').textContent=t.notice;
$('reviewTitle').textContent=t.review;
$('reviewHelp').textContent=t.reviewHelp;
$('apply').textContent=t.apply;

$('hero').className='hero '+d.status;

$('verdict').textContent=
d.status==='fail'
?t.fail
:d.status==='pass'
?t.pass
:t.unknown;

$('verdictSub').textContent=
d.status==='fail'
?t.failSub
:d.status==='pass'
?t.passSub
:'';

const dateType=
d.status==='fail'
?'reinspection'
:d.status==='pass'
?'next'
:d.top.reinspection
?'reinspection'
:'next';

$('dateLabel').textContent=
dateType==='reinspection'
?t.dateFail
:t.datePass;

const mainDate=d.top[dateType];

$('headlineDate').textContent=
mainDate
?(
mainDate+
(
dateType==='reinspection'&&lang==='ko'
?'까지'
:''
)
)
:t.missing;

// 자동차 기본정보
$('meta').replaceChildren();

for(const k of KEYS){
const box=make(
'div',
'field'+(
k==='reinspection'&&
d.status==='fail'
?' important'
:''
)
);

box.append(
make('div','key',t[k])
);

let value=d.top[k];

if(
k==='next'&&
value==='reinspectionTarget'
){
value=t.reinspectionTarget;
}

if(
k==='reinspection'&&
value&&
lang==='ko'
){
value+='까지';
}

if(!value){
value=t.missing;
}

box.append(
make(
'div',
'value'+(
value===t.missing
?' missing'
:''
),
value
)
);

$('meta').append(box);
}

// 검사 항목 7개
$('items').replaceChildren();

d.states.forEach((s,i)=>{
const box=make('div','item');

box.append(
make(
'div',
'item-name',
CATS[i].label[idx]
),
make(
'div',
'state '+s,
s==='good'
?t.good
:s==='need'
?t.need
:t.unread
)
);

$('items').append(box);
});

// 부적합 사유
$('faults').replaceChildren();

for(const s of d.faults){
const box=make('div','fault');
const v=faultTranslation(s);

box.append(
make(
'div',
'translated',
v?v[idx]:t.verify
),
make(
'div',
'original',
s
)
);

$('faults').append(box);
}

if(!d.faults.length){
$('faults').append(
make(
'p',
'hint',
t.noFaults
)
);
}

$('faultHint').textContent=
d.status==='fail'&&
d.faults.length===0
?t.faultHint
:'';

$('result').style.display='block';
}

function makeManual(){
const t=I[$('lang').value];
const idx=LANGS.indexOf(
$('lang').value
);

const host=$('manual');
host.replaceChildren();

for(const k of KEYS){
const box=make('div','manual-field');
const label=make('label','',t[k]);
const input=make('input');

input.type='text';
input.dataset.field=k;

input.value=
current.top[k]&&
current.top[k]!=='reinspectionTarget'
?current.top[k]
:current.top[k]==='reinspectionTarget'
?'재검사 대상'
:'';

box.append(label,input);
host.append(box);
}

const box=make('div','manual-field');

box.append(
make(
'label',
'',
t.verifyOriginal
)
);

const sel=make('select');
sel.id='manualStatus';

for(const [v,n] of [
['auto',t.auto],
['fail',t.fail],
['pass',t.pass],
['unknown',t.unknown]
]){
const op=make('option','',n);
op.value=v;
sel.append(op);
}

box.append(sel);
host.append(box);

for(let i=0;i<7;i++){
const div=make('div','manual-field');

div.append(
make(
'label',
'',
CATS[i].label[idx]
)
);

const s=make('select');
s.dataset.state=i;

for(const [v,n] of [
['auto',t.auto],
['good',t.good],
['need',t.need],
['unread',t.unread]
]){
const op=make('option','',n);
op.value=v;
s.append(op);
}

div.append(s);
host.append(div);
}
}

function manualApply(){
if(!current)return;

const edited={...current.top};

for(const input of document.querySelectorAll(
'[data-field]'
)){
const k=input.dataset.field;
const raw=input.value.trim();

if(
['inspection','first','reinspection'].includes(k)&&
raw&&
!/^20\d{2}\.\d{2}\.\d{2}$/.test(raw)
){
alert(
'날짜는 YYYY.MM.DD 형식으로 입력하세요.'
);
return;
}

edited[k]=raw||null;

if(
k==='next'&&
raw==='재검사 대상'
){
edited[k]='reinspectionTarget';
}
}

current.top=edited;

const status=$('manualStatus').value;

if(status!=='auto'){
current.status=status;
}

for(const s of document.querySelectorAll(
'[data-state]'
)){
if(s.value!=='auto'){
current.states[+s.dataset.state]=s.value;
}
}

render();
}

async function analyze(){
if(busy)return;

const frontFile=$('front').files[0];
const backFile=$('back').files[0];

if(!frontFile||!backFile){
$('progress').textContent=
I[$('lang').value].ready;
return;
}

if(!window.Tesseract){
$('progress').textContent=
'OCR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';
return;
}

busy=true;
$('analyze').disabled=true;

let worker=null;

try{
const t=I[$('lang').value];

$('progress').textContent=
t.working+'…';

worker=await Tesseract.createWorker(
'kor+eng',
1
);

const fc=await fromCanvas(frontFile);
const bc=await fromCanvas(backFile);

// 앞면 전체 판독
$('progress').textContent=
t.working+' — 1/4';

const fr=await ocr(
worker,
fc,
'3',
true
);

// 자동차 기본정보 및 날짜
$('progress').textContent=
t.working+' — 2/4';

const top=await readTop(
worker,
fc,
fr
);

// 검사 항목별 진단의견
const stateCrops=await readStates(
worker,
fc,
linesFromTsv(fr.tsv)
);

// 뒷면 전체 판독
$('progress').textContent=
t.working+' — 3/4';

const br=await ocr(
worker,
bc,
'3',
true
);

// 최종판정 및 부적합 사유
$('progress').textContent=
t.working+' — 4/4';

const back=await readBack(
worker,
bc,
br
);

const frontText=fr.text||'';
const backText=br.text||'';

const topInfo=parseTop(
frontText,
top.extra,
top.geo
);

const status=parseStatus(
frontText,
backText,
back.statusCrops
);

const states=parseStates(
frontText,
backText,
stateCrops
);

const faults=parseFaults(
backText,
back.extra
);

// 화면에는 필요한 검사 결과만 보관.
// 차대번호·소유자명은 결과 데이터에 포함하지 않음.
current={
status,
top:topInfo,
states,
faults
};

render();
makeManual();

$('progress').textContent=t.done;

$('result').scrollIntoView({
behavior:'smooth',
block:'start'
});

}catch(e){
$('progress').textContent=
'분석 오류: '+(
e.message||String(e)
);

}finally{
if(worker){
await worker.terminate().catch(()=>{});
}

busy=false;
$('analyze').disabled=false;
}
}

$('analyze').addEventListener(
'click',
analyze
);

$('apply').addEventListener(
'click',
manualApply
);

$('lang').addEventListener(
'change',
()=>{
if(current){
render();
makeManual();
}else{
const t=I[$('lang').value];

$('brand').firstChild.textContent=t.brand;
$('uploadTitle').textContent=t.upload;
$('frontLabel').firstChild.textContent=t.front;
$('backLabel').firstChild.textContent=t.back;
$('analyze').textContent=t.go;
$('progress').textContent=t.ready;
}
}
);

</script>
</body>
</html>
