
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#155d94">
<title>자동차검사 다국어 결과 안내</title>

<style>
:root{
  --blue:#155d94;
  --navy:#18344e;
  --bg:#eef5fb;
  --line:#d9e3ed;
  --red:#a82329;
  --green:#147445;
  --muted:#637486;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--navy);
  font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;
  line-height:1.5;
}
header{
  background:linear-gradient(110deg,#176da6,#0e4c81);
  color:white;
  padding:20px 16px;
}
.header-inner{
  max-width:1050px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{
  font-size:22px;
  font-weight:900;
}
.brand small{
  display:block;
  font-size:13px;
  font-weight:500;
  opacity:.9;
}
select,input,textarea,button{
  font:inherit;
}
#lang{
  background:white;
  color:var(--navy);
  border:0;
  border-radius:9px;
  padding:10px;
  font-size:15px;
}
main{
  max-width:1050px;
  margin:auto;
  padding:16px 14px 36px;
}
.panel{
  background:white;
  border:1px solid #dce6ef;
  border-radius:20px;
  padding:20px;
  margin-bottom:17px;
  box-shadow:0 3px 13px #1234560a;
}
h2{
  font-size:23px;
  font-weight:900;
  margin:0 0 17px;
}
.upload-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.upload{
  border:2px dashed #9ab9d0;
  background:#f4f9fe;
  border-radius:12px;
  padding:17px;
  font-size:17px;
  font-weight:800;
}
.upload input{
  display:block;
  margin-top:12px;
  width:100%;
  font-size:14px;
  font-weight:400;
}
button{
  background:var(--blue);
  color:white;
  border:0;
  border-radius:10px;
  padding:13px 18px;
  font-size:17px;
  font-weight:850;
  cursor:pointer;
}
button:disabled{opacity:.55}
#analyze{
  display:block;
  width:100%;
  margin-top:14px;
}
#progress{
  white-space:pre-wrap;
  color:#386180;
  font-size:15px;
  font-weight:700;
}
#result{display:none}
.hero{
  border-radius:20px;
  padding:28px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  align-items:center;
  margin-bottom:17px;
}
.hero.fail{
  background:#ffe8e8;
  color:#a41d24;
}
.hero.pass{
  background:#e2f5e8;
  color:#11683a;
}
.hero.unknown{
  background:#fff0dc;
  color:#785321;
}
.verdict{
  font-size:44px;
  font-weight:950;
  line-height:1.2;
  overflow-wrap:anywhere;
}
.verdict-sub{
  font-size:18px;
  margin-top:10px;
}
.hero-date{
  border-left:2px solid currentColor;
  padding-left:25px;
}
.date-label{
  font-size:20px;
  font-weight:800;
}
.date-value{
  font-size:35px;
  font-weight:950;
  margin-top:8px;
  overflow-wrap:anywhere;
}
.meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px 15px;
}
.field{
  display:grid;
  grid-template-columns:43% 57%;
  border:1px solid #d3e0eb;
  border-radius:10px;
  overflow:hidden;
  min-height:55px;
}
.field-key{
  background:#e9f3ff;
  padding:13px;
  font-size:16px;
  font-weight:850;
}
.field-value{
  padding:13px;
  font-size:17px;
  font-weight:800;
  overflow-wrap:anywhere;
}
.field.important .field-value{
  background:#fff0f0;
  color:#a92229;
}
.missing{color:#796a56}
.privacy{
  font-size:14px;
  color:#5b6d7e;
  margin:15px 0 0;
}
.columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:17px;
}
.item{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:16px 0;
  border-bottom:1px solid #e0e6ec;
}
.item:last-child{border:0}
.item-name{
  font-size:17px;
  font-weight:850;
}
.state{
  min-width:102px;
  max-width:175px;
  text-align:center;
  padding:8px;
  border-radius:10px;
  font-size:15px;
  font-weight:850;
  line-height:1.35;
}
.state.good{
  background:#dff5e7;
  color:#13743f;
}
.state.need{
  background:#ffe2e2;
  color:#a52229;
}
.state.unread{
  background:#eceff3;
  color:#736451;
}
.fault{
  background:#fff0f0;
  border-left:7px solid #b6292e;
  border-radius:12px;
  padding:17px;
  margin-bottom:13px;
}
.fault-title{
  color:#a31e25;
  font-size:20px;
  font-weight:900;
  overflow-wrap:anywhere;
}
.fault-original{
  color:#596a7b;
  font-size:15px;
  margin-top:8px;
  overflow-wrap:anywhere;
}
.note{
  font-size:14px;
  color:#647587;
  line-height:1.7;
}
.notice{
  background:#fff0dc;
  border-radius:12px;
  padding:17px;
  font-size:15px;
  color:#705335;
  margin-bottom:17px;
}
details summary{
  font-size:19px;
  font-weight:850;
  cursor:pointer;
}
details p{
  color:#637486;
  font-size:14px;
}
.manual-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}
.manual-box label{
  display:block;
  font-size:14px;
  font-weight:800;
  margin-bottom:6px;
}
.manual-box input,
.manual-box select,
.manual-box textarea{
  width:100%;
  padding:11px;
  border:1px solid #bccbd8;
  border-radius:9px;
  background:white;
  color:#18344e;
}
.manual-box textarea{
  min-height:115px;
}
#apply{
  width:100%;
  margin-top:15px;
}
.ocr-section{
  margin-top:15px;
}
.ocr-section h3{
  font-size:17px;
  margin:17px 0 9px;
}
.ocr-text{
  width:100%;
  height:190px;
  resize:vertical;
  padding:13px;
  border:1px solid #c7d5e1;
  border-radius:10px;
  background:#f7fafc;
  color:#263f54;
  font-size:13px;
  line-height:1.6;
}
.copy-btn{
  width:100%;
  margin-top:9px;
  background:#496b89;
  font-size:15px;
}
#ocrDetails{
  margin-top:18px;
}
@media(max-width:720px){
  .upload-grid,.meta,.columns{
    grid-template-columns:1fr;
  }
  .hero{
    grid-template-columns:1fr;
    padding:24px;
  }
  .hero-date{
    border-left:0;
    border-top:1px solid currentColor;
    padding:17px 0 0;
  }
  .verdict{font-size:40px}
  .date-value{font-size:32px}
}
@media(max-width:420px){
  .panel{padding:16px}
  .brand{font-size:18px}
  .field-key{font-size:14px}
  .field-value{font-size:15px}
  .item-name{font-size:16px}
  .state{
    min-width:94px;
    font-size:14px;
  }
  .manual-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span id="brandTitle">자동차검사 결과 안내</span>
      <small>Vehicle Inspection Result</small>
    </div>
    <select id="lang">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="vi">Tiếng Việt</option>
    </select>
  </div>
</header>

<main>

<section class="panel">
  <h2 id="uploadTitle">진단서 사진 업로드</h2>

  <div class="upload-grid">
    <label class="upload">
      <span id="frontLabel">① 앞면 사진</span>
      <input id="front" type="file" accept="image/*">
    </label>

    <label class="upload">
      <span id="backLabel">② 뒷면 사진</span>
      <input id="back" type="file" accept="image/*">
    </label>
  </div>

  <button id="analyze">자동 분석하기</button>
  <p id="progress" role="status">
    앞면과 뒷면 사진을 선택해 주세요.
  </p>
</section>

<div id="result">

  <div id="hero" class="hero unknown">
    <div>
      <div id="verdict" class="verdict"></div>
      <div id="verdictSub" class="verdict-sub"></div>
    </div>

    <div class="hero-date">
      <div id="dateLabel" class="date-label"></div>
      <div id="dateValue" class="date-value"></div>
    </div>
  </div>

  <section class="panel">
    <h2 id="metaTitle"></h2>
    <div id="meta" class="meta"></div>
    <p id="privacy" class="privacy"></p>
  </section>

  <div class="columns">
    <section class="panel">
      <h2 id="itemsTitle"></h2>
      <div id="items"></div>
      <p id="itemNote" class="note"></p>
    </section>

    <section class="panel">
      <h2 id="faultTitle"></h2>
      <div id="faults"></div>
      <p id="faultNote" class="note"></p>
    </section>
  </div>

  <div id="notice" class="notice"></div>

  <details class="panel" id="reviewDetails">
    <summary id="reviewTitle">
      검사원 원본 확인·수정
    </summary>

    <p id="reviewHelp"></p>

    <div id="manual" class="manual-grid"></div>

    <button id="apply">확인한 내용 적용</button>
  </details>

  <details class="panel" id="ocrDetails">
    <summary id="ocrTitle">
      OCR 원문 확인·복사
    </summary>

    <p id="ocrHelp"></p>

    <div class="ocr-section">
      <h3 id="frontOcrTitle">앞면 OCR 원문</h3>
      <textarea
        id="frontOcr"
        class="ocr-text"
        readonly
      ></textarea>

      <button
        id="copyFront"
        class="copy-btn"
        type="button"
      >앞면 OCR 복사</button>
    </div>

    <div class="ocr-section">
      <h3 id="backOcrTitle">뒷면 OCR 원문</h3>
      <textarea
        id="backOcr"
        class="ocr-text"
        readonly
      ></textarea>

      <button
        id="copyBack"
        class="copy-btn"
        type="button"
      >뒷면 OCR 복사</button>
    </div>

    <button
      id="copyAll"
      class="copy-btn"
      type="button"
    >OCR 원문 전체 복사</button>
  </details>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

const FIELDS = [
  "inspection",
  "plate",
  "model",
  "first",
  "next",
  "reinspection",
  "mileage"
];

const LABELS = {
  inspection:/검사\s*일자/,
  plate:/자동차\s*등록\s*번호/,
  model:/차\s*명/,
  first:/최초\s*등록일/,
  next:/다음\s*검사일/,
  reinspection:/재\s*검사\s*기\s*[간한]/,
  mileage:/주행\s*거리/
};

const unique = arr => [...new Set(arr.filter(Boolean))];

const normalize = s => String(s || "")
  .replace(/[\s<>〈〉\[\]【】(){}|:：,，.·\-]/g,"");

function element(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined)e.textContent=text;
  return e;
}

function validDate(y,m,d){
  y=Number(y);
  m=Number(m);
  d=Number(d);

  const v=new Date(y,m-1,d);

  if(
    y<2020 || y>2099 ||
    v.getFullYear()!==y ||
    v.getMonth()!==m-1 ||
    v.getDate()!==d
  ){
    return null;
  }

  return [
    y,
    String(m).padStart(2,"0"),
    String(d).padStart(2,"0")
  ].join(".");
}

// 숫자를 추측하거나 다른 칸의 숫자를 결합하지 않는다.
function findDates(text){
  const out=[];
  const s=String(text || "");

  const patterns=[
    /(?<!\d)(20\d{2})\s*(?:년|변|[./-])\s*(\d{1,2})\s*(?:월|[./-])\s*(\d{1,2})(?:일|밀)?(?!\d)/g,
    /(?<!\d)(20\d{2})(\d{2})(\d{2})(?!\d)/g
  ];

  for(const re of patterns){
    for(const m of s.matchAll(re)){
      const d=validDate(m[1],m[2],m[3]);
      if(d)out.push(d);
    }
  }

  return unique(out);
}

function findPlate(text){
  const m=String(text || "").match(
    /(?<!\d)(\d{2,3})\s*([가-힣])\s*(\d{4})(?!\d)/
  );

  return m ? m[1]+m[2]+m[3] : null;
}

function findMileage(text){
  const m=String(text || "").match(
    /(?<!\d)(\d{1,3}(?:,\d{3})+|\d{1,7})\s*(?:km|㎞)/i
  );

  if(!m)return null;

  return Number(
    m[1].replace(/,/g,"")
  ).toLocaleString("en-US")+" km";
}

function findModel(text){
  let s=String(text || "").trim();

  s=s.replace(/^차\s*명\s*[:：]?\s*/,"");

  s=s.split(
    /최초\s*등록일|주행\s*거리|소유자|차대\s*번호|원동기\s*형식/
  )[0].trim();

  if(
    s.length<2 ||
    s.length>42 ||
    !/[가-힣A-Za-z]/.test(s) ||
    /20\d{2}\s*년/.test(s)
  ){
    return null;
  }

  return s;
}

function valueParser(key,text){
  if(
    key==="inspection" ||
    key==="first" ||
    key==="next" ||
    key==="reinspection"
  ){
    const a=findDates(text);
    return a.length===1?a[0]:null;
  }

  if(key==="plate")return findPlate(text);
  if(key==="mileage")return findMileage(text);
  if(key==="model")return findModel(text);

  return null;
}

function chooseEvidence(values){
  const counts=new Map();

  for(const v of values.filter(Boolean)){
    counts.set(v,(counts.get(v)||0)+1);
  }

  if(!counts.size)return null;

  const ranked=[...counts.entries()]
    .sort((a,b)=>b[1]-a[1]);

  // 날짜는 최소 두 번 동일하게 읽혀야 한다.
  if(ranked[0][1]<2)return null;

  if(
    ranked.length>1 &&
    ranked[0][1]===ranked[1][1]
  ){
    return null;
  }

  return ranked[0][0];
}

// 개인정보가 들어 있는 OCR 원문은 그대로 표시하지 않는다.
function redactOCR(text){
  return String(text || "")
    .split(/\r?\n/)
    .map(line=>{
      if(
        /차\s*대\s*번\s*호|소\s*유\s*자\s*명|소유주\s*명|차\s*대\s*번호/.test(line)
      ){
        return "[개인정보 포함 행 비공개]";
      }

      return line
        .replace(
          /\b[A-HJ-NPR-Z0-9]{17}\b/gi,
          "[차대번호 비공개]"
        )
        .replace(
          /\b[A-HJ-NPR-Z0-9]{8,12}[\s*-]+[A-HJ-NPR-Z0-9]{5,9}\b/gi,
          "[차대번호 비공개]"
        );
    })
    .join("\n");
}

function parseWords(tsv,width,height){
  const out=[];

  for(const line of String(tsv || "")
    .split(/\r?\n/)
    .slice(1)
  ){
    const a=line.split("\t");

    if(a.length<12 || a[0]!=="5")continue;

    const word=a.slice(11).join("\t").trim();

    if(!word)continue;

    const x=Number(a[6]);
    const y=Number(a[7]);
    const w=Number(a[8]);
    const h=Number(a[9]);

    if(![x,y,w,h].every(Number.isFinite))continue;

    out.push({
      text:word,
      x:x/width,
      y:y/height,
      w:w/width,
      h:h/height,
      block:a[1],
      paragraph:a[2],
      line:a[3]
    });
  }

  return out;
}

function makeLines(words){
  const map=new Map();

  for(const w of words){
    const key=[
      w.block,
      w.paragraph,
      w.line
    ].join("_");

    if(!map.has(key))map.set(key,[]);
    map.get(key).push(w);
  }

  return [...map.values()]
    .map(arr=>{
      arr.sort((a,b)=>a.x-b.x);

      const x=Math.min(...arr.map(w=>w.x));
      const y=Math.min(...arr.map(w=>w.y));
      const right=Math.max(...arr.map(w=>w.x+w.w));
      const bottom=Math.max(...arr.map(w=>w.y+w.h));

      return {
        text:arr.map(w=>w.text).join(" "),
        words:arr,
        x,y,right,bottom
      };
    })
    .sort((a,b)=>a.y-b.y);
}

function findAnchors(lines){
  const anchors=[];

  for(const line of lines){
    const ws=line.words;

    for(let i=0;i<ws.length;i++){
      for(let n=1;n<=Math.min(5,ws.length-i);n++){
        const group=ws.slice(i,i+n);
        const s=normalize(
          group.map(w=>w.text).join("")
        );

        for(const key of FIELDS){
          const pattern=new RegExp(
            "^"+LABELS[key].source.replace(/\\s\*/g,"")+"$"
          );

          if(!pattern.test(s))continue;

          const x=Math.min(...group.map(w=>w.x));
          const y=Math.min(...group.map(w=>w.y));
          const right=Math.max(...group.map(w=>w.x+w.w));
          const bottom=Math.max(...group.map(w=>w.y+w.h));

          anchors.push({
            key,x,y,right,bottom,
            text:s
          });
        }
      }
    }
  }

  const seen=new Set();

  return anchors.filter(a=>{
    const id=[
      a.key,
      Math.round(a.x*100),
      Math.round(a.y*100)
    ].join("_");

    if(seen.has(id))return false;

    seen.add(id);
    return true;
  });
}

function cropCanvas(source,rect,scale=2,enhance=false){
  const [x0,y0,w0,h0]=rect;

  const x=Math.max(0,Math.min(.999,x0));
  const y=Math.max(0,Math.min(.999,y0));
  const w=Math.max(.001,Math.min(w0,1-x));
  const h=Math.max(.001,Math.min(h0,1-y));

  const c=document.createElement("canvas");

  c.width=Math.max(
    1,
    Math.round(source.width*w*scale)
  );

  c.height=Math.max(
    1,
    Math.round(source.height*h*scale)
  );

  const ctx=c.getContext("2d",{
    willReadFrequently:true
  });

  if(enhance){
    ctx.filter="grayscale(1) contrast(1.65)";
  }

  ctx.drawImage(
    source,
    source.width*x,
    source.height*y,
    source.width*w,
    source.height*h,
    0,0,c.width,c.height
  );

  return c;
}

function imageCanvas(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);

    img.onload=()=>{
      const scale=Math.min(
        2.2,
        3000/img.width,
        4200/img.height
      );

      const c=document.createElement("canvas");

      c.width=Math.max(
        1,
        Math.round(img.width*scale)
      );

      c.height=Math.max(
        1,
        Math.round(img.height*scale)
      );

      c.getContext("2d").drawImage(
        img,0,0,c.width,c.height
      );

      URL.revokeObjectURL(url);
      resolve(c);
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("사진을 열 수 없습니다."));
    };

    img.src=url;
  });
}

async function recognize(worker,canvas,psm="6",tsv=false){
  await worker.setParameters({
    tessedit_pageseg_mode:psm
  });

  const result=await worker.recognize(
    canvas,
    {},
    tsv?{tsv:true}:{}
  );

  return result.data;
}

function cellRect(anchor,anchors){
  const centerY=(anchor.y+anchor.bottom)/2;
  const height=Math.max(.012,anchor.bottom-anchor.y);

  const next=anchors
    .filter(a=>
      a!==anchor &&
      a.x>anchor.right &&
      Math.abs(
        (a.y+a.bottom)/2-centerY
      )<Math.max(.018,height*1.5)
    )
    .sort((a,b)=>a.x-b.x)[0];

  const x=Math.min(.98,anchor.right+.003);

  let right=Math.min(.985,x+.34);

  if(next){
    right=Math.min(right,next.x-.006);
  }

  const y=Math.max(0,anchor.y-height*.75);
  const bottom=Math.min(
    1,
    anchor.bottom+height*.85
  );

  return [
    x,
    y,
    Math.max(.02,right-x),
    Math.max(.018,bottom-y)
  ];
}

function extractLabeledText(text,key){
  const lines=String(text || "").split(/\r?\n/);
  const results=[];

  for(let i=0;i<lines.length;i++){
    const re=LABELS[key];
    const m=re.exec(lines[i]);

    if(!m)continue;

    let tail=lines[i].slice(m.index+m[0].length);

    // 다른 표 항목의 내용이 섞이지 않도록 잘라낸다.
    const other=FIELDS
      .filter(k=>k!==key)
      .map(k=>LABELS[k]);

    let cut=tail.length;

    for(const r of other){
      const mm=r.exec(tail);
      if(mm)cut=Math.min(cut,mm.index);
    }

    tail=tail.slice(0,cut);

    if(key==="next" && /재\s*검사\s*대상/.test(tail)){
      results.push("reinspectionTarget");
      continue;
    }

    const v=valueParser(key,tail);
    if(v)results.push(v);
  }

  return results;
}

async function analyzeTop(worker,front,full){
  const scans=[full];
  const baseWords=parseWords(
    full.tsv,front.width,front.height
  );

  const baseLines=makeLines(baseWords);
  const baseAnchors=findAnchors(baseLines);

  const topAnchors=baseAnchors.filter(a=>
    a.key==="inspection" ||
    a.key==="reinspection" ||
    a.key==="next"
  );

  let topRect;

  if(topAnchors.length){
    const y=Math.min(...topAnchors.map(a=>a.y));

    topRect=[
      .015,
      Math.max(0,y-.075),
      .97,
      Math.min(.24,1-Math.max(0,y-.075))
    ];
  }else{
    // 전체 사진에서 표 위치를 못 찾은 경우,
    // 넓은 영역을 다시 읽어 표 제목을 찾는다.
    topRect=[.01,.10,.98,.65];
  }

  const topCanvas=cropCanvas(
    front,topRect,1.9,true
  );

  const topScan=await recognize(
    worker,topCanvas,"6",true
  );

  scans.push(topScan);

  const topWords=parseWords(
    topScan.tsv,
    topCanvas.width,
    topCanvas.height
  ).map(w=>({
    ...w,
    x:topRect[0]+w.x*topRect[2],
    y:topRect[1]+w.y*topRect[3],
    w:w.w*topRect[2],
    h:w.h*topRect[3]
  }));

  const anchors=findAnchors(
    makeLines([...baseWords,...topWords])
  );

  const evidence={};

  for(const key of FIELDS){
    evidence[key]=[];

    for(const scan of scans){
      evidence[key].push(
        ...extractLabeledText(scan.text,key)
      );
    }
  }

  const debug=[];

  // 실제 인식한 표 항목의 위치를 기준으로
  // 오른쪽 값 칸을 자동으로 찾아 다시 읽는다.
  for(const key of FIELDS){
    const matches=anchors
      .filter(a=>a.key===key)
      .sort((a,b)=>a.y-b.y);

    const visited=new Set();

    for(const a of matches.slice(0,3)){
      const signature=[
        Math.round(a.x*50),
        Math.round(a.y*50)
      ].join("_");

      if(visited.has(signature))continue;
      visited.add(signature);

      const rect=cellRect(a,anchors);

      const c=cropCanvas(
        front,rect,2.3,true
      );

      const first=await recognize(
        worker,c,"7"
      );

      debug.push(
        "["+key+"] "+(first.text||"").trim()
      );

      if(
        key==="next" &&
        /재\s*검사\s*대상/.test(first.text)
      ){
        evidence[key].push("reinspectionTarget");
      }else{
        const v=valueParser(key,first.text);
        if(v)evidence[key].push(v);
      }

      // 날짜는 다른 OCR 설정으로 다시 확인한다.
      if(
        key==="inspection" ||
        key==="first" ||
        key==="next" ||
        key==="reinspection"
      ){
        const second=await recognize(
          worker,c,"6"
        );

        debug.push(
          "["+key+" 재확인] "+
          (second.text||"").trim()
        );

        const v=valueParser(key,second.text);
        if(v)evidence[key].push(v);
      }
    }
  }

  const info={};

  for(const key of FIELDS){
    info[key]=chooseEvidence(evidence[key]);
  }

  // 다음 검사일 칸의 '재검사 대상'은
  // 날짜가 아니라 원본에 적힌 상태값이다.
  if(
    evidence.next.includes("reinspectionTarget") &&
    !evidence.next.some(x=>
      /^\d{4}\.\d{2}\.\d{2}$/.test(x)
    )
  ){
    info.next="reinspectionTarget";
  }

  return {
    info,
    anchors,
    debug,
    topText:topScan.text||""
  };
}

function parseStatus(frontText,backText){
  const evidence=[];

  const s=String(backText || "")
    .replace(/\s+/g,"");

  for(const m of s.matchAll(
    /최종판[정청][:：]?(부적합|부적함|적합|합격|불합격)/g
  )){
    evidence.push(
      /^(부|불)/.test(m[1])?"fail":"pass"
    );
  }

  if(/[<〈\[]부적[합함][>〉\]]/.test(s)){
    evidence.push("fail");
  }

  const f=String(frontText || "")
    .replace(/\s+/g,"");

  if(/다음검사일[:：]?재검사대상/.test(f)){
    evidence.push("fail");
  }

  const found=unique(evidence);

  return found.length===1
    ?found[0]
    :"unknown";
}

function stateFromText(text){
  const s=String(text || "")
    .replace(/\s+/g,"");

  const good=/양호|정상|이상없음/.test(s);
  const bad=/점검요|점검필요|불량|부적합/.test(s);

  if(good&&!bad)return "good";
  if(bad&&!good)return "need";

  return "unread";
}

function statesFromLines(text){
  const lines=String(text || "")
    .split(/\r?\n/);

  const states=Array(6)
    .fill(null)
    .map(()=>[]);

  for(let i=0;i<6;i++){
    for(let j=0;j<lines.length;j++){
      const match=CATEGORIES[i].re.exec(lines[j]);

      if(!match)continue;

      let part=lines[j].slice(
        match.index+match[0].length
      );

      if(
        stateFromText(part)==="unread" &&
        j+1<lines.length &&
        !CATEGORIES.slice(0,6)
          .some(c=>c.re.test(lines[j+1]))
      ){
        part+=" "+lines[j+1];
      }

      const value=stateFromText(part);

      if(value!=="unread"){
        states[i].push(value);
      }
    }
  }

  return states;
}

async function analyzeItems(worker,front,full,top){
  const original=statesFromLines(full.text);

  const anchors=top.anchors;

  const tableStart=anchors
    .filter(a=>
      a.key==="next" ||
      a.key==="reinspection"
    )
    .map(a=>a.bottom);

  const start=tableStart.length
    ?Math.min(.92,Math.max(...tableStart)+.045)
    :.24;

  const tableCanvas=cropCanvas(
    front,
    [.015,start,.97,Math.max(.04,.98-start)],
    1.5,
    true
  );

  const tableScan=await recognize(
    worker,tableCanvas,"6"
  );

  const extra=statesFromLines(tableScan.text);

  const result=Array(6).fill("unread");

  for(let i=0;i<6;i++){
    const found=unique([
      ...original[i],
      ...extra[i]
    ]);

    if(found.length===1){
      result[i]=found[0];
    }
  }

  return {
    states:result,
    text:tableScan.text||""
  };
}

function sensorResult(backText){
  const s=String(backText || "")
    .replace(/\s+/g,"");

  const m=s.match(
    /(?:전자제어센서|센서진단)(?:진단)?결과.{0,45}?(정상|양호|이상없음|점검요|불량)/
  );

  return m
    ?stateFromText(m[1])
    :"unread";
}

function cleanFault(text){
  let s=String(text || "")
    .replace(/^[^가-힣]+/,"")
    .trim();

  if(/^기타\s*[\[［(（【]/.test(s)){
    const m=s.match(
      /^기타\s*[\[［(（【][^\]］)）】\n]{2,90}[\]］)）】]/
    );

    return m?m[0].trim():"";
  }

  return s.replace(/[;:：.]+$/,"").trim();
}

function validFault(s){
  return s.length>=4 &&
    s.length<=95 &&
    /[가-힣]/.test(s) &&
    !/자동차관리법|원상복구|검사소|과태료|고객님|바랍니다|하시기|진단결과|종합의견/.test(s) &&
    /임의\s*(?:변경|설치)|^기타\s*[\[［(（【]|불량|파손|누유|초과|부식|손상|미점등|작동불량|미달/.test(s);
}

function splitFaults(text){
  const result=[];
  let current="";
  let depth=0;

  for(const c of String(text || "")){
    if("[［(（【".includes(c))depth++;

    if("]］)）】".includes(c)){
      depth=Math.max(0,depth-1);
    }

    if(
      (c==="," || c==="，" || c==="\n") &&
      depth===0
    ){
      if(current.trim())result.push(current.trim());
      current="";
    }else{
      current+=c;
    }
  }

  if(current.trim())result.push(current.trim());

  return result
    .map(cleanFault)
    .filter(validFault);
}

function faultBlocks(text,allowWithoutHeader=false){
  const lines=String(text || "")
    .split(/\r?\n/);

  const blocks=[];

  for(let i=0;i<lines.length;i++){
    const header=lines[i].match(
      /[<〈\[]?\s*부\s*적\s*[합함]\s*[>〉\]]/
    );

    if(!header && !allowWithoutHeader){
      continue;
    }

    if(
      !header &&
      !(
        /임의\s*(?:변경|설치)/.test(lines[i]) &&
        /[,，]|기타\s*[\[［(（【]/.test(lines[i])
      )
    ){
      continue;
    }

    let content=header
      ?lines[i].slice(
        header.index+header[0].length
      )
      :lines[i];

    for(let j=i+1;j<Math.min(i+5,lines.length);j++){
      if(
        /종\s*합\s*의\s*견|최종\s*판정|\[\s*1\s*\]/.test(lines[j])
      ){
        break;
      }

      content+="\n"+lines[j];
    }

    content=content.split(
      /종\s*합\s*의\s*견|\[\s*1\s*\]/
    )[0];

    const faults=splitFaults(content);

    if(faults.length){
      blocks.push(faults);
    }
  }

  return blocks;
}

function faultTranslation(text){
  const k=normalize(text)
    .replace(/^기타/,"");

  return DICTIONARY.find(d=>
    d.re.test(k)
  )?.value || null;
}

function extractFaults(texts){
  const blocks=[];

  for(let i=0;i<texts.length;i++){
    blocks.push(
      ...faultBlocks(texts[i],i>0)
    );
  }

  function score(list){
    return list.reduce((n,s)=>{
      const known=faultTranslation(s);
      return n+(known?8:3);
    },0);
  }

  blocks.sort((a,b)=>score(b)-score(a));

  const best=blocks[0]||[];
  const seen=new Set();
  const result=[];

  for(const s of best){
    const key=normalize(s);

    if(seen.has(key))continue;
    seen.add(key);
    result.push(s);
  }

  return result;
}

async function analyzeBack(worker,back,full){
  const words=parseWords(
    full.tsv,back.width,back.height
  );

  const lines=makeLines(words);

  const anchors=lines.filter(l=>
    /부\s*적\s*[합함]/.test(l.text)
  );

  const crops=[];

  for(const anchor of anchors.slice(0,3)){
    const y=Math.max(0,anchor.y-.018);

    const c=cropCanvas(
      back,
      [
        Math.max(0,anchor.x-.025),
        y,
        Math.min(.94,1-Math.max(0,anchor.x-.025)),
        Math.min(.13,1-y)
      ],
      2.1,
      true
    );

    const r=await recognize(
      worker,c,"6"
    );

    crops.push(r.text||"");
  }

  if(!crops.length){
    const c=cropCanvas(
      back,[.08,.35,.85,.45],1.7,true
    );

    const r=await recognize(
      worker,c,"6"
    );

    crops.push(r.text||"");
  }

  return {
    crops,
    faults:extractFaults([
      full.text||"",
      ...crops
    ])
  };
}

let current=null;
let isWorking=false;
let frontOcrSafe="";
let backOcrSafe="";

function render(){
  if(!current)return;

  const lang=$("lang").value;
  const t=TEXT[lang];
  const index=LANGS.indexOf(lang);
  const r=current;

  $("brandTitle").textContent=t.brand;
  $("uploadTitle").textContent=t.upload;
  $("frontLabel").textContent=t.front;
  $("backLabel").textContent=t.back;
  $("analyze").textContent=t.analyze;

  $("metaTitle").textContent="▤ "+t.meta;
  $("privacy").textContent="ⓘ "+t.privacy;
  $("itemsTitle").textContent="☑ "+t.items;
  $("faultTitle").textContent="⚠ "+t.faults;
  $("itemNote").textContent=t.itemNote;
  $("faultNote").textContent=t.faultNote;
  $("notice").textContent=t.notice;

  $("reviewTitle").textContent=t.review;
  $("reviewHelp").textContent=t.reviewHelp;
  $("apply").textContent=t.apply;

  $("ocrTitle").textContent=t.ocr;
  $("ocrHelp").textContent=t.ocrHelp;
  $("frontOcrTitle").textContent=t.frontOcr;
  $("backOcrTitle").textContent=t.backOcr;
  $("copyFront").textContent=t.copyFront;
  $("copyBack").textContent=t.copyBack;
  $("copyAll").textContent=t.copyAll;

  $("hero").className="hero "+r.status;

  $("verdict").textContent=
    r.status==="fail"
      ?t.fail
      :r.status==="pass"
        ?t.pass
        :t.unknown;

  $("verdictSub").textContent=
    r.status==="fail"
      ?t.failSub
      :r.status==="pass"
        ?t.passSub
        :"";

  const dateField=
    r.status==="fail"
      ?"reinspection"
      :r.status==="pass"
        ?"next"
        :r.top.reinspection
          ?"reinspection"
          :"next";

  $("dateLabel").textContent=
    dateField==="reinspection"
      ?t.deadline
      :t.nextDate;

  const date=r.top[dateField];

  $("dateValue").textContent=
    date && date!=="reinspectionTarget"
      ?date+(dateField==="reinspection"&&lang==="ko"?"까지":"")
      :t.missing;

  $("meta").replaceChildren();

  for(const key of FIELDS){
    const box=element(
      "div",
      "field"+(
        key==="reinspection"&&
        r.status==="fail"
          ?" important"
          :""
      )
    );

    box.append(
      element("div","field-key",t[key])
    );

    let value=r.top[key];

    if(value==="reinspectionTarget"){
      value=t.reinspectionTarget;
    }else if(
      key==="reinspection" &&
      value &&
      lang==="ko"
    ){
      value+="까지";
    }

    if(!value)value=t.missing;

    box.append(
      element(
        "div",
        "field-value"+(
          value===t.missing?" missing":""
        ),
        value
      )
    );

    $("meta").append(box);
  }

  $("items").replaceChildren();

  r.states.forEach((state,i)=>{
    const row=element("div","item");

    row.append(
      element(
        "div",
        "item-name",
        CATEGORIES[i].names[index]
      )
    );

    row.append(
      element(
        "div",
        "state "+state,
        state==="good"
          ?t.good
          :state==="need"
            ?t.need
            :t.unread
      )
    );

    $("items").append(row);
  });

  $("faults").replaceChildren();

  if(!r.faults.length){
    $("faults").append(
      element("p","note",t.noFaults)
    );
  }

  for(const original of r.faults){
    const box=element("div","fault");
    const translated=faultTranslation(original);

    box.append(
      element(
        "div",
        "fault-title",
        translated
          ?translated[index]
          :t.verify
      )
    );

    box.append(
      element(
        "div",
        "fault-original",
        original
      )
    );

    $("faults").append(box);
  }

  $("frontOcr").value=frontOcrSafe;
  $("backOcr").value=backOcrSafe;

  $("result").style.display="block";
}

function buildManual(){
  if(!current)return;

  const lang=$("lang").value;
  const t=TEXT[lang];
  const index=LANGS.indexOf(lang);
  const host=$("manual");

  host.replaceChildren();

  for(const key of FIELDS){
    const box=element("div","manual-box");

    box.append(
      element("label","",t[key])
    );

    const input=element("input");
    input.type="text";
    input.dataset.field=key;

    input.value=
      current.top[key]==="reinspectionTarget"
        ?"재검사 대상"
        :(current.top[key]||"");

    box.append(input);
    host.append(box);
  }

  const verdictBox=element("div","manual-box");

  verdictBox.append(
    element("label","","최종판정 / Result")
  );

  const verdictSelect=element("select");
  verdictSelect.id="manualVerdict";

  for(const [value,label] of [
    ["auto",t.auto],
    ["pass",t.pass],
    ["fail",t.fail],
    ["unknown",t.unknown]
  ]){
    const option=element("option","",label);
    option.value=value;
    verdictSelect.append(option);
  }

  verdictBox.append(verdictSelect);
  host.append(verdictBox);

  for(let i=0;i<7;i++){
    const box=element("div","manual-box");

    box.append(
      element(
        "label",
        "",
        CATEGORIES[i].names[index]
      )
    );

    const select=element("select");
    select.dataset.state=i;

    for(const [value,label] of [
      ["auto",t.auto],
      ["good",t.good],
      ["need",t.need],
      ["unread",t.unread]
    ]){
      const option=element("option","",label);
      option.value=value;
      select.append(option);
    }

    box.append(select);
    host.append(box);
  }

  const faultBox=element("div","manual-box");

  faultBox.append(
    element(
      "label",
      "",
      "부적합 사유 (원본 확인 후 수정)"
    )
  );

  const faultInput=element("textarea");
  faultInput.id="manualFaults";

  faultInput.value=current.faults.join("\n");

  faultBox.append(faultInput);
  host.append(faultBox);
}

function applyManual(){
  if(!current)return;

  const updated={...current.top};

  for(const input of document.querySelectorAll(
    "[data-field]"
  )){
    const key=input.dataset.field;
    const raw=input.value.trim();

    if(
      ["inspection","first","reinspection"].includes(key) &&
      raw &&
      findDates(raw)[0]!==raw
    ){
      alert("날짜는 YYYY.MM.DD 형식으로 입력하세요.");
      return;
    }

    if(
      key==="next" &&
      raw==="재검사 대상"
    ){
      updated[key]="reinspectionTarget";
    }else{
      updated[key]=raw||null;
    }
  }

  current.top=updated;

  const verdict=$("manualVerdict").value;

  if(verdict!=="auto"){
    current.status=verdict;
  }

  for(const select of document.querySelectorAll(
    "[data-state]"
  )){
    if(select.value!=="auto"){
      current.states[
        Number(select.dataset.state)
      ]=select.value;
    }
  }

  current.faults=$("manualFaults")
    .value
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  render();
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const temp=document.createElement("textarea");
    temp.value=text;
    temp.style.position="fixed";
    temp.style.opacity="0";

    document.body.append(temp);
    temp.select();

    document.execCommand("copy");
    temp.remove();
  }

  $("progress").textContent=
    TEXT[$("lang").value].copied;
}

async function analyze(){
  if(isWorking)return;

  const frontFile=$("front").files[0];
  const backFile=$("back").files[0];

  if(!frontFile||!backFile){
    $("progress").textContent=
      TEXT[$("lang").value].ready;
    return;
  }

  if(!window.Tesseract){
    $("progress").textContent=
      "OCR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.";
    return;
  }

  isWorking=true;
  $("analyze").disabled=true;

  let worker=null;

  try{
    const t=TEXT[$("lang").value];

    $("progress").textContent=
      t.working+" — OCR 준비";

    worker=await Tesseract.createWorker(
      "kor+eng",
      1
    );

    const front=await imageCanvas(frontFile);
    const back=await imageCanvas(backFile);

    $("progress").textContent=
      t.working+" — 앞면 전체 인식";

    const frontFull=await recognize(
      worker,front,"3",true
    );

    $("progress").textContent=
      t.working+" — 기본정보 및 날짜 분석";

    const top=await analyzeTop(
      worker,front,frontFull
    );

    $("progress").textContent=
      t.working+" — 검사 항목 분석";

    const items=await analyzeItems(
      worker,front,frontFull,top
    );

    $("progress").textContent=
      t.working+" — 뒷면 판독";

    const backFull=await recognize(
      worker,back,"3",true
    );

    $("progress").textContent=
      t.working+" — 부적합 사유 확인";

    const backResult=await analyzeBack(
      worker,back,backFull
    );

    const frontText=[
      frontFull.text||"",
      top.topText||"",
      items.text||""
    ].join("\n");

    const backText=[
      backFull.text||"",
      ...backResult.crops
    ].join("\n");

    const status=parseStatus(
      frontText,backText
    );

    const states=[
      ...items.states,
      sensorResult(backText)
    ];

    current={
      status,
      top:top.info,
      states,
      faults:backResult.faults
    };

    // 화면에 표시할 OCR 원문은 개인정보를 가린다.
    frontOcrSafe=redactOCR(
      [
        "=== 앞면 전체 OCR ===",
        frontFull.text||"",
        "",
        "=== 기본정보 표 OCR ===",
        top.topText||"",
        "",
        "=== 날짜 및 항목 재확인 OCR ===",
        top.debug.join("\n"),
        "",
        "=== 검사 항목 OCR ===",
        items.text||""
      ].join("\n")
    );

    backOcrSafe=redactOCR(
      [
        "=== 뒷면 전체 OCR ===",
        backFull.text||"",
        "",
        "=== 부적합 영역 재확인 OCR ===",
        ...backResult.crops
      ].join("\n")
    );

    render();
    buildManual();

    $("progress").textContent=t.done;

    $("result").scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }catch(error){
    $("progress").textContent=
      "분석 오류: "+(
        error.message||String(error)
      );

  }finally{
    if(worker){
      try{
        await worker.terminate();
      }catch(e){}
    }

    isWorking=false;
    $("analyze").disabled=false;
  }
}

$("analyze").addEventListener(
  "click",analyze
);

$("apply").addEventListener(
  "click",applyManual
);

$("copyFront").addEventListener(
  "click",
  ()=>copyText(frontOcrSafe)
);

$("copyBack").addEventListener(
  "click",
  ()=>copyText(backOcrSafe)
);

$("copyAll").addEventListener(
  "click",
  ()=>copyText(
    "=== 앞면 ===\n"+
    frontOcrSafe+
    "\n\n=== 뒷면 ===\n"+
    backOcrSafe
  )
);

$("lang").addEventListener(
  "change",
  ()=>{
    const t=TEXT[$("lang").value];

    if(current){
      render();
      buildManual();
    }else{
      $("brandTitle").textContent=t.brand;
      $("uploadTitle").textContent=t.upload;
      $("frontLabel").textContent=t.front;
      $("backLabel").textContent=t.back;
      $("analyze").textContent=t.analyze;
      $("progress").textContent=t.ready;
    }
  }
);

</script>
