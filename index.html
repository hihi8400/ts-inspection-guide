
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자동차검사 다국어 AI 안내 시범서비스</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f9;color:#192b42;font-family:Arial,"Malgun Gothic",sans-serif}
header{background:#173d73;color:white;padding:25px 18px}
header h1{font-size:23px;margin:0 0 8px}
header p{margin:0;font-size:13px}
main{max-width:680px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h2{font-size:19px;margin:0 0 15px}
label{display:block;font-weight:bold;margin:13px 0 8px}
select,button{width:100%;font-size:16px;padding:15px;border-radius:10px}
select{background:white;border:1px solid #ccd6e4}
button{background:#1458aa;border:0;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.camera{display:block;background:#eaf2ff;border:2px dashed #8caed6;border-radius:12px;padding:22px;text-align:center;cursor:pointer;margin-bottom:12px}
.camera strong{display:block;font-size:18px}
.camera small{display:block;color:#51657e;margin-top:8px}
.camera input{display:none}
.preview{width:100%;max-height:260px;object-fit:contain;display:none;border-radius:10px;margin:10px 0}
.info{font-size:13px;color:#536780;line-height:1.7}
.warn{background:#fff2dc;border-radius:10px;padding:13px;line-height:1.7;margin-top:12px}
.result{background:#f1f6fd;padding:15px;border-radius:10px;margin:12px 0;line-height:1.8}
.bad{color:#aa2424;font-weight:bold}
#output{display:none}
#progress{font-weight:bold;color:#1458aa;margin:15px 0;white-space:pre-wrap}
details{margin-top:18px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
</style>
</head>
<body>
<header>
<h1>TS 다국어 자동차검사 안내</h1>
<p>Vehicle Inspection Guide · 비공식 OCR 시범서비스</p>
</header>
<main>
<section class="card">
<h2 id="step1">① 언어 선택</h2>
<select id="lang" onchange="updateUI()">
<option value="ko">한국어</option>
<option value="en">English</option>
<option value="zh">中文</option>
<option value="vi">Tiếng Việt</option>
</select>
</section>

<section class="card">
<h2 id="step2">② 진단서 촬영</h2>
<label class="camera">
<strong id="frontText">📷 앞면 촬영하기</strong>
<small id="frontHelp">눌러서 카메라를 실행하세요</small>
<input type="file" accept="image/*" capture="environment" id="front" onchange="previewImage(this,'frontPreview')">
</label>
<img class="preview" id="frontPreview" alt="앞면 미리보기">

<label class="camera">
<strong id="backText">📷 뒷면 촬영하기</strong>
<small id="backHelp">눌러서 카메라를 실행하세요</small>
<input type="file" accept="image/*" capture="environment" id="back" onchange="previewImage(this,'backPreview')">
</label>
<img class="preview" id="backPreview" alt="뒷면 미리보기">

<p class="info" id="photoInfo">촬영한 사진은 이 브라우저에서 OCR 처리합니다. 개인정보가 포함된 실제 고객 진단서는 시범 테스트에 사용하지 마세요.</p>
</section>

<section class="card">
<h2 id="step3">③ 자동 인식 및 번역</h2>
<button id="runBtn" onclick="analyze()">진단서 자동 분석하기</button>
<div id="progress" role="status"></div>
</section>

<section class="card" id="output">
<h2 id="resultHeading">분석 결과</h2>
<div id="results"></div>
<div class="warn" id="warning"></div>
<details>
<summary id="rawTitle">인식된 원문 확인</summary>
<pre id="raw"></pre>
</details>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const ui={
ko:["① 언어 선택","② 진단서 촬영","📷 앞면 촬영하기","📷 뒷면 촬영하기","눌러서 카메라를 실행하세요","③ 자동 인식 및 번역","진단서 자동 분석하기","분석 결과","인식된 원문 확인","사진에서 찾은 관련 항목","재검사 기한 후보","날짜를 찾지 못했습니다","분석 중","인식된 항목이 없습니다. 원문을 확인하세요","촬영한 사진은 이 브라우저에서 OCR 처리합니다. 실제 고객 진단서는 사용하지 마세요."],
en:["① Select language","② Photograph report","📷 Photograph front","📷 Photograph back","Tap to open camera","③ OCR and translation","Analyze report","Analysis results","Recognized original text","Related items found","Possible reinspection dates","No dates detected","Analyzing","No matching items found. Check original text.","Photos are processed in this browser. Do not use real customer reports."],
zh:["① 选择语言","② 拍摄检测报告","📷 拍摄正面","📷 拍摄背面","点击打开相机","③ 识别与翻译","分析检测报告","分析结果","查看识别原文","检测到的相关项目","可能的复检日期","未识别到日期","正在分析","未找到匹配项目，请核对原文。","照片在浏览器中处理。请勿使用真实客户报告。"],
vi:["① Chọn ngôn ngữ","② Chụp giấy kiểm định","📷 Chụp mặt trước","📷 Chụp mặt sau","Nhấn để mở máy ảnh","③ OCR và dịch","Phân tích giấy kiểm định","Kết quả phân tích","Văn bản gốc đã nhận dạng","Các mục được phát hiện","Ngày có thể liên quan đến kiểm định lại","Không tìm thấy ngày","Đang phân tích","Không tìm thấy mục phù hợp. Hãy kiểm tra bản gốc.","Ảnh được xử lý trong trình duyệt. Không dùng giấy tờ khách hàng thật."]
};
const items=[
{re:/번호판.{0,12}(등|조명)|등록번호판등|번호등/i,
text:["번호판등 관련 항목","License plate light item","车牌灯相关项目","Mục liên quan đèn biển số"]},
{re:/전조등|전조(우|좌)|헤드램프|헤드라이트/i,
text:["전조등 관련 항목","Headlamp item","前照灯相关项目","Mục liên quan đèn pha"]},
{re:/제동등|브레이크등|정지등/i,
text:["제동등 관련 항목","Brake light item","制动灯相关项目","Mục liên quan đèn phanh"]},
{re:/방향지시등|방향지시기|방향지시/i,
text:["방향지시등 관련 항목","Turn signal item","转向灯相关项目","Mục liên quan đèn xi nhan"]},
{re:/매연|배출가스|일산화탄소|탄화수소/i,
text:["배출가스 관련 항목","Emissions item","尾气排放相关项目","Mục liên quan khí thải"]},
{re:/주차제동|주차브레이크|주차 제동/i,
text:["주차제동장치 관련 항목","Parking brake item","驻车制动相关项目","Mục liên quan phanh đỗ"]}
];
const warnings={
ko:"⚠️ 이 화면은 OCR 시범 결과입니다. 항목이 발견됐다고 부적합이 확정되는 것은 아닙니다. 인식된 날짜도 일반 재검사 기한인지 온라인 신청 기한인지 자동 확정하지 않습니다. 반드시 원본 진단서와 검사원 안내를 확인하세요. 온라인 재검사 가능 여부는 진단서의 공식 표시를 확인해야 합니다.",
en:"⚠️ OCR demonstration only. Detected words do not confirm a failure. Dates are unverified and may not be reinspection deadlines. Check the original report and inspector guidance. Online reinspection eligibility must be verified on the official report.",
zh:"⚠️ 仅为文字识别演示。检测到项目不代表判定不合格。日期尚未核实，请对照正式报告并咨询检测员。在线复检资格以正式报告为准。",
vi:"⚠️ Đây chỉ là bản thử nghiệm OCR. Phát hiện từ khóa không có nghĩa là xe không đạt. Ngày tháng chưa được xác minh. Hãy kiểm tra giấy gốc và hỏi nhân viên. Điều kiện kiểm định lại trực tuyến phải dựa trên giấy chính thức."
};
function updateUI(){
const t=ui[$("lang").value];
["step1","step2","frontText","backText","frontHelp","step3","runBtn","resultHeading","rawTitle"].forEach((id,i)=>$(id).textContent=t[i]);
$("backHelp").textContent=t[4];
$("photoInfo").textContent=t[14];
}
function previewImage(input,id){
const img=$(id);
if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);
if(input.files&&input.files[0]){
img.dataset.url=URL.createObjectURL(input.files[0]);
img.src=img.dataset.url;
img.style.display="block";
}else img.style.display="none";
}
function addText(parent,tag,value,cls){
const e=document.createElement(tag);
e.textContent=value;
if(cls)e.className=cls;
parent.appendChild(e);
return e;
}
async function analyze(){
const files=[$("front").files[0],$("back").files[0]].filter(Boolean);
if(!files.length){alert("진단서 사진을 먼저 촬영해 주세요.");return;}
if(!window.Tesseract){
$("progress").textContent="OCR 프로그램을 불러오지 못했습니다. 인터넷 연결을 확인하세요.";
return;
}
$("runBtn").disabled=true;
$("output").style.display="none";
const lang=$("lang").value;
const t=ui[lang];
let worker;
try{
$("progress").textContent=t[12];
worker=await Tesseract.createWorker("kor+eng",1,{
logger:m=>{
if(m.status==="recognizing text")
$("progress").textContent=t[12]+" "+Math.round((m.progress||0)*100)+"%";
}
});
let raw="";
for(let i=0;i<files.length;i++){
$("progress").textContent=t[12]+" ("+(i+1)+"/"+files.length+")";
const result=await worker.recognize(files[i]);
raw+="\n--- PHOTO "+(i+1)+" ---\n"+result.data.text+"\n";
}
$("raw").textContent=raw;
const resultBox=$("results");
resultBox.replaceChildren();
addText(resultBox,"h3",t[9]);
const found=items.filter(item=>item.re.test(raw));
if(found.length){
for(const item of found){
addText(resultBox,"div","• "+item.text[["ko","en","zh","vi"].indexOf(lang)],"result");
}
}else addText(resultBox,"p",t[13]);
addText(resultBox,"h3",t[10]);
const dateMatches=raw.match(/\b20\d{2}\s*[.\-\/년]\s*(?:0?[1-9]|1[0-2])\s*[.\-\/월]\s*(?:0?[1-9]|[12]\d|3[01])\s*일?/g)||[];
const dates=[...new Set(dateMatches)].slice(0,12);
addText(resultBox,"p",dates.length?dates.join(" / "):t[11]);
$("warning").textContent=warnings[lang];
$("output").style.display="block";
$("progress").textContent="✓ OCR 완료";
$("output").scrollIntoView({behavior:"smooth"});
}catch(e){
$("progress").textContent="OCR 오류: "+e.message;
}finally{
if(worker)await worker.terminate();
$("runBtn").disabled=false;
}
}
updateUI();
</script>
</body>
</html>
