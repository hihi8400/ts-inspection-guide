function dateInput(value){
  if(!value) return "";
  const d = datesInText(value);
  return d.length === 1
    ? d[0].date.replace(/\./g,"-")

}

function dateOutput(value){
  return value
    ? value.replace(/-/g,".")
    : null;
}

function fillEditor(){

  if(!currentResult) return;

  const r = currentResult;

      option.value = value;

    select.value = r.states[key] || "unknown";

  });

}

$("manualApply").addEventListener("click",()=>{

    ? null

  r.basic.inspectionDate =
    dateOutput($("editInspectionDate").value);

  r.basic.registration =
    $("editRegistration").value.trim() || null;

  r.basic.model =
    $("editModel").value.trim() || null;

  r.basic.firstRegistration =
    dateOutput($("editFirstRegistration").value);

  r.basic.mileage =
    $("editMileage").value.trim() || null;

  r.basic.nextInspection =
    r.decision === "pass" ? r.date :
    r.decision === "fail" ? "reinspectionRequired" :
    null;

  r.basic.reinspection =
    r.decision === "fail" ? r.date : null;

  CATEGORY_KEYS.forEach(key=>{
    r.states[key] = $("edit_"+key).value;
  });

  r.faults = $("editFaults").value
    .split(/\n/)
    .map(s=>s.trim())
    .filter(Boolean);

  if(r.decision === "pass" && r.faults.length){
    alert("적합 판정과 부적합 사유가 일치하지 않습니다.");
    return;
  }

  r.manualEdited = true;

  currentResult = r;

  render();

  editor.open = false;

  $("decisionBox").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

});

const oldRender = render;

render = function(){

  translateUI();

  if(!currentResult) return;

  if(currentResult !== lastRenderedResult){

    if(!currentResult.manualEdited){
      originalResult = structuredClone(currentResult);
    }

    lastRenderedResult = currentResult;

  }

  oldRender();

  const r = currentResult;
  const t = lang();

  if(r.decision === "unknown"){
    $("dateLabel").textContent = t.unknownDecision;
    $("dateValue").textContent = t.verify;
  }

  $("manualFlag").textContent =
    r.manualEdited ? getUI()[19] : "";

  const fields = [
    "inspectionDate",
    "registration",
    "model",
    "firstRegistration",
    "nextInspection",
    "reinspection",
    "mileage"
  ];

  [...$("infoRows").children].forEach((row,index)=>{

    const key = fields[index];

    if(
      (r.decision === "pass" && key === "reinspection") ||
      (r.decision === "fail" && key === "nextInspection") ||
      (r.decision === "unknown" &&
        ["nextInspection","reinspection"].includes(key))
    ){
      row.remove();
    }

  });

  fillEditor();

  translateUI();

};

/* 부적합 사유 원문 보존 */

const previousTranslateFault = translateFault;

translateFault = function(original,language){

  if(language === "ko") return original;

  const s = compact(original);

  if(/매연농도/.test(s) &&
     /허용기준초과/.test(s)){

    const translations = {
      en:"Smoke concentration exceeds the permissible limit",
      zh:"烟度浓度超过允许限值",
      vi:"Nồng độ khói vượt quá giới hạn cho phép"
    };

    return translations[language] || null;

  }

  return previousTranslateFault(original,language);

};

/* 날짜 추출: 명시된 날짜만 사용 */

exactFrontDateByLabel = function(texts,kind){

  const label = kind === "fail"
    ? /재\s*검\s*사\s*(?:기\s*간|기\s*한)/
    : /다\s*음\s*검\s*사\s*일/;

  const found = new Set();

  for(const raw of texts){

    const lines = String(raw || "").split("\n");

    for(const line of lines){

      const match = label.exec(line);

      if(!match) continue;

      const tail = line.slice(
        match.index + match[0].length
      ).split(
        /검사일자|최초등록|차명|주행거리|유효기간/
      )[0];

      const dates = datesInText(tail);

      if(dates.length){
        found.add(dates[dates.length-1].date);
      }

    }

  }

  return found.size === 1
    ? [...found][0]
    : null;

};

/* 차량번호 충돌 방지 */

extractPlateFromTexts = function(texts){

  const values = new Set();

  for(const text of texts){

    const matches = String(text || "")
      .matchAll(/(\d{2,3})\s*([가-힣])\s*(\d{4})/g);

    for(const m of matches){
      values.add(m[1]+m[2]+m[3]);
    }

  }

  return values.size === 1
    ? [...values][0]
    : null;

};

/* 부적합 영역 인식 개선 */

extractFaultBlock = function(text){

  const s = cleanText(text);

  const start = /(?:<\s*부\s*적\s*합\s*>|^\s*부\s*적\s*합\s*[:：]\s*)/m.exec(s);

  if(!start) return "";

  let tail = s.slice(start.index+start[0].length);

  const end = /<\s*종\s*합\s*의\s*견\s*>|종\s*합\s*의\s*견|최\s*종\s*판\s*정/.exec(tail);

  if(end) tail = tail.slice(0,end.index);

  return tail.slice(0,1200);

};

/* 합격 여부를 근거로 등화장치를 추정하지 않음 */

const previousParseOpinions = parseFrontOpinions;

let lastLightingEvidence = "unknown";

parseFrontOpinions = function(...args){

  const result = previousParseOpinions(...args);

  lastLightingEvidence =
    result.states.lighting || "unknown";

  return result;

};

const renderWithEditor = render;

render = function(){

  if(currentResult && !currentResult.manualEdited){

    if(
      currentResult.states.lighting === "good" &&
      lastLightingEvidence === "unknown"
    ){
      currentResult.states.lighting = "unknown";
    }

  }

  renderWithEditor();

};
