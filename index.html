let last=null;

function langIndex(){
return languages.indexOf($("language").value);
}

function preview(input,id){
const img=$(id);
if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);
if(input.files[0]){
img.dataset.url=URL.createObjectURL(input.files[0]);
img.src=img.dataset.url;
img.style.display="block";
}
}

function element(tag,cls,text){
const e=document.createElement(tag);
if(cls)e.className=cls;
if(text!==undefined)e.textContent=text;
return e;
}

/* 사진을 확대하고 명암을 보정 */
async function prepare(file){
const bitmap=await createImageBitmap(file);
const scale=Math.min(2.2,2800/bitmap.width);
const canvas=document.createElement("canvas");
canvas.width=Math.max(1,Math.round(bitmap.width*scale));
canvas.height=Math.max(1,Math.round(bitmap.height*scale));
const ctx=canvas.getContext("2d",{willReadFrequently:true});
ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
bitmap.close();

const img=ctx.getImageData(0,0,canvas.width,canvas.height);
for(let i=0;i<img.data.length;i+=4){
let gray=.299*img.data[i]+.587*img.data[i+1]+.114*img.data[i+2];
gray=Math.max(0,Math.min(255,(gray-128)*1.5+128));
img.data[i]=gray;
img.data[i+1]=gray;
img.data[i+2]=gray;
}
ctx.putImageData(img,0,0);
return canvas;
}

function crop(c,x,y,w,h){
const out=document.createElement("canvas");
out.width=Math.round(c.width*w);
out.height=Math.round(c.height*h);
out.getContext("2d").drawImage(
c,c.width*x,c.height*y,c.width*w,c.height*h,
0,0,out.width,out.height
);
return out;
}

/* 최종 판정은 뒷면의 '최종판정' 문구 근처에서 확인 */
function finalDecision(backText){
const lines=backText.split(/\n/);
for(let i=0;i<lines.length;i++){
if(!/최종\s*판정|최종판정/.test(lines[i]))continue;
const area=lines.slice(i,i+3).join(" ");
if(/부\s*적\s*합/.test(area))return "fail";
if(/(?<!부)\s*적\s*합/.test(area))return "pass";
}
return "unknown";
}

/* 종합진단결과의 번호가 붙은 지적사항만 우선 분석 */
function faultEvidence(backText){
const lines=backText.split(/\n/).map(s=>s.trim()).filter(Boolean);
const start=lines.findIndex(s=>/종합\s*진단\s*결과/.test(s));
if(start<0)return [];

const selected=[];
for(let i=start+1;i<Math.min(lines.length,start+45);i++){
const line=lines[i];
if(/재검사|검사비용|검사책임자|발급일|고객님의/.test(line))break;
selected.push(line);
}
return selected.filter(s=>
/^\s*[\[(]?\d{1,2}[\])\].?\s*/.test(s)
);
}

function negative(s){
return /부적합|불량|미달|초과|점등되지|작동하지|결함|기준치.*미달|기준.*초과/.test(s);
}

/* 부적합은 뒷면 종합진단결과에서 확인된 경우만 표시 */
function classify(backText,frontText,decision){
const faultLines=faultEvidence(backText);
const frontLines=frontText.split(/\n/).map(s=>s.trim());

return groups.map(g=>{
const relevant=faultLines.filter(s=>g.terms.test(s)&&negative(s));

if(relevant.length){
const evidence=relevant.join(" ");
const specific=g.faults.find(f=>f[0].test(evidence));
return {
status:"fail",
message:specific?specific[1]:
["검사 항목 이상","Inspection fault","检测项目异常","Lỗi kiểm định"]
};
}

/*
정상 표시는 최종 적합이 확인된 경우에만 전체 항목에 적용.
최종 부적합인 경우에는 개별 항목의 적합 근거가 필요.
*/
if(decision==="pass"){
return {status:"good"};
}

const explicitGood=frontLines.some(s=>
g.terms.test(s)&&
/양호|적합|이상\s*없음/.test(s)&&
!/부적합|미달|초과|불량/.test(s)&&
s.length<85
);

if(explicitGood){
return {status:"good"};
}
return {status:"unknown"};
});
}

/* 재검사 문구와 가까운 날짜만 추출 */
function extractDeadline(backText,frontText){
const lines=backText.split(/\n/);
const issueYear=(backText+"\n"+frontText).match(/20\d{2}\s*년\s*\d{1,2}\s*월\s*\d{1,2}\s*일/);
const year=issueYear?issueYear[0].match(/20\d{2}/)[0]:null;

for(let i=0;i<lines.length;i++){
if(!/재검사|까지|재검\s*기간/.test(lines[i]))continue;

const area=lines.slice(Math.max(0,i-1),i+3).join(" ");

let m=area.match(/(20\d{2})\s*[년.\-/]\s*(\d{1,2})\s*[월.\-/]\s*(\d{1,2})/);
if(m){
return {
text:`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`,
verified:false
};
}

m=area.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일?\s*까지/);
if(m){
return {
text:(year?year+"-":"")+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0")+
(year?"":" (연도 확인 필요)"),
verified:false
};
}
}
return null;
}

function addHero(parent,style,label,value,sub){
const box=element("div","hero "+style);
box.appendChild(element("div","small",label));
box.appendChild(element("div","big",value));
if(sub)box.appendChild(element("div","sub",sub));
parent.appendChild(box);
}

function render(){
const idx=langIndex();
const t=T[languages[idx]];

$("languageTitle").textContent=t.language;
$("photoTitle").textContent=t.photo;
$("frontLabel").textContent=t.front;
$("backLabel").textContent=t.back;
$("analyzeTitle").textContent=t.analyze;
$("run").textContent=t.run;
$("resultTitle").textContent=t.result;
$("tableTitle").textContent=t.table;
$("rawLabel").textContent=t.raw;
$("privacy").textContent=t.privacy;
$("notice").textContent=t.notice;

if(!last)return;

const top=$("topCards");
top.replaceChildren();

/*
부적합: 재검사 기한을 맨 위에 표시.
적합: 합격을 맨 위에 표시.
*/
if(last.decision==="fail"){
addHero(
top,"red",
t.deadline,
last.deadline?last.deadline.text:t.dateUnknown,
last.deadline?"⚠ Verify on original report":""
);
addHero(top,"red",t.result,t.fail,"✕");
}else if(last.decision==="pass"){
addHero(top,"green",t.result,t.pass,"✓");
}else{
addHero(top,"yellow",t.result,t.unknown,"?");
if(last.deadline){
addHero(top,"yellow",t.deadline,last.deadline.text,"⚠ Verify");
}
}

const tbody=$("rows");
tbody.replaceChildren();

last.statuses.forEach((s,i)=>{
const tr=element("tr");
const name=element("td","",groups[i].names[idx]);
const value=element("td");

if(s.status==="good"){
value.className="ok";
value.textContent="✓ "+t.good;
}else if(s.status==="fail"){
value.className="bad";
value.textContent="✕ "+t.bad+" · "+s.message[idx];
}else{
value.className="check";
value.textContent="? "+t.check;
}

tr.append(name,value);
tbody.appendChild(tr);
});

$("result").style.display="block";
}

async function analyze(){
const front=$("front").files[0];
const back=$("back").files[0];

if(!front&&!back){
alert("진단서 사진을 먼저 선택하세요.");
return;
}
if(!window.Tesseract){
alert("OCR 프로그램을 불러오지 못했습니다. 인터넷 연결을 확인하세요.");
return;
}

const t=T[$("language").value];
$("run").disabled=true;
$("progress").textContent=t.loading;
$("result").style.display="none";

let worker;
try{
worker=await Tesseract.createWorker("kor+eng",1,{
logger:m=>{
if(m.status==="recognizing text"){
$("progress").textContent=t.loading+" "+
Math.round((m.progress||0)*100)+"%";
}
}
});

async function read(file,isBack){
if(!file)return "";
const canvas=await prepare(file);
let text=(await worker.recognize(canvas)).data.text;

if(isBack){
const regions=[
crop(canvas,.10,.35,.82,.30),
crop(canvas,.10,.57,.82,.32)
];
for(const region of regions){
text+="\n"+(await worker.recognize(region)).data.text;
}
}
return text;
}

const backText=await read(back,true);
const frontText=await read(front,false);

$("raw").textContent=
"--- BACK ---\n"+backText+
"\n--- FRONT ---\n"+frontText;

const decision=finalDecision(backText);
const statuses=classify(backText,frontText,decision);
const deadline=extractDeadline(backText,frontText);

last={decision,statuses,deadline};

render();
$("progress").textContent=t.done;
$("result").scrollIntoView({behavior:"smooth"});

}catch(e){
$("progress").textContent="OCR 오류: "+e.message;
}finally{
if(worker)await worker.terminate();
$("run").disabled=false;
}
}

render();
</script>
