
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#135b91">
<title>자동차검사 다국어 결과 안내</title>

<style>
:root{
  --blue:#145e96;
  --navy:#17344d;
  --bg:#eef4fa;
  --line:#dce5ed;
  --red:#ac2529;
  --green:#167443;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--navy);
  font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;
  line-height:1.5;
}
header{
  background:linear-gradient(120deg,#196fa9,#0d477a);
  color:white;
  padding:18px 16px;
}
.header-inner{
  max-width:1050px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.brand{
  font-size:22px;
  font-weight:900;
}
.brand small{
  display:block;
  font-size:12px;
  font-weight:500;
  opacity:.9;
}
select,input,button{font:inherit}
#lang{
  max-width:140px;
  padding:10px 7px;
  background:white;
  color:var(--navy);
  border:0;
  border-radius:9px;
}
main{
  max-width:1050px;
  margin:auto;
  padding:16px 13px 35px;
}
.card{
  background:white;
  border:1px solid #dae5ef;
  border-radius:18px;
  padding:19px;
  margin-bottom:15px;
  box-shadow:0 3px 13px #23415e0b;
}
h2{
  font-size:22px;
  margin:0 0 16px;
  font-weight:900;
}
.uploads{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.upload{
  display:block;
  padding:16px;
  background:#f3f9ff;
  border:2px dashed #9cbad1;
  border-radius:12px;
  font-size:17px;
  font-weight:800;
}
.upload input{
  display:block;
  width:100%;
  margin-top:10px;
  font-size:14px;
  font-weight:400;
}
button{
  background:var(--blue);
  color:white;
  border:0;
  border-radius:11px;
  padding:15px;
  font-size:18px;
  font-weight:850;
  cursor:pointer;
}
button:disabled{opacity:.55}
#run{width:100%;margin-top:14px}
#progress{
  font-size:15px;
  font-weight:700;
  color:#37617f;
  white-space:pre-wrap;
}
.version{
  text-align:right;
  font-size:11px;
  color:#73879a;
  margin-top:7px;
}
#result{display:none}
.hero{
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:15px;
  padding:24px;
  border-radius:18px;
  margin-bottom:16px;
}
.hero.fail{
  background:#ffe6e6;
  color:#a41f25;
}
.hero.pass{
  background:#e0f5e7;
  color:#106c39;
}
.hero.unknown{
  background:#fff0d8;
  color:#76521e;
}
.verdict{
  font-size:clamp(34px,5vw,47px);
  font-weight:950;
  line-height:1.15;
}
.verdict-sub{
  font-size:17px;
  margin-top:7px;
}
.deadline-box{
  border-left:2px solid currentColor;
  padding-left:22px;
}
.deadline-label{
  font-size:19px;
  font-weight:800;
}
.deadline-value{
  font-size:clamp(26px,4vw,39px);
  font-weight:950;
  line-height:1.3;
  margin-top:7px;
  overflow-wrap:anywhere;
}
.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 15px;
}
.info-row{
  display:grid;
  grid-template-columns:43% 57%;
  border:1px solid #d4e1ec;
  border-radius:9px;
  overflow:hidden;
}
.info-name{
  padding:12px 10px;
  background:#eaf4ff;
  font-weight:800;
  font-size:16px;
}
.info-value{
  padding:12px 10px;
  font-weight:750;
  font-size:17px;
  overflow-wrap:anywhere;
}
.info-row.highlight .info-value{
  background:#fff0ef;
  color:#ae2025;
  font-weight:900;
}
.info-value.missing{color:#856c4a}
.privacy{
  font-size:14px;
  color:#526b7c;
  margin:16px 0 0;
}
.columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.item{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:0}
.item-name{
  font-size:17px;
  font-weight:800;
}
.state{
  border-radius:9px;
  padding:7px 10px;
  min-width:105px;
  max-width:180px;
  text-align:center;
  font-size:16px;
  font-weight:850;
  line-height:1.3;
}
.state.good{
  background:#def5e6;
  color:#0c743d;
}
.state.need{
  background:#ffe2e2;
  color:#ae252a;
}
.state.unread{
  background:#edf0f3;
  color:#6c5a42;
}
.fault{
  background:#fff0f0;
  border-left:6px solid #b72b30;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
}
.fault-translation{
  color:#a62227;
  font-size:19px;
  font-weight:900;
  overflow-wrap:anywhere;
}
.fault-original{
  color:#526170;
  font-size:14px;
  margin-top:8px;
  overflow-wrap:anywhere;
}
.notice{
  background:#fff1dd;
  border-radius:12px;
  padding:15px;
  color:#715536;
  font-size:14px;
  line-height:1.7;
}
.help{
  font-size:14px;
  color:#627589;
}
#review{
  margin-top:15px;
}
summary{
  font-size:17px;
  font-weight:850;
  cursor:pointer;
}
.edit-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:15px 0;
}
.edit-field label{
  display:block;
  font-size:14px;
  font-weight:750;
  margin-bottom:5px;
}
.edit-field input,
.edit-field select{
  width:100%;
  border:1px solid #b7c8d8;
  border-radius:9px;
  padding:10px;
  background:white;
  font-size:15px;
}
#apply{width:100%}
@media(max-width:720px){
  .uploads,.columns,.info-grid{
    grid-template-columns:1fr;
  }
  .hero{
    grid-template-columns:1fr;
    padding:21px;
  }
  .deadline-box{
    border-left:0;
    border-top:1px solid currentColor;
    padding:15px 0 0;
  }
  .deadline-value{font-size:33px}
  .card{padding:16px}
}
@media(max-width:420px){
  .brand{font-size:18px}
  .info-name{font-size:14px}
  .info-value{font-size:15px}
  .item-name{font-size:16px}
  .state{font-size:14px;min-width:92px}
  .edit-grid{grid-template-columns:1fr}
}
</style>
</head>

  <section class="card">

    <p id="privacy" class="privacy"></p>
  </section>

  <div class="columns">
    <section class="card">
      <h2 id="itemsTitle"></h2>
      <div id="items"></div>
      <p id="itemHelp" class="help"></p>
    </section>

    <section class="card">
      <h2 id="faultTitle"></h2>
      <div id="faults"></div>
    </section>
  </div>

  <div id="notice" class="notice"></div>

  <details id="review" class="card">
    <summary id="reviewTitle">검사원 원본 확인·수정</summary>
    <p id="reviewHelp" class="help"></p>
    <div id="editGrid" class="edit-grid"></div>
    <button id="apply">확인한 내용 적용</button>
  </details>

</div>

</main>

function make(tag,cls,value){
const e=document.createElement(tag);
if(cls)e.className=cls;
if(value!==undefined)e.textContent=value;
return e;
}

function compact(s){
return String(s||"")
.replace(/[\s<>〈〉\[\]【】(){}|:：,，.·\-]/g,"");
}

function checkDate(y,m,d){
y=Number(y);
m=Number(m);
d=Number(d);

const x=new Date(y,m-1,d);

if(
y<2020||y>2099||
x.getFullYear()!==y||
x.getMonth()!==m-1||
x.getDate()!==d
)return null;

return [
y,
String(m).padStart(2,"0"),
String(d).padStart(2,"0")
].join(".");
}

function findDates(s){
const out=[];

/(20\d{2})[^\d\n]{0,8}(\d{1,2})[^\d\n]{0,8}(\d{1,2})(?!\d)/g
)){
const d=checkDate(m[1],m[2],m[3]);
if(d)out.push(d);
}

for(const m of String(s||"").matchAll(
/(?<!\d)(20\d{2})(\d{2})(\d{2})(?!\d)/g
)){
const d=checkDate(m[1],m[2],m[3]);
if(d)out.push(d);
}

return unique(out);
}

function findPlate(s){
const m=String(s||"").match(
/(?<!\d)(\d{2,3})\s*([가-힣])\s*(\d{4})(?!\d)/
);

return m?m[1]+m[2]+m[3]:null;
}

function findMileage(s){
const m=String(s||"").match(
/(?<!\d)(\d{1,3}(?:,\d{3})+|\d{1,7})\s*(?:km|㎞)/i
);

return m
?Number(m[1].replace(/,/g,"")).toLocaleString("en-US")+" km"
:null;
}

function getLines(tsv){
const groups=new Map();

for(const raw of String(tsv||"").split(/\r?\n/).slice(1)){
const a=raw.split("\t");

if(a.length<12||a[0]!=="5")continue;

const word=a.slice(11).join("\t").trim();
const x=Number(a[6]);
const y=Number(a[7]);
const w=Number(a[8]);
const h=Number(a[9]);

if(
!word||
![x,y,w,h].every(Number.isFinite)
)continue;

const key=a.slice(1,5).join("_");

if(!groups.has(key))groups.set(key,[]);

groups.get(key).push({
word,x,y,w,h
});
}

return [...groups.values()].map(words=>{
words.sort((a,b)=>a.x-b.x);

return {
text:words.map(x=>x.word).join(" "),
x:Math.min(...words.map(x=>x.x)),
y:Math.min(...words.map(x=>x.y)),
right:Math.max(...words.map(x=>x.x+x.w)),
bottom:Math.max(...words.map(x=>x.y+x.h))
};
}).sort((a,b)=>a.y-b.y);
}

function mergeLinesNear(lines,anchor,width){
const cy=(anchor.y+anchor.bottom)/2;

return lines.filter(l=>{
const ly=(l.y+l.bottom)/2;

return Math.abs(ly-cy)<
Math.max(17,anchor.bottom-anchor.y+10)&&
l.x>anchor.x-15&&
l.x<anchor.right+width;
}).sort((a,b)=>a.x-b.x)
.map(l=>l.text)
.join(" ");
}

function labelValues(text,re,parser){
const lines=String(text||"").split(/\r?\n/);
const values=[];

for(let i=0;i<lines.length;i++){
const m=re.exec(lines[i]);
if(!m)continue;

const tail=lines[i].slice(m.index+m[0].length);
const value=parser(tail);

if(value)values.push(value);
}

return unique(values);
}

function labeledDates(text,re){
const lines=String(text||"").split(/\r?\n/);
const values=[];

for(let i=0;i<lines.length;i++){
const m=re.exec(lines[i]);
if(!m)continue;

const tail=lines[i].slice(m.index+m[0].length);

values.push(...findDates(tail));
}

return unique(values);
}

function choose(values){
const v=unique(values);
return v.length===1?v[0]:null;
}

function imageCanvas(file){
return new Promise((resolve,reject)=>{
const img=new Image();
const url=URL.createObjectURL(file);

img.onload=()=>{
const scale=Math.min(
2.1,
2900/img.width,
4000/img.height
);

const c=document.createElement("canvas");
c.width=Math.round(img.width*scale);
c.height=Math.round(img.height*scale);

c.getContext("2d").drawImage(
img,0,0,c.width,c.height
);

URL.revokeObjectURL(url);
resolve(c);
};

img.onerror=()=>{
URL.revokeObjectURL(url);
reject(new Error("사진을 열 수 없습니다."));
};

img.src=url;
});
}

function crop(c,x,y,w,h,scale=2,enhance=false){
x=Math.max(0,Math.min(.999,x));
y=Math.max(0,Math.min(.999,y));

w=Math.max(.001,Math.min(w,1-x));
h=Math.max(.001,Math.min(h,1-y));

const o=document.createElement("canvas");

o.width=Math.max(
1,
Math.round(c.width*w*scale)
);

o.height=Math.max(
1,
Math.round(c.height*h*scale)
);

const ctx=o.getContext("2d");

if(enhance){
ctx.filter="grayscale(1) contrast(1.7)";
}

ctx.drawImage(
c,
c.width*x,
c.height*y,
c.width*w,
c.height*h,
0,0,
o.width,
o.height
);

return o;
}

async function recognize(worker,canvas,psm="6",tsv=false){
await worker.setParameters({
tessedit_pageseg_mode:psm
});

const r=await worker.recognize(
canvas,
{},
tsv?{tsv:true}:{}
);

return r.data;
}

function boxAround(c,line,left=.015,right=.55,pad=.01,height=.045){
const x=Math.max(0,line.x/c.width-left);
const y=Math.max(0,line.y/c.height-pad);

return [
x,
y,
Math.min(
1-x,
(line.right-line.x)/c.width+right
),
Math.min(1-y,Math.max(
height,
(line.bottom-line.y)/c.height+pad*2
))
];
}

// 앞면에서 상단 정보표를 자동으로 찾는다.
// 날짜의 위치를 사진 전체의 고정 좌표로 가정하지 않는다.
async function readFrontTable(worker,canvas,full){
const lines=getLines(full.tsv);

const anchors=lines.filter(l=>
/검사\s*일자|자동차\s*등록\s*번호|다음\s*검사일|재\s*검사\s*기\s*[간한]|주행\s*거리/.test(l.text)
);

const crops=[];
const geometry=[{
lines,
width:canvas.width,
height:canvas.height
}];

if(anchors.length){
const top=Math.max(
0,
Math.min(...anchors.map(l=>l.y))/canvas.height-.025
);

const bottom=Math.min(
1,
Math.max(...anchors.map(l=>l.bottom))/canvas.height+.045
);

const area=crop(
canvas,
.005,
top,
.985,
Math.max(.045,bottom-top),
1.8,
true
);

const result=await recognize(
worker,
area,
"6",
true
);

crops.push({
type:"table",
text:result.text||""
});

geometry.push({
lines:getLines(result.tsv),
width:area.width,
height:area.height
});
}

// 날짜 라벨이 포함된 행을 독립적으로 다시 읽는다.
const dateAnchors=anchors.filter(l=>
/다음\s*검사일|재\s*검사\s*기\s*[간한]/.test(l.text)
);

for(const a of dateAnchors.slice(0,5)){
const b=boxAround(
canvas,a,.015,.66,.012,.055
);

for(const mode of ["6","7"]){
const r=await recognize(
worker,
crop(
canvas,
...b,
2.3,
mode==="7"
),
mode
);

crops.push({
type:/재\s*검사/.test(a.text)
?"reinspection"
:"next",
text:r.text||""
});
}
}

return {
crops,
geometry
};
}

// 같은 행에서 라벨과 값을 연결한다.
function geometryValues(geometry,re,parser){
const found=[];

for(const g of geometry){
for(const a of g.lines.filter(l=>re.test(l.text))){
const text=mergeLinesNear(
g.lines,
a,
g.width*.65
);

const m=re.exec(text);
const after=m
?text.slice(m.index+m[0].length)
:text;

const v=parser(after);

if(Array.isArray(v)){
found.push(...v);
}else if(v){
found.push(v);
}
}
}

return unique(found);
}

function parseInfo(front,table){
const sources=[
front,
...table.crops.map(x=>x.text)
];

const info={
inspection:null,
plate:null,
model:null,
first:null,
next:null,
reinspection:null,
mileage:null
};

for(const key of [
"inspection",
"first",
"next",
"reinspection"
]){
const values=[];

for(const s of sources){
values.push(...labeledDates(
s,
LABELS[key]
));
}

values.push(...geometryValues(
table.geometry,
LABELS[key],
findDates
));

info[key]=choose(values);
}

// 날짜는 원본의 '재검사 기간' 라벨에
// 연결된 값만 우선 사용한다.
const deadlines=[];

for(const s of sources){
deadlines.push(
...labeledDates(
s,
LABELS.reinspection
)
);
}

deadlines.push(
...geometryValues(
table.geometry,
LABELS.reinspection,
findDates
)
);

for(const c of table.crops){
if(c.type==="reinspection"){
deadlines.push(...findDates(c.text));
}
}

info.reinspection=choose(deadlines);

// 라벨 OCR이 누락되었을 때,
// '까지'가 있는 상단 정보표 행만 추가 확인
if(!info.reinspection){
const untilDates=[];

for(const s of sources){
for(const line of s.split(/\r?\n/)){
if(
/까\s*지/.test(line)&&
/20\d{2}/.test(line)
){
untilDates.push(...findDates(line));
}
}
}

info.reinspection=choose(untilDates);
}

const plates=[];

for(const s of sources){
plates.push(
...labelValues(
s,
LABELS.plate,
findPlate
)
);
}

plates.push(...geometryValues(
table.geometry,
LABELS.plate,
findPlate
));

info.plate=choose(plates);

const mileages=[];

for(const s of sources){
mileages.push(
...labelValues(
s,
LABELS.mileage,
findMileage
)
);
}

mileages.push(...geometryValues(
table.geometry,
LABELS.mileage,
findMileage
));

info.mileage=choose(mileages);

const models=[];

for(const s of sources){
for(const line of s.split(/\r?\n/)){
const m=LABELS.model.exec(line);
if(!m)continue;

const tail=line
.slice(m.index+m[0].length)
.split(
/최초\s*등록일|소유자|차대\s*번호|주행\s*거리|원동기/
)[0]
.trim();

if(
tail.length>=2&&
tail.length<=35&&
/[가-힣A-Za-z]/.test(tail)&&
!/\d{4}년/.test(tail)
){
models.push(tail);
}
}
}

info.model=choose(models);

// '다음 검사일' 칸이 재검사 대상으로 표시된 경우
const tableText=sources.join("\n");

if(/재\s*검사\s*대상/.test(tableText)){
info.next="REINSPECTION_TARGET";
}

return info;
}

function parseVerdict(front,back,info){
const evidence=[];

for(const s0 of [front,back]){
const s=String(s0||"").replace(/\s+/g,"");

for(const m of s.matchAll(
/최종판[정청][:：]?(부적합|부적함|불합격|적합|합격)/g
)){
evidence.push(
/^(부|불)/.test(m[1])
?"fail"
:"pass"
);
}
}

const b=String(back||"").replace(/\s+/g,"");

if(/[<〈\[]부적[합함][>〉\]]/.test(b)){
evidence.push("fail");
}

if(info.next==="REINSPECTION_TARGET"){
evidence.push("fail");
}

const v=unique(evidence);

return v.length===1?v[0]:"unknown";
}

function wordState(s){
const a=String(s||"").replace(/\s+/g,"");

const good=/양호|정상|이상없음/.test(a);
const bad=/점검요|점검필요|불량|부적합/.test(a);

if(good&&!bad)return "good";
if(bad&&!good)return "need";

return "unread";
}

function categoryFromText(text,index){
const rows=String(text||"").split(/\r?\n/);
const out=[];

for(let i=0;i<rows.length;i++){
const m=CATEGORIES[index].re.exec(rows[i]);

if(!m)continue;

let rest=rows[i].slice(
m.index+m[0].length
);

if(
!/(양호|정상|점검요|불량)/.test(rest)&&
i+1<rows.length&&
!CATEGORIES.slice(0,6).some(
c=>c.re.test(rows[i+1])
)
){
rest+=" "+rows[i+1];
}

const s=wordState(rest);

if(s!=="unread")out.push(s);
}

return unique(out);
}

// 검사 항목별 위치는 표 내부의 실제 행 이름을 사용한다.
async function readCategoryBands(worker,canvas,tsv){
const lines=getLines(tsv);

const positions=CATEGORIES.slice(0,6).map(cat=>{
const matched=lines.filter(l=>
cat.anchors.some(re=>re.test(l.text))&&
l.y/canvas.height>.15
);

return matched.length
?Math.min(...matched.map(l=>l.y))
:null;
});

const out=Array.from(
{length:6},
()=>[]
);

for(let i=0;i<6;i++){
if(positions[i]===null)continue;

const next=positions
.slice(i+1)
.find(x=>x!==null&&x>positions[i]);

if(next===undefined)continue;

const top=Math.max(
0,
positions[i]-10
);

const bottom=Math.min(
canvas.height,
next-3
);

if(bottom-top<18)continue;

const y=top/canvas.height;
const h=(bottom-top)/canvas.height;

for(const [x,w] of [
[.51,.20],
[.71,.22]
]){
const r=await recognize(
worker,
crop(
canvas,
x,
y,
w,
h,
1.6,
true
),
"6"
);

out[i].push(r.text||"");
}
}

return out;
}

function parseCategories(front,back,crops){
const out=[];

for(let i=0;i<6;i++){
const values=categoryFromText(
front,
i
);

for(const s of crops[i]){
const v=wordState(s);
if(v!=="unread")values.push(v);
}

out.push(
choose(values)||"unread"
);
}

const sensor=String(back||"")
.replace(/\s+/g,"")
.match(
/(?:전자제어센서|센서진단)(?:진단)?결과.{0,45}?(정상|양호|이상없음|점검요|불량)/
);

out.push(
sensor
?wordState(sensor[1])
:"unread"
);

return out;
}

function splitDefects(s){
const pieces=[];
let part="";
let depth=0;

for(const ch of String(s||"")){
if("[［(（【".includes(ch))depth++;

if("]］)）】".includes(ch)){
depth=Math.max(0,depth-1);
}

if(
(ch===","||ch==="，"||ch==="\n")&&
depth===0
){
if(part.trim())pieces.push(part.trim());
part="";
}else{
part+=ch;
}
}

if(part.trim())pieces.push(part.trim());

return pieces;
}

function cleanDefect(s){
s=String(s||"")
.replace(/^[^가-힣]+/,"")
.trim();

if(/^기타\s*[\[［(（【]/.test(s)){
const m=s.match(
/^기타\s*[\[［(（【][^\]］)）】\n]{2,85}[\]］)）】]/
);

return m?m[0].trim():"";
}

return s.replace(/[;:：.]+$/,"").trim();
}

function validDefect(s){
return s.length>=4&&
s.length<=95&&
/[가-힣]/.test(s)&&
!/검사소|자동차관리법|원상복구|하시기|정비하여|과태료|고객님|합니다|바랍니다|종합의견/.test(s)&&
/임의\s*(변경|설치)|^기타\s*[\[［(（【]|불량|미달|파손|누유|초과|부식|손상|미점등|작동불량/.test(s);
}

// 반드시 뒷면 <부적합> 영역을 우선한다.
function extractDefects(back){
const rows=String(back||"").split(/\r?\n/);
const blocks=[];

for(let i=0;i<rows.length;i++){
const header=rows[i].match(
/[<〈\[]?\s*부\s*적\s*[합함]\s*[>〉\]]/
);

if(!header)continue;

let text=rows[i].slice(
header.index+header[0].length
);

for(let j=i+1;j<Math.min(i+5,rows.length);j++){
if(
/종\s*합\s*의\s*견|최종\s*판정|\[\s*1\s*\]/.test(rows[j])
)break;

text+="\n"+rows[j];
}

text=text.split(
/종\s*합\s*의\s*견|\[\s*1\s*\]/
)[0];

const list=splitDefects(text)
.map(cleanDefect)
.filter(validDefect);

if(list.length)blocks.push(list);
}

// OCR이 <부적합> 표시를 누락한 경우,
// 쉼표로 구분된 짧은 결함 목록만 제한적으로 검색
if(!blocks.length){
for(const line of rows){
if(
/임의\s*(변경|설치)/.test(line)&&
/기타\s*[\[［(（【]|[,，]/.test(line)&&
!/종합의견|자동차관리법|원상복구/.test(line)
){
const list=splitDefects(line)
.map(cleanDefect)
.filter(validDefect);

if(list.length)blocks.push(list);
}
}
}

const score=list=>
list.reduce((sum,s)=>
sum+(
DICTIONARY.some(([re])=>
re.test(compact(s).replace(/^기타/,""))
)?6:2
),0);

blocks.sort((a,b)=>score(b)-score(a));

return unique(blocks[0]||[]);
}

function translateDefect(s){
const k=compact(s).replace(/^기타/,"");

return DICTIONARY.find(
([re])=>re.test(k)
)?.[1]||null;
}

["pass",t.pass],
["fail",t.fail],
["unknown",t.unknown]
]){
const o=make("option","",label);
o.value=value;
verdictSelect.append(o);
}

verdictBox.append(verdictSelect);
grid.append(verdictBox);

for(const key of FIELDS){
const box=make("div","edit-field");

box.append(
make("label","",t[key])
);

const input=make("input");
input.dataset.field=key;

input.value=
current.info[key]==="REINSPECTION_TARGET"
?"재검사 대상"
:current.info[key]||"";

box.append(input);
grid.append(box);
}

for(let i=0;i<7;i++){
const box=make("div","edit-field");

box.append(
make(
"label",
"",
CATEGORIES[i].names[idx]
)
);

const select=make("select");
select.dataset.state=i;

for(const [value,label] of [
["auto",t.auto],
["good",t.good],
["need",t.need],
["unread",t.unread]
]){
const o=make("option","",label);
o.value=value;
select.append(o);
}

box.append(select);
grid.append(box);
}
}

function applyReview(){
if(!current)return;

for(const input of document.querySelectorAll(
"[data-field]"
)){
const key=input.dataset.field;
const value=input.value.trim();

if(
["inspection","first","reinspection"].includes(key)&&
value&&
!findDates(value).includes(value)
){
alert("날짜는 YYYY.MM.DD 형식으로 입력해 주세요.");
return;
}

current.info[key]=
value==="재검사 대상"
?"REINSPECTION_TARGET"
:value||null;
}

const verdict=$("editVerdict").value;

if(verdict!=="auto"){
current.status=verdict;
}

for(const s of document.querySelectorAll(
"[data-state]"
)){
if(s.value!=="auto"){
current.states[Number(s.dataset.state)]=s.value;
}
}

render();
}

async function analyze(){
if(busy)return;

const frontFile=$("front").files[0];
const backFile=$("back").files[0];

if(!frontFile||!backFile){
$("progress").textContent=
TEXT[$("lang").value].ready;
return;
}

if(!window.Tesseract){
$("progress").textContent=
"OCR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.";
return;
}

busy=true;
$("run").disabled=true;

let worker=null;

try{
const t=TEXT[$("lang").value];

$("progress").textContent=
t.working+" — 앞면 인식 준비";

worker=await Tesseract.createWorker(
"kor+eng",
1
);

const frontCanvas=await imageCanvas(frontFile);
const backCanvas=await imageCanvas(backFile);

// 1. 앞면 전체 인식
$("progress").textContent=
t.working+" — 앞면 전체 판독";

const front=await recognize(
worker,
frontCanvas,
"3",
true
);

// 2. 상단 정보표 및 재검사 기간 분석
$("progress").textContent=
t.working+" — 자동차 기본정보 및 날짜 판독";

const table=await readFrontTable(
worker,
frontCanvas,
front
);

const info=parseInfo(
front.text||"",
table
);

// 3. 검사 항목 진단의견 분석
$("progress").textContent=
t.working+" — 검사 항목 7개 판독";

const categoryCrops=await readCategoryBands(
worker,
frontCanvas,
front.tsv
);

// 4. 뒷면 전체 인식
$("progress").textContent=
t.working+" — 뒷면 판독";

const back=await recognize(
worker,
backCanvas,
"3",
true
);

const backText=back.text||"";

// 5. 판정, 검사 항목, 부적합 사유
$("progress").textContent=
t.working+" — 최종 결과 확인";

const verdict=parseVerdict(
front.text||"",
backText,
info
);

const states=parseCategories(
front.text||"",
backText,
categoryCrops
);

const defects=extractDefects(
backText
);

// 원본 OCR 문자열에는 개인정보가 포함될 수 있으므로
// 화면 상태에는 필요한 결과만 남긴다.
// 서버로 업로드하지 않는다.
current={
status:verdict,
info,
states,
defects
};

render();
makeReview();

$("progress").textContent=t.done;

$("result").scrollIntoView({
behavior:"smooth",
block:"start"
});

}catch(error){
$("progress").textContent=
"분석 오류: "+(
error.message||String(error)
);

}finally{
if(worker){
await worker.terminate().catch(()=>{});
}

busy=false;
$("run").disabled=false;
}
}

$("run").addEventListener(
"click",
analyze
);

$("apply").addEventListener(
"click",
applyReview
);

$("lang").addEventListener(
"change",
()=>{
if(current){
render();
makeReview();
}else{
const t=TEXT[$("lang").value];

$("brandTitle").textContent=t.brand;
$("uploadTitle").textContent=t.upload;
$("frontLabel").textContent=t.front;
$("backLabel").textContent=t.back;
$("run").textContent=t.run;
$("progress").textContent=t.ready;
}
}
);

</script>
</body>
</html>
