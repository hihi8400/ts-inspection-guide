<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';

const $=id=>document.getElementById(id);
const languages=['ko','en','zh','vi'];

const L={

},

}
};

const categories=[
{
names:['조향계통','Steering System','转向系统','Hệ thống lái'],
pattern:/조향\s*계[통동]/
},
{
names:['주행계통','Driving System','行驶系统','Hệ thống vận hành'],
pattern:/주행\s*계[통동]/
},
{
names:['제동계통','Braking System','制动系统','Hệ thống phanh'],
pattern:/제동\s*계[통동]/
},
{
names:['등화장치','Lighting','灯光装置','Hệ thống đèn'],
pattern:/등[화하]\s*장치/
},
{
names:['배출가스','Emissions','尾气排放','Khí thải'],
pattern:/배출\s*가스/
},
{
names:['계기계통','Instrument System','仪表系统','Hệ thống đồng hồ'],
pattern:/계기\s*계[통동]/
},
{
names:[
'자가진단 센서 점검',
'Self-Diagnostic Sensor Check',
'自诊断传感器检查',
'Kiểm tra cảm biến tự chẩn đoán'
],
pattern:/전자\s*제어\s*센서|자가?\s*진단\s*센서|자기\s*진단\s*센서/
}
];

const glossary=[
[
/^등화장치임의변경$/,
[
'등화장치 임의변경',
'Unauthorized modification of lighting equipment',
'擅自改装灯光装置',
'Tự ý thay đổi hệ thống đèn'
]
],
[
/^물품적재장치임의변경$/,
[
'물품적재장치 임의변경',
'Unauthorized modification of cargo-loading equipment',
'擅自改装载货装置',
'Tự ý thay đổi thiết bị chở hàng'
]
],
[
/^활어운반장치임의설치$/,
[
'활어운반장치 임의 설치',
'Unauthorized installation of live-fish transport equipment',
'擅自安装活鱼运输装置',
'Tự ý lắp đặt thiết bị vận chuyển cá sống'
]
],
[
/^안개등LED$/i,
[
'안개등 LED',
'Fog lamp LED',
'雾灯 LED',
'Đèn sương mù LED'
]
],
[
/^안개등임의변경$/,
[
'안개등 임의변경',
'Unauthorized modification of fog lights',
'擅自改装雾灯',
'Tự ý thay đổi đèn sương mù'
]
]
];

const normalize=s=>String(s||'')
.replace(/[\s<>〈〉\[\](){}|:：,，.·\-]/g,'');

const canonical=s=>String(s||'')
.replace(/등하\s*장치/g,'등화장치')
.replace(/룰품\s*적재/g,'물품적재');

const formatDate=(y,m,d)=>{
y=+y;m=+m;d=+d;
const z=new Date(y,m-1,d);
return z.getFullYear()===y &&
z.getMonth()===m-1 &&
z.getDate()===d
?`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`
:null;
};

function dates(s){
let out=[];
const re=/(20\d{2})\s*[년.\/-]\s*(\d{1,2})\s*[월.\/-]\s*(\d{1,2})\s*일?/g;
for(const m of s.matchAll(re)){
const d=formatDate(m[1],m[2],m[3]);
if(d)out.push(d);
}
return [...new Set(out)];
}

function getDecision(front,back){
for(const text of [back,front]){
for(const line of text.split(/\n/)){
if(/최종\s*판정/.test(line)){
const after=line.split(/최종\s*판정/)
.slice(1).join('').slice(0,30);
if(/부\s*적\s*합|불합격/.test(after))return 'fail';
if(/적\s*합|합격/.test(after))return 'pass';
}
}
}
return 'unknown';
}

function getDate(front,status){
const key=status==='fail'
?/재\s*검\s*사\s*(?:기\s*간|기\s*한)/
:/다\s*음\s*검\s*사\s*(?:일|날짜)/;

const lines=front.split(/\n/);

for(let i=0;i<lines.length;i++){
const m=key.exec(lines[i]);
if(!m)continue;

const fragment=lines[i].slice(m.index,m.index+100);
const ds=dates(fragment);

if(ds.length===1)return ds[0];
if(ds.length>1)return null;

const next=dates((lines[i+1]||'').slice(0,70));
if(next.length===1)return next[0];
}
return null;
}

function isFaultHeader(line){
return /[<〈\[]\s*부\s*적\s*합\s*[>〉\]]/.test(line)
||/^\s*[^가-힣]{0,6}부\s*적\s*합\s*[:：]?\s*$/.test(line);
}

function isStop(line){
return /종\s*합\s*의\s*견|종\s*합\s*진\s*단|진\s*단\s*결\s*과|^\s*\[1\]\s*등[화하]\s*장치가/.test(line);
}

function cleanItem(s){
return String(s)
.replace(/^\s*(?:\[\d+\]|\d+[.)])\s*/,'')
.replace(/^[\s;:：|.]+|[\s;:：|.]+$/g,'')
.trim();
}

function faultCandidates(text){
const lines=text.split(/\r?\n/);
const blocks=[];

for(let i=0;i<lines.length;i++){
if(!isFaultHeader(lines[i]))continue;

const section=[];
const inline=lines[i]
.replace(/^.*?[<〈\[]\s*부\s*적\s*합\s*[>〉\]]/,'')
.trim();

if(inline)section.push(inline);

for(let j=i+1;j<Math.min(lines.length,i+5);j++){
if(isStop(lines[j])||
/최종\s*판정|<리콜정보>/.test(lines[j]))break;

section.push(lines[j]);

if(section.join(' ').length>320)break;
}

const joined=section.join(' ')
.replace(/<\s*종합.*$/,'');

const pieces=joined.split(/[,，]/)
.map(cleanItem)
.filter(Boolean)
.filter(x=>x.length<=75 &&
!/검사소|자동차관리법|원상복구|정비하여|과태료/.test(x));

if(pieces.length)blocks.push(pieces);
}
return blocks;
}

function extractFaults(back){
const blocks=faultCandidates(back);
if(!blocks.length)return [];

blocks.sort((a,b)=>b.length-a.length);

const seen=new Set();

return blocks[0].filter(x=>{
const key=normalize(canonical(x));
if(!key||seen.has(key))return false;
seen.add(key);
return true;
}).slice(0,12);
}

function translateFault(raw){
let x=canonical(raw).trim()
.replace(/^기타\s*[\[(（]\s*/,'')
.replace(/[\])）]\s*$/,'');

const key=normalize(x);

for(const [re,t] of glossary){
if(re.test(key))return t;
}
return null;
}

function getStates(front,back,faults){
const states=categories.map(()=> 'unread');
const frontLines=front.split(/\r?\n/);

for(let i=0;i<categories.length;i++){
const lines=i===6
?back.split(/\r?\n/)
:frontLines;

for(let j=0;j<lines.length;j++){
const match=categories[i].pattern.exec(lines[j]);
if(!match)continue;

const same=lines[j].slice(match.index,match.index+110);
const next=(lines[j+1]||'').trim();

let sample=same;

if(
!/양\s*[호홍]|정\s*상|점\s*검\s*요|불\s*량|부\s*적\s*합/.test(same)
&&next.length<60
&&!categories.some(c=>c.pattern.test(next))
){
sample+=' '+next;
}

if(/점\s*검\s*요|점검\s*필요|부\s*적\s*합|불\s*량/.test(sample)){
states[i]='need';
}else if(
/양\s*[호홍]|정\s*상|이상\s*없음/.test(sample)
&&states[i]!=='need'
){
states[i]='good';
}
}
}

for(const raw of faults){
const s=normalize(canonical(raw));

if(/등화|안개등|전조등|제동등|방향지시등/.test(s)){
states[3]='need';
}
if(/조향|타이로드/.test(s)){
states[0]='need';
}
if(/브레이크|제동계통|제동력/.test(s)){
states[2]='need';
}
if(/타이어|주행계통|차축/.test(s)){
states[1]='need';
}
if(/배출가스|매연/.test(s)){
states[4]='need';
}
if(/계기계통|속도계/.test(s)){
states[5]='need';
}
if(/전자제어센서|자가진단|OBD/.test(s)){
states[6]='need';
}
}
return states;
}

let frontText='';
let backText='';
let manualDate='';
let result=null;
let busy=false;

function parse(){
const status=getDecision(frontText,backText);
const faults=extractFaults(backText);

return {
status,
date:manualDate||(
status==='unknown'?null:getDate(frontText,status)
),
faults,
states:getStates(frontText,backText,faults)
};
}

function el(tag,cls,value){
const e=document.createElement(tag);
if(cls)e.className=cls;
if(value!==undefined)e.textContent=value;
return e;
}

function render(){
if(!result)return;

const lang=$('lang').value;
const idx=languages.indexOf(lang);
const t=L[lang];

$('resultTitle').textContent=t.title;
$('itemTitle').textContent=t.items;
$('findingTitle').textContent=t.findings;
$('itemHelp').textContent=t.help;
$('warn').textContent=t.warn;

const hero=$('hero');
hero.replaceChildren();

const h=el(
'div',
'hero '+(
result.status==='fail'?'fail':
result.status==='pass'?'pass':'unknown'
)
);

h.append(el(
'b','',
result.status==='fail'?t.fail:
result.status==='pass'?t.pass:t.unknown
));

if(result.status!=='unknown'){
h.append(el(
'div','label',
result.status==='fail'?t.deadline:t.next
));
h.append(el(
'div','date',
result.date||t.date
));
}
hero.append(h);

$('rows').replaceChildren();

result.states.forEach((state,i)=>{
const tr=el('tr');

tr.append(el(
'td','',
categories[i].names[idx]
));

tr.append(el(
'td',
state==='good'?'good':
state==='need'?'need':'unread',
state==='good'?t.good:
state==='need'?t.need:t.unread
));

$('rows').append(tr);
});

$('findings').replaceChildren();

if(result.faults.length){
for(const raw of result.faults){
const tr=translateFault(raw);
const box=el('div','issue');

box.append(el(
'div','translated',
tr?tr[idx]:t.verify
));

box.append(el(
'div','original',
raw
));

$('findings').append(box);
}
}else if(
result.status==='pass' &&
/종합\s*진단\s*결과[\s\S]{0,65}(이상\s*없음|양호)/.test(backText)
){
$('findings').append(el(
'div','good',t.noIssues
));
}else{
$('findings').append(el(
'div','unread',t.missing
));
}

$('result').style.display='block';
}

function preview(side){
const file=$(side).files[0];
const img=$(side+'Img');

if(img.dataset.url){
URL.revokeObjectURL(img.dataset.url);
}

if(file){
img.dataset.url=URL.createObjectURL(file);
img.src=img.dataset.url;
img.style.display='block';
}
}

function canvasFor(file){
return new Promise((resolve,reject)=>{
const img=new Image();
const url=URL.createObjectURL(file);

img.onload=()=>{
const scale=Math.min(
2.4,
3000/img.width,
4000/img.height
);

const c=document.createElement('canvas');
c.width=Math.max(1,Math.round(img.width*scale));
c.height=Math.max(1,Math.round(img.height*scale));

c.getContext('2d').drawImage(
img,0,0,c.width,c.height
);

URL.revokeObjectURL(url);
resolve(c);
};

img.onerror=()=>{
URL.revokeObjectURL(url);
reject(Error('사진을 열 수 없습니다.'));
};

img.src=url;
});
}

function crop(c,y,h){
const o=document.createElement('canvas');
o.width=c.width;
o.height=Math.round(c.height*h);

o.getContext('2d').drawImage(
c,
0,c.height*y,
c.width,c.height*h,
0,0,o.width,o.height
);

return o;
}

async function analyze(){
if(busy)return;

const f=$('front').files[0];
const b=$('back').files[0];

if(!f||!b){
$('progress').textContent=
'앞면과 뒷면 사진을 모두 선택해 주세요.';
return;
}

if(!window.Tesseract){
$('progress').textContent=
'OCR 라이브러리 로드 실패. 인터넷 연결을 확인하세요.';
return;
}

busy=true;
$('run').disabled=true;
let worker;

try{
$('progress').textContent='한글 OCR 준비 중...';

worker=await Tesseract.createWorker(
'kor+eng',1,{
logger:m=>{
if(m.status==='recognizing text'){
$('progress').textContent=
'인식 중 '+Math.round((m.progress||0)*100)+'%';
}
}
}
);

const fc=await canvasFor(f);
$('progress').textContent='앞면 인식 중...';

const fAll=(await worker.recognize(fc)).data.text;
const fTop=(await worker.recognize(
crop(fc,.01,.36)
)).data.text;

frontText=fAll+'\n'+fTop;

const bc=await canvasFor(b);
$('progress').textContent='뒷면 인식 중...';

const bAll=(await worker.recognize(bc)).data.text;
const bBottom=(await worker.recognize(
crop(bc,.42,.48)
)).data.text;

backText=bAll+'\n'+bBottom;
manualDate='';

$('dateEdit').value='';
$('frontOcr').value=frontText;
$('backOcr').value=backText;

result=parse();
render();

$('progress').textContent=
'분석 완료. 원본과 비교하여 확인하세요.';

$('result').scrollIntoView({
behavior:'smooth'
});

}catch(e){
$('progress').textContent='분석 오류: '+e.message;
}finally{
if(worker){
await worker.terminate().catch(()=>{});
}
busy=false;
$('run').disabled=false;
}
}

function apply(){
const raw=$('dateEdit').value.trim();

if(raw){
const ds=dates(raw);

if(
ds.length!==1 ||
ds[0]!==raw.replace(/[\/-]/g,'.')
){
$('progress').textContent=
'날짜는 원본 확인 후 YYYY.MM.DD로 입력해 주세요.';
return;
}

manualDate=ds[0];
}else{
manualDate='';
}

frontText=$('frontOcr').value;
backText=$('backOcr').value;

result=parse();
render();

$('progress').textContent=
'수정 내용 적용 완료. 원본과 대조하세요.';
}

$('lang').addEventListener('change',render);

$('front').addEventListener('change',()=>{
preview('front');
});

$('back').addEventListener('change',()=>{
preview('back');
});

$('run').addEventListener('click',analyze);
$('apply').addEventListener('click',apply);
</script>
</body>
</html>
