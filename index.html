function lang(){
  return I18N[$("language").value] || I18N.ko;
}

function cleanText(s){
  return String(s || "")
    .replace(/\r/g,"")
    .replace(/[｜│┃]/g,"|")
    .replace(/[〈《]/g,"<")
    .replace(/[〉》]/g,">")
    .replace(/[ \t]+/g," ")
    .trim();
}

function compact(s){
  return cleanText(s)
    .replace(/\s+/g,"")
    .replace(/[|()[\]{}.,:;·'"]/g,"")
    .toLowerCase();
}

function safeOCR(s){
  return String(s || "")
    .split(/\n/)
    .map(line=>{
      if(/차\s*대\s*번\s*호|소\s*유\s*자\s*명|소\s*유\s*자/i.test(line)){
        return "[개인정보 포함 행 비공개]";
      }
      return line
        .replace(/\b[A-HJ-NPR-Z0-9]{17}\b/gi,"[차대번호 비공개]")
        .replace(/\b[A-HJ-NPR-Z0-9*]{12,22}\b/gi,"[식별번호 비공개]");
    })
    .join("\n");
}

function validDate(y,m,d){
  y=Number(y);m=Number(m);d=Number(d);
  if(y<2000 || y>2100 || m<1 || m>12 || d<1 || d>31){
    return false;
  }
  const z=new Date(Date.UTC(y,m-1,d));
  return z.getUTCFullYear()===y &&
         z.getUTCMonth()===m-1 &&
         z.getUTCDate()===d;
}

function formatDate(y,m,d){
  if(!validDate(y,m,d))return null;
  return `${y}.${String(m).padStart(2,"0")}.${String(d).padStart(2,"0")}`;
}

function datesInText(s){
  const found=[];
  const text=String(s||"")
    .replace(/[OoＯ]/g,"0")
    .replace(/[lI|]/g,"1")
    .replace(/뭘/g,"월")
    .replace(/변/g,"년")
    .replace(/밀/g,"일");

  const re=/(20\d{2})\s*(?:년|[.\/-])\s*(\d{1,2})\s*(?:월|[.\/-])\s*(\d{1,2})\s*(?:일)?/g;

  let m;
  while((m=re.exec(text))){
    const date=formatDate(m[1],m[2],m[3]);
    if(date)found.push({date,index:m.index});
  }
  return found;
}

function readTSV(tsv){
  if(!tsv)return [];
  const rows=tsv.split(/\r?\n/);
  if(rows.length<2)return [];

  const headers=rows[0].split("\t");
  const ix=name=>headers.indexOf(name);

  const out=[];
  for(let i=1;i<rows.length;i++){
    const c=rows[i].split("\t");
    if(c.length<headers.length)continue;
    if(Number(c[ix("level")])!==5)continue;

    const text=c[ix("text")]||"";
    if(!text.trim())continue;

    out.push({
      text:text.trim(),
      x:Number(c[ix("left")])||0,
      y:Number(c[ix("top")])||0,
      w:Number(c[ix("width")])||0,
      h:Number(c[ix("height")])||0,
      conf:Number(c[ix("conf")])||0
    });
  }
  return out;
}

function groupWords(words){
  const ordered=[...words].sort((a,b)=>a.y-b.y||a.x-b.x);
  const lines=[];

  for(const w of ordered){
    const cy=w.y+w.h/2;
    let target=null;
    let distance=Infinity;

    for(const line of lines){
      const tolerance=Math.max(10,Math.min(23,(line.h+w.h)*.55));
      const d=Math.abs(cy-line.cy);
      if(d<tolerance && d<distance){
        target=line;
        distance=d;
      }
    }

    if(!target){
      target={words:[],cy,h:w.h,y:w.y};
      lines.push(target);
    }

    target.words.push(w);
    target.cy=target.words.reduce(
      (a,v)=>a+v.y+v.h/2,0
    )/target.words.length;
    target.h=Math.max(target.h,w.h);
    target.y=Math.min(target.y,w.y);
  }

  return lines
    .sort((a,b)=>a.cy-b.cy)
    .map(line=>{
      line.words.sort((a,b)=>a.x-b.x);
      return {
        text:line.words.map(w=>w.text).join(" "),
        x:Math.min(...line.words.map(w=>w.x)),
        y:line.y,
        cy:line.cy,
        h:line.h,
        words:line.words
      };
    });
}

function makeCanvas(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w));
  c.height=Math.max(1,Math.round(h));
  return c;
}

async function loadImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{
      img.onload=resolve;
      img.onerror=reject;
      img.src=url;
    });
    return img;
  }finally{
    URL.revokeObjectURL(url);
  }
}

/*
  문서의 밝은 종이 영역을 탐색합니다.
  주변 배경이 흰색이거나 경계가 불명확하면
  이미지 전체를 유지합니다.
*/
function detectPaperBounds(img){
  const sw=240;
  const sh=Math.round(sw*img.naturalHeight/img.naturalWidth);
  const c=makeCanvas(sw,sh);
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(img,0,0,sw,sh);

  const p=ctx.getImageData(0,0,sw,sh).data;
  const samples=[];

  for(let y=Math.floor(sh*.10);y<sh*.92;y+=4){
    let bestStart=-1,bestEnd=-1;
    let runStart=-1;

    for(let x=0;x<=sw;x++){
      let light=false;

      if(x<sw){
        const k=(y*sw+x)*4;
        const r=p[k],g=p[k+1],b=p[k+2];
        const brightness=(r+g+b)/3;
        light=brightness>153 &&
              Math.max(r,g,b)-Math.min(r,g,b)<100;
      }

      if(light && runStart<0)runStart=x;

      if((!light||x===sw) && runStart>=0){
        if(x-runStart>bestEnd-bestStart){
          bestStart=runStart;
          bestEnd=x;
        }
        runStart=-1;
      }
    }

    if(bestEnd-bestStart>sw*.46){
      samples.push({y,left:bestStart,right:bestEnd});
    }
  }

  if(samples.length<sh/18)return null;

  const lefts=samples.map(v=>v.left).sort((a,b)=>a-b);
  const rights=samples.map(v=>v.right).sort((a,b)=>a-b);

  const left=lefts[Math.floor(lefts.length*.16)];
  const right=rights[Math.floor(rights.length*.84)];
  const top=samples[0].y;
  const bottom=samples[samples.length-1].y;

  if(right-left<sw*.50 || bottom-top<sh*.48)return null;

  return {
    x:Math.max(0,(left-8)/sw),
    y:Math.max(0,(top-14)/sh),
    w:Math.min(1,(right-left+16)/sw),
    h:Math.min(1,(bottom-top+28)/sh)
  };
}

function normalizePhoto(img){
  const bound=detectPaperBounds(img);
  const source=bound||{x:0,y:0,w:1,h:1};

  const sx=source.x*img.naturalWidth;
  const sy=source.y*img.naturalHeight;
  const sw=Math.min(
    img.naturalWidth-sx,
    source.w*img.naturalWidth
  );
  const sh=Math.min(
    img.naturalHeight-sy,
    source.h*img.naturalHeight
  );

  const outW=1600;
  const outH=Math.round(outW*sh/sw);
  const c=makeCanvas(outW,outH);

  const ctx=c.getContext("2d");
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,outW,outH);
  ctx.drawImage(img,sx,sy,sw,sh,0,0,outW,outH);

  return c;
}

function cropCanvas(base,rect,scale=1.7,mode="contrast"){
  const sx=Math.max(0,Math.floor(rect.x*base.width));
  const sy=Math.max(0,Math.floor(rect.y*base.height));
  const sw=Math.min(
    base.width-sx,
    Math.ceil(rect.w*base.width)
  );
  const sh=Math.min(
    base.height-sy,
    Math.ceil(rect.h*base.height)
  );

  const c=makeCanvas(sw*scale,sh*scale);
  const ctx=c.getContext("2d",{willReadFrequently:true});

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(base,sx,sy,sw,sh,0,0,c.width,c.height);

  if(mode==="original")return c;

  const image=ctx.getImageData(0,0,c.width,c.height);
  const p=image.data;

  let sum=0;
  for(let i=0;i<p.length;i+=4){
    sum+=(p[i]*.299+p[i+1]*.587+p[i+2]*.114);
  }
  const mean=sum/(p.length/4);

  for(let i=0;i<p.length;i+=4){
    let v=p[i]*.299+p[i+1]*.587+p[i+2]*.114;

    if(mode==="binary"){
      const threshold=Math.max(115,Math.min(195,mean-19));
      v=v>threshold?255:0;
    }else{
      v=(v-mean)*1.75+mean+13;
      v=Math.max(0,Math.min(255,v));
    }

    p[i]=p[i+1]=p[i+2]=v;
  }

  ctx.putImageData(image,0,0);
  return c;
}

async function getWorker(){
  if(worker)return worker;

  worker=await Tesseract.createWorker("kor+eng",1,{
    logger:m=>{
      if(m.status==="recognizing text"){
        const percent=Math.round((m.progress||0)*100);
        $("progress").textContent=
          `OCR 분석 중... ${percent}%`;
      }
    }
  });

  await worker.setParameters({
    preserve_interword_spaces:"1",
    tessedit_pageseg_mode:"3"
  });

  return worker;
}

async function OCR(canvas,psm=3){
  const w=await getWorker();

  await w.setParameters({
    tessedit_pageseg_mode:String(psm)
  });

  const result=await w.recognize(
    canvas,
    {},
    {tsv:true}
  );

  const data=result.data||{};

  return {
    text:cleanText(data.text),
    words:readTSV(data.tsv),
    width:canvas.width,
    height:canvas.height
  };
}

function linesFromOCR(result){
  if(result.words.length){
    return groupWords(result.words);
  }

  return result.text.split("\n").map((text,i)=>({
    text,
    x:0,
    y:i*30,
    cy:i*30+10,
    h:20
  }));
}

/*
  날짜 추출:
  - 앞면 상단 표에서만 추출
  - 재검사 대상이면 재검사 기간
  - 적합이면 다음 검사일
  - 다른 날짜를 대체하지 않음
  - 같은 날짜가 반복 인식되면 신뢰도 증가
*/
function dateCandidates(ocr,kind,region){
  const lines=linesFromOCR(ocr);
  const candidates=[];

  const label=kind==="fail"
    ?/재\s*검\s*사\s*(기\s*간|기\s*한)/
    :/다\s*음\s*검\s*사\s*일/;

  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const nearLabel=label.test(line.text);

    if(nearLabel){
      for(let j=Math.max(0,i-1);j<=Math.min(lines.length-1,i+1);j++){
        const found=datesInText(lines[j].text);
        for(const item of found){
          candidates.push({
            date:item.date,
            weight:j===i?4:2,
            source:"label"
          });
        }
      }
    }
  }

  /*
    날짜 전용 크롭:
    위치가 명확한 경우에만 날짜 단독 인식을 허용.
    전체 사진에서 발견된 임의 날짜는 사용하지 않습니다.
  */
  if(region==="deadline"){
    for(const line of lines){
      for(const item of datesInText(line.text)){
        candidates.push({
          date:item.date,
          weight:2,
          source:"deadline-crop"
        });
      }
    }
  }

  return candidates;
}

function chooseDate(allCandidates){
  const votes=new Map();

  for(const c of allCandidates){
    const old=votes.get(c.date)||{score:0,count:0};
    old.score+=c.weight;
    old.count++;
    votes.set(c.date,old);
  }

  const ranked=[...votes.entries()]
    .map(([date,v])=>({date,...v}))
    .sort((a,b)=>b.score-a.score);

  if(!ranked.length)return null;

  const first=ranked[0];
  const second=ranked[1];

  if(second && second.score>=first.score-1){
    return null;
  }

  if(first.score<3){
    return null;
  }

  return first.date;
}

function getDecision(backText){
  const s=compact(backText);

  if(/최종판정[:：]?부적합/.test(s))return "fail";
  if(/최종판정[:：]?적합/.test(s))return "pass";

  const lines=backText.split("\n");

  for(const line of lines){
    if(!/최종\s*판정/.test(line))continue;
    if(/부\s*적\s*합/.test(line))return "fail";
    if(/적\s*합/.test(line))return "pass";
  }

  return "unknown";
}

/*
  항목별 진단의견 판독

  중요:
  문서 전체에서 '양호'라는 글자를 찾지 않습니다.

  1. 앞면 진단의견 열을 분리
  2. 항목명이 있는 문장 우선
  3. 항목명이 깨진 경우 해당 열의 세로 위치 확인
  4. 양호/점검요를 다른 검사 항목으로 전파하지 않음
*/

const NAMED_OPINIONS={
  steering:[
    /조향계[통동].{0,15}(?:부분)?.{0,10}양호/,
    /조향.{0,8}부분.{0,8}양호/
  ],
  driving:[
    /주행계[통동].{0,15}(?:부분)?.{0,10}양호/,
    /주행.{0,8}부분.{0,8}양호/
  ],
  braking:[
    /제동계[통동].{0,15}(?:부분)?.{0,10}양호/,
    /제동.{0,8}부분.{0,8}양호/
  ],
  lighting:[
    /등화장치.{0,18}양호/,
    /등화장치.{0,18}점검요/
  ],
  emissions:[
    /배출가스.{0,22}(?:전체적으로)?.{0,10}양호/,
    /배출가스.{0,22}양호합니다/
  ],
  instruments:[
    /계기계[통동].{0,22}(?:전체적으로)?.{0,10}양호/,
    /계기.{0,12}전체적으로.{0,10}양호/
  ]
};

function detectNamedOpinion(s){
  const t=compact(s);

  for(const [key,patterns] of Object.entries(NAMED_OPINIONS)){
    for(const re of patterns){
      if(re.test(t)){
        const check=/점검요|불량|부적합/.test(t);
        return {key,status:check?"check":"good"};
      }
    }
  }

  return null;
}

function opinionLines(ocr,rect){
  return linesFromOCR(ocr)
    .filter(line=>line.text.trim())
    .map(line=>({
      text:line.text,
      y:rect.y+(line.cy/ocr.height)*rect.h,
      x:rect.x+(line.x/ocr.width)*rect.w
    }));
}

/*
  앞면 진단표의 일반적인 세로 배치

  표 머리글 아래:
  조향 → 주행 → 제동 → 등화 → 배출가스 → 계기

  표 전체의 시작·끝을 OCR로 찾고,
  해당 표 내부의 상대 위치를 사용합니다.
*/
const BANDS=[
  {key:"steering",from:0,to:.09},
  {key:"driving",from:.09,to:.19},
  {key:"braking",from:.19,to:.55},
  {key:"lighting",from:.55,to:.70},
  {key:"emissions",from:.70,to:.90},
  {key:"instruments",from:.90,to:1}
];

function locateTable(fullOCR){
  const lines=linesFromOCR(fullOCR);
  let top=null;
  let bottom=null;

  for(const line of lines){
    const s=compact(line.text);

    if(
      top===null &&
      /진단항목|안전진단기준|진단결과/.test(s) &&
      line.cy>fullOCR.height*.12 &&
      line.cy<fullOCR.height*.48
    ){
      top=line.cy/fullOCR.height;
    }

    if(
      /다음장에계속|측정값은종합검사/.test(s) &&
      line.cy>fullOCR.height*.65
    ){
      bottom=line.cy/fullOCR.height;
    }
  }

  return {
    top:top!==null?top:.20,
    bottom:bottom!==null?bottom:.94
  };
}

function bandForY(y,table){
  const fraction=(y-table.top)/(table.bottom-table.top);

  if(fraction<0 || fraction>1)return null;

  for(const band of BANDS){
    /*
      경계에 너무 가까운 문장은
      옆 항목으로 잘못 배정하지 않습니다.
    */
    if(
      fraction>band.from+.012 &&
      fraction<band.to-.012
    ){
      return band.key;
    }
  }

  return null;
}

function opinionStatus(text){
  const s=compact(text);

  if(/점검요|불량|부적합/.test(s))return "check";

  if(
    /부분양호/.test(s) ||
    /전체적으로양호/.test(s) ||
    /양호합니다/.test(s)
  ){
    return "good";
  }

  return null;
}

function parseFrontOpinions(fullOCR,opinionOCRs){
  const states=Object.fromEntries(
    CATEGORY_KEYS.map(k=>[k,"unknown"])
  );

  const table=locateTable(fullOCR);
  const observations=[];

  for(const entry of opinionOCRs){
    const lines=opinionLines(entry.ocr,entry.rect);

    for(let i=0;i<lines.length;i++){
      const current=lines[i];

      const next=lines[i+1];
      const joined=next &&
        Math.abs(next.y-current.y)<.022
        ?current.text+" "+next.text
        :current.text;

      observations.push({
        text:current.text,
        joined,
        y:current.y
      });
    }
  }

  const votes={};
  for(const key of CATEGORY_KEYS)votes[key]=[];

  /*
    1순위: 항목명이 명시된 진단의견
  */
  for(const item of observations){
    const named=detectNamedOpinion(item.joined);

    if(named){
      votes[named.key].push({
        status:named.status,
        weight:5,
        reason:"named-opinion"
      });
    }
  }

  /*
    2순위: 오른쪽 진단의견 열 + 세로 위치

    일반적인 '양호' 단독 문장은 사용하지 않습니다.
    '부분 양호', '전체적으로 양호'처럼
    진단의견 문장임이 드러나는 경우만 사용합니다.
  */
  for(const item of observations){
    if(detectNamedOpinion(item.joined))continue;

    const status=opinionStatus(item.joined);
    if(!status)continue;

    const key=bandForY(item.y,table);
    if(!key)continue;

    votes[key].push({
      status,
      weight:2,
      reason:"opinion-column-position"
    });
  }

  /*
    3순위: 표의 진단결과 열에서
    등화장치 '점검요' 확인.

    등화장치 영역의 점검요만 사용하며,
    다른 항목에 적용하지 않습니다.
  */
  const fullLines=linesFromOCR(fullOCR);

  for(const line of fullLines){
    const y=line.cy/fullOCR.height;
    const key=bandForY(y,table);

    if(key!=="lighting")continue;

    const s=compact(line.text);

    if(/점검요/.test(s)){
      /*
        표의 좌측 '검사기준'이 아니라
        진단결과 쪽에서 인식된 경우에만 적용
      */
      const rightWords=line.words
        ?line.words.filter(w=>w.x/fullOCR.width>.48)
        :[];

      if(
        rightWords.some(w=>/점검요/.test(w.text))
      ){
        votes.lighting.push({
          status:"check",
          weight:4,
          reason:"lighting-result-cell"
        });
      }
    }
  }

  for(const key of CATEGORY_KEYS){
    const list=votes[key];

    if(!list.length)continue;

    const good=list
      .filter(v=>v.status==="good")
      .reduce((a,v)=>a+v.weight,0);

    const check=list
      .filter(v=>v.status==="check")
      .reduce((a,v)=>a+v.weight,0);

    if(check>good && check>=2){
      states[key]="check";
    }else if(good>check && good>=2){
      states[key]="good";
    }
  }

  return {states,observations,table};
}

/*
  뒷면 전자제어 센서:
  '고객님 차량의 전자제어 센서 진단결과는 정상입니다.'
  와 같이 센서 진단임이 확인되는 문장만 인정합니다.
*/
function parseSensor(backTexts){
  for(const raw of backTexts){
    const s=compact(raw);

    if(
      /전자제어센서.{0,20}진단결과.{0,12}정상/.test(s) ||
      /차량의전자제어센서진단결과는정상/.test(s) ||
      /센서진단결과는정상/.test(s)
    ){
      return "good";
    }

    if(
      /전자제어센서.{0,20}진단결과.{0,12}(이상|불량)/.test(s)
    ){
      return "check";
    }
  }

  return "unknown";
}

/*
  부적합 사유:
  반드시 <부적합>와 <종합의견> 사이를 우선합니다.
  종합의견의 설명 문장은 부적합 목록에 넣지 않습니다.
*/

function normalizeFault(s){
  return cleanText(s)
    .replace(/^[\s|,.;:]+/,"")
    .replace(/[\s|,.;:]+$/,"")
    .replace(/등하장치/g,"등화장치")
    .replace(/물품적\s*재장치/g,"물품적재장치")
    .replace(/임의\s*변경/g,"임의변경")
    .replace(/임의\s*설치/g,"임의 설치")
    .replace(/\[\s*/g,"[")
    .replace(/\s*\]/g,"]");
}

function extractFaultBlock(text){
  const s=cleanText(text);

  const startMatch=/<\s*부\s*적\s*합\s*>/.exec(s);
  if(!startMatch)return "";

  const start=startMatch.index+startMatch[0].length;
  let tail=s.slice(start);

  const end=/<\s*종\s*합\s*의\s*견\s*>/.exec(tail);
  if(end)tail=tail.slice(0,end.index);

  return tail.slice(0,1200);
}

function splitFaults(block){
  if(!block)return [];

  let s=block
    .replace(/\r/g,"")
    .replace(/\n/g," ")
    .replace(/\s+/g," ")
    .trim();

  /*
    '기타 [ ... ]' 안의 쉼표는 분리하지 않음
  */
  const parts=[];
  let buf="";
  let depth=0;

  for(const ch of s){
    if(ch==="[")depth++;
    if(ch==="]")depth=Math.max(0,depth-1);

    if((ch===","||ch==="，") && depth===0){
      parts.push(buf);
      buf="";
    }else{
      buf+=ch;
    }
  }

  if(buf.trim())parts.push(buf);

  return parts
    .map(normalizeFault)
    .filter(s=>s.length>=4 && s.length<100)
    .filter(s=>!/종합의견|자동차관리법|재검사하시기/.test(s));
}

function faultQuality(fault){
  let score=0;

  if(/등화장치|물품적재장치|기타\s*\[|번호등/.test(fault)){
    score+=3;
  }

  if(/임의변경|임의 설치|점등작동상태|LED/.test(fault)){
    score+=2;
  }

  if(/[가-힣]/.test(fault))score++;

  if(/[A-Za-z]{5,}/.test(fault))score-=2;

  if(/[\[\]]/.test(fault)){
    if(!/\[[^\]]+\]/.test(fault))score-=3;
  }

  return score;
}

function parseFaults(backOCRs){
  const blocks=[];

  for(const ocr of backOCRs){
    const block=extractFaultBlock(ocr.text);
    if(block){
      const faults=splitFaults(block);

      blocks.push({
        faults,
        score:faults.reduce(
          (a,v)=>a+faultQuality(v),0
        )
      });
    }
  }

  blocks.sort((a,b)=>b.score-a.score);

  const selected=blocks[0]?.faults||[];
  const output=[];

  for(const f of selected){
    if(!output.some(v=>compact(v)===compact(f))){
      output.push(f);
    }
  }

  /*
    다른 OCR 결과에서 같은 위치의 글자가 더 선명하게
    인식되었을 때에만 교체합니다.
    새로운 부적합 사유를 임의로 추가하지 않습니다.
  */
  for(let i=0;i<output.length;i++){
    for(const block of blocks.slice(1)){
      const alternative=block.faults[i];

      if(!alternative)continue;

      if(
        faultQuality(alternative)>faultQuality(output[i])+1 &&
        sameFaultType(output[i],alternative)
      ){
        output[i]=alternative;
      }
    }
  }

  return output;
}

function sameFaultType(a,b){
  const types=[
    /등화장치/,
    /물품적재장치/,
    /안개등/,
    /활어운반장치/,
    /번호등/
  ];

  return types.some(re=>re.test(a)&&re.test(b));
}

function translateFault(original,language){
  const s=compact(original);
  const translations=I18N[language].faultTranslations;

  if(/등화장치임의변경/.test(s)){
    return translations[0];
  }

  if(/물품적재장치임의변경/.test(s)){
    return translations[1];
  }

  if(
    /기타\[안개등led\]/i.test(s) ||
    /안개등led/i.test(s)
  ){
    return translations[2];
  }

  if(/활어운반장치임의설치/.test(s)){
    return translations[3];
  }

  if(/번호등점등작동상태/.test(s)){
    return translations[4];
  }

  /*
    알 수 없는 OCR 문구는
    추측 번역하지 않습니다.
  */
  return null;
}

/*
  기본정보 판독:
  개인정보는 추출하지 않습니다.
  OCR에서 확인되는 값만 표시합니다.
*/

function matchDateNearLabel(text,re){
  const lines=text.split("\n");

  for(let i=0;i<lines.length;i++){
    if(!re.test(compact(lines[i])))continue;

    const current=lines[i];
    const next=lines[i+1]||"";

    const found=datesInText(current);

    if(found.length)return found[0].date;

    /*
      바로 다음 줄에 날짜만 있는 경우
    */
    if(next.length<65){
      const n=datesInText(next);
      if(n.length)return n[0].date;
    }
  }

  return null;
}

function extractPlate(text){
  const candidates=[];

  const re=/\b(\d{2,3})\s*([가-힣])\s*(\d{4})\b/g;
  let m;

  while((m=re.exec(text))){
    candidates.push(m[1]+m[2]+m[3]);
  }

  return candidates.length===1?candidates[0]:null;
}

function extractMileage(text){
  const lines=text.split("\n");

  for(let i=0;i<lines.length;i++){
    const line=lines[i];

    if(!/주행\s*거리/.test(line))continue;

    const m=/(?:주행\s*거리.{0,35})?(\d{1,3}(?:,\d{3})+|\d{4,6})\s*km/i.exec(line);

    if(m)return m[1].replace(/,/g,"")*1+" km";

    const next=lines[i+1]||"";
    const n=/(\d{1,3}(?:,\d{3})+|\d{4,6})\s*km/i.exec(next);

    if(n)return Number(n[1].replace(/,/g,""))+" km";
  }

  return null;
}

function extractModel(text){
  const lines=text.split("\n");

  for(const line of lines){
    const m=/차\s*명\s*[:：|]?\s*([가-힣A-Za-z0-9ⅡⅢIVX() -]{2,35})/.exec(line);

    if(!m)continue;

    let value=m[1]
      .split(/최초|등록|주행|차대|소유|원동기/)[0]
      .trim();

    if(value.length>=2 && value.length<=25){
      return value;
    }
  }

  return null;
}

function extractBasic(frontText,topText,decision,date){
  const source=topText+"\n"+frontText;

  const inspectionDate=matchDateNearLabel(
    source,
    /검사일자/
  );

  const firstRegistration=matchDateNearLabel(
    source,
    /최초등록일/
  );

  let nextInspection=null;
  let reinspection=null;

  if(decision==="fail"){
    nextInspection="reinspectionRequired";
    reinspection=date;
  }else if(decision==="pass"){
    nextInspection=date;
  }

  return {
    inspectionDate,
    registration:extractPlate(topText)||extractPlate(frontText),
    model:extractModel(topText)||extractModel(frontText),
    firstRegistration,
    nextInspection,
    reinspection,
    mileage:extractMileage(topText)||extractMileage(frontText)
  };
}

function appendText(parent,tag,text,className){
  const el=document.createElement(tag);
  if(className)el.className=className;
  el.textContent=text;
  parent.appendChild(el);
  return el;
}

function render(){
  if(!currentResult)return;

  const t=lang();
  const r=currentResult;
  const language=$("language").value;

  $("output").classList.remove("hidden");

  const decisionBox=$("decisionBox");
  decisionBox.className="resultBox "+r.decision;

  $("decisionTitle").textContent=
    r.decision==="fail"?t.fail:
    r.decision==="pass"?t.pass:
    t.unknownDecision;

  $("decisionSub").textContent=
    r.decision==="fail"?t.failSub:
    r.decision==="pass"?t.passSub:"";

  $("dateLabel").textContent=
    r.decision==="fail"?t.deadline:t.nextDate;

  $("dateValue").textContent=r.date||t.verify;

  $("infoHeading").textContent="▤ "+t.info;
  $("itemsHeading").textContent="☑ "+t.items;
  $("faultHeading").textContent="⚠ "+t.faults;

  $("privacyNotice").textContent=t.privacy;
  $("itemsNotice").textContent=t.itemsNote;
  $("faultNotice").textContent=t.faultNote;
  $("ocrWarning").textContent=t.warning;

  const info=$("infoRows");
  info.replaceChildren();

  const fields=[
    "inspectionDate",
    "registration",
    "model",
    "firstRegistration",
    "nextInspection",
    "reinspection",
    "mileage"
  ];

  for(const key of fields){
    const row=document.createElement("div");
    row.className="infoRow";

    appendText(row,"div",t[key],"infoKey");

    let value=r.basic[key];

    if(value==="reinspectionRequired"){
      value=t.reinspectionRequired;
    }

    const valueEl=appendText(
      row,
      "div",
      value||t.verify,
      "infoValue"+(!value?" uncertain":"")
    );

    if(key==="reinspection" && r.decision==="fail"){
      valueEl.style.color=r.date?"#a02028":"#786d5b";
    }

    info.appendChild(row);
  }

  const items=$("inspectionRows");
  items.replaceChildren();

  CATEGORY_KEYS.forEach((key,i)=>{
    const row=document.createElement("div");
    row.className="inspectionRow";

    appendText(row,"div",t.names[i],"inspectionName");

    const status=r.states[key];

    const label=status==="good"?t.good:
                status==="check"?t.check:t.unknown;

    appendText(row,"div",label,"status "+status);

    items.appendChild(row);
  });

  const faults=$("faultRows");
  faults.replaceChildren();

  if(!r.faults.length){
    appendText(
      faults,
      "p",
      r.decision==="pass"?t.noFaultPass:t.noFault,
      "notice"
    );
  }else{
    for(const original of r.faults){
      const card=document.createElement("div");
      card.className="fault";

      const translated=translateFault(original,language);

      appendText(
        card,
        "div",
        translated || (
          language==="ko"
          ?original
          :t.verify
        ),
        "faultMain"
      );

      if(language!=="ko"){
        appendText(
          card,
          "div",
          original,
          "faultOriginal"
        );
      }

      faults.appendChild(card);
    }
  }

  $("frontOCR").value=safeOCR(r.raw.front);
  $("backOCR").value=safeOCR(r.raw.back);
  $("opinionOCR").value=safeOCR(r.raw.opinions);
  $("dateOCR").value=safeOCR(r.raw.dates);
}

/*
  실행 절차

  앞면:
  A. 전체 OCR
  B. 기본정보 영역 OCR
  C. 재검사 기간 영역 OCR (원본/고대비)
  D. 진단의견 오른쪽 열 OCR (원본/고대비)
  E. 등화장치 진단결과 영역 OCR

  뒷면:
  F. 전체 OCR
  G. 전자제어 센서 진단의견 OCR
  H. 부적합 영역 OCR

  고객이 추가 확대 사진을 업로드할 필요가 없습니다.
*/

async function analyze(){
  const frontFile=$("front").files[0];
  const backFile=$("back").files[0];

  if(!frontFile||!backFile){
    alert("앞면과 뒷면 사진을 모두 선택해주세요.");
    return;
  }

  $("analyze").disabled=true;
  $("output").classList.add("hidden");

  try{
    $("progress").textContent="사진을 준비하고 있습니다...";

    const [frontImg,backImg]=await Promise.all([
      loadImage(frontFile),
      loadImage(backFile)
    ]);

    const front=normalizePhoto(frontImg);
    const back=normalizePhoto(backImg);

    $("progress").textContent="앞면 전체 판독 중...";
    const frontFull=await OCR(front,3);

    $("progress").textContent="뒷면 전체 판독 중...";
    const backFull=await OCR(back,3);

    /*
      앞면 상단 기본정보 영역
    */
    const topRect={x:.06,y:.08,w:.90,h:.28};

    const frontTop=await OCR(
      cropCanvas(front,topRect,1.6,"contrast"),
      6
    );

    /*
      재검사 기간:
      상단 표의 중앙~오른쪽 영역을 반복 판독
    */
    const dateRect={
      x:.37,
      y:.135,
      w:.48,
      h:.18
    };

    const dateOriginal=await OCR(
      cropCanvas(front,dateRect,2.2,"original"),
      6
    );

    const dateContrast=await OCR(
      cropCanvas(front,dateRect,2.5,"contrast"),
      6
    );

    /*
      진단의견 열:
      사진의 오른쪽 표 열을 내부적으로 확대
    */
    $("progress").textContent="진단의견 열을 분석 중...";

    const opinionRect={
      x:.67,
      y:.19,
      w:.27,
      h:.77
    };

    const opinionWideRect={
      x:.59,
      y:.19,
      w:.36,
      h:.77
    };

    const opinionOriginal=await OCR(
      cropCanvas(front,opinionRect,1.8,"original"),
      6
    );

    const opinionContrast=await OCR(
      cropCanvas(front,opinionWideRect,1.8,"contrast"),
      6
    );

    /*
      등화장치:
      진단결과 '점검요' 보조 판독
    */
    const lightingRect={
      x:.48,
      y:.56,
      w:.43,
      h:.19
    };

    const lightingOCR=await OCR(
      cropCanvas(front,lightingRect,1.8,"contrast"),
      6
    );

    /*
      뒷면 전자제어 센서 진단의견
    */
    $("progress").textContent="뒷면 센서 진단을 분석 중...";

    const sensorRect={
      x:.43,
      y:.18,
      w:.48,
      h:.26
    };

    const sensorOCR=await OCR(
      cropCanvas(back,sensorRect,1.8,"contrast"),
      6
    );

    /*
      뒷면 종합진단 / 부적합 영역
    */
    $("progress").textContent="부적합 사유를 분석 중...";

    const faultRect={
      x:.12,
      y:.45,
      w:.79,
      h:.37
    };

    const faultOCR=await OCR(
      cropCanvas(back,faultRect,1.7,"contrast"),
      6
    );

    const decision=getDecision(
      backFull.text+"\n"+faultOCR.text
    );

    /*
      날짜 후보:
      재검사 대상인 경우 재검사 기간만,
      적합인 경우 다음 검사일만 채택
    */
    let date=null;

    if(decision==="fail"||decision==="pass"){
      const candidates=[
        ...dateCandidates(frontFull,decision,"full"),
        ...dateCandidates(frontTop,decision,"top")
      ];

      /*
        날짜 전용 크롭은 재검사 기간 표의 위치가
        확인되는 경우에만 독립 후보로 사용합니다.
      */
      if(decision==="fail"){
        candidates.push(
          ...dateCandidates(
            dateOriginal,
            decision,
            "deadline"
          ),
          ...dateCandidates(
            dateContrast,
            decision,
            "deadline"
          )
        );
      }

      date=chooseDate(candidates);
    }

    const opinionResult=parseFrontOpinions(
      frontFull,
      [
        {ocr:opinionOriginal,rect:opinionRect},
        {ocr:opinionContrast,rect:opinionWideRect}
      ]
    );

    const states=opinionResult.states;

    /*
      등화장치 보조 판독:
      명시적으로 점검요가 확인된 경우만 적용
    */
    if(states.lighting==="unknown"){
      const lightingText=compact(lightingOCR.text);

      if(/점검요/.test(lightingText)){
        states.lighting="check";
      }
    }

    /*
      센서는 뒷면 진단의견 문장만 기준
    */
    states.sensors=parseSensor([
      backFull.text,
      sensorOCR.text
    ]);

    const faults=parseFaults([
      backFull,
      faultOCR
    ]);

    const basic=extractBasic(
      frontFull.text,
      frontTop.text,
      decision,
      date
    );

    currentResult={
      decision,
      date,
      basic,
      states,
      faults,
      raw:{
        front:frontFull.text+"\n\n=== 기본정보 ===\n"+frontTop.text,
        back:backFull.text+"\n\n=== 부적합 영역 ===\n"+faultOCR.text,
        opinions:
          "=== 진단의견 원본 ===\n"+
          opinionOriginal.text+
          "\n\n=== 진단의견 고대비 ===\n"+
          opinionContrast.text+
          "\n\n=== 등화장치 ===\n"+
          lightingOCR.text+
          "\n\n=== 센서 진단의견 ===\n"+
          sensorOCR.text,
        dates:
          "=== 기본정보 ===\n"+
          frontTop.text+
          "\n\n=== 날짜 원본 ===\n"+
          dateOriginal.text+
          "\n\n=== 날짜 고대비 ===\n"+
          dateContrast.text
      }
    };

    render();

    $("progress").textContent=
      "분석이 완료되었습니다. 판독 불가 항목은 원본을 확인해주세요.";

    $("output").scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }catch(err){
    console.error(err);
    $("progress").textContent=
      "분석 중 오류가 발생했습니다. 사진을 다시 확인해주세요.";
    alert("OCR 처리 오류: "+(err.message||String(err)));
  }finally{
    $("analyze").disabled=false;
  }
}

$("analyze").addEventListener("click",analyze);
$("language").addEventListener("change",render);

</script>
