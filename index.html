const categories=[
{
names:['조향계통','Steering System','转向系统','Hệ thống lái'],
head:/조향\s*계[통동]/,
anchors:[/앞바퀴\s*정렬/,/조향\s*계[통동]/]
},
{
names:['주행계통','Driving System','行驶系统','Hệ thống vận hành'],
head:/주행\s*계[통동]/,
anchors:[/차축.{0,5}타이어/,/변속기\s*작동/,/추진축/,/주행\s*계[통동]/]
},
{
names:['제동계통','Braking System','制动系统','Hệ thống phanh'],
head:/제동\s*계[통동]/,
anchors:[/전체\s*브레이크/,/앞축\s*무게/,/제동\s*계[통동]/]
},
{
names:['등화장치','Lighting','灯光装置','Hệ thống đèn'],
head:/등[화하]\s*장치/,
anchors:[/전조등/,/등[화하]\s*장치/,/광도\s*:/]
},
{
names:['배출가스','Emissions','尾气排放','Khí thải'],
head:/배출\s*가스/,
anchors:[/배출\s*가스/,/매연\s*농도/]
},
{
names:['계기계통','Instrument System','仪表系统','Hệ thống đồng hồ'],
head:/계기\s*계[통동]/,
anchors:[/계기\s*계[통동]/,/속도계\s*오차/]
},
{
names:[
'자가진단 센서 점검',
'Self-Diagnostic Sensor Check',
'自诊断传感器检查',
'Kiểm tra cảm biến tự chẩn đoán'
],
head:/전자\s*제어\s*센서|자[가기]\s*진단\s*센서/
}
];

const dict=[
[
/^등화장치임의변경$/,
[
'등화장치 임의변경',
'Unauthorized modification of lighting equipment',
'擅自改装灯光装置',

]
],
[

[

'Unauthorized modification of cargo-loading equipment',
'擅自改装载货装置',
'Tự ý thay đổi thiết bị chở hàng'
]
],
[
/^활어운반장치임의설치$/,
[
'활어운반장치 임의 설치',
'Unauthorized installation of live-fish transport equipment',
'擅自安装活鱼运输装置',
'Tự ý lắp đặt thiết bị vận chuyển cá sống'
]
],
[
/^안개등LED$/i,
[
'안개등 LED',
'Fog lamp LED',
'雾灯 LED',
'Đèn sương mù LED'
]
],
[
/^안개등임의변경$/,
[
'안개등 임의변경',
'Unauthorized modification of fog lamps',
'擅自改装雾灯',
'Tự ý thay đổi đèn sương mù'
]
]
];

const compact=s=>String(s||'')
.replace(/[\s<>〈〉\[\](){}|:：,，.·\-]/g,'');

const correctMinor=s=>String(s||'')
.replace(/등하\s*장치/g,'등화장치')
.replace(/룰품\s*적재/g,'물품적재');

function validDate(y,m,d){
y=+y;m=+m;d=+d;
const x=new Date(y,m-1,d);
return x.getFullYear()===y &&
x.getMonth()===m-1 &&
x.getDate()===d
?`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`
:null;
}

function strictDates(text){
const a=[];
const re=/(20\d{2})\s*(?:년|[.\/-])\s*(\d{1,2})\s*(?:월|[.\/-])\s*(\d{1,2})\s*일?/g;
for(const m of String(text).matchAll(re)){
const d=validDate(m[1],m[2],m[3]);
if(d)a.push(d);
}
return [...new Set(a)];
}

function decision(front,back){
const a=[];
for(const s of [front,back]){
for(const line of s.split(/\r?\n/)){
const m=line.match(
/최종\s*판정\s*[:：]?\s*(부\s*적\s*합|적\s*합|불합격|합격)/
);
if(m){
a.push(
/부\s*적\s*합|불합격/.test(m[1])
?'fail':'pass'
);
}
}
}
return new Set(a).size===1?a[0]:'unknown';
}

function dateCandidates(text,status,focused=false){
if(status==='unknown')return [];

const lines=String(text||'').split(/\r?\n/);
const label=status==='fail'
?/재\s*검\s*사\s*(?:기\s*간|기\s*한)/
:/다\s*음\s*검\s*사\s*(?:일|날짜|기\s*간)/;

const found=[];

for(let i=0;i<lines.length;i++){
const line=lines[i];

if(label.test(line)){
const match=label.exec(line);
const part=line
.slice(match.index+match[0].length)
.split(
/최초\s*등록일|검사\s*일자|주행\s*거리|차\s*명|차대\s*번호/
)[0];

found.push(...strictDates(part));

if(!strictDates(part).length){
found.push(
...strictDates(
lines.slice(i+1,i+2).join(' ').slice(0,100)
)
);
}
}

if(focused&&status==='fail'&&/까\s*지/.test(line)){
const m=line.match(
/(20\d{2}\s*년\s*\d{1,2}\s*월\s*\d{1,2}\s*일?)\s*까\s*지/
);
if(m)found.push(...strictDates(m[1]));
}
}

return [...new Set(found)];
}

function parseDate(front,focused,status,manual,photo=''){
if(manual)return manual;

const extra=strictDates(photo);
const a=[...new Set([
...dateCandidates(front,status),
...dateCandidates(focused,status,true),
...(extra.length===1?extra:[])
])];

return a.length===1?a[0]:null;
}

function stopAtOpinion(s){
const re=/(?:[<〈\[]\s*종\s*합\s*의\s*견\s*[>〉\]]?|\n\s*\[\s*1\s*\]|\n\s*종합\s*진단|\n\s*진단결과|\n\s*자동차관리법|\n\s*해당\s*검사소)/;
return s.split(re)[0];
}

function splitFaultItems(s){
const a=[];
let cur='',depth=0;

for(const ch of s){
if(ch==='['||ch==='［'||ch==='(')depth++;

if(ch===']'||ch==='］'||ch===')'){
depth=Math.max(0,depth-1);
}

if(
(ch===','||ch==='，'||ch==='\n') &&
depth===0
){
if(cur.trim())a.push(cur.trim());
cur='';
}else{
cur+=ch;
}
}

if(cur.trim())a.push(cur.trim());
return a;
}

function cleanFault(s){
s=s.replace(/^[^가-힣\[]+/,'').trim();

if(/^기타\s*[\[［(（]/.test(s)){
const m=s.match(
/^(기타\s*[\[［(（][^\]\]）)\n]{2,65}[\]］)）])/
);
return m?m[1].trim():'';
}

return s
.replace(
/\s*(?:HAS|자동차관리법|해당\s*검사소|귀하의\s*자동차|등화장치가|차량\s*물품).*$/,
''
)
.replace(/[|;:：.]+$/,'')
.trim();
}

function plausibleFault(s){
if(s.length<4||s.length>80)return false;

if(
/검사소|자동차관리법|원상복구|조치를|하시기|진단결과|정비하여|과태료|고객님|튜닝|규제하는|합니다|바랍니다|결함이/.test(s)
)return false;

return /[가-힣]/.test(s) &&
/임의\s*(?:변경|설치)|^기타\s*[\[［(（]|불량|미달|파손|누유|초과|부식|부적합|손상|미점등|작동불량/.test(s);
}

function faultBlocks(back){
const lines=String(back||'').split(/\r?\n/);
const blocks=[];

for(let i=0;i<lines.length;i++){
const h=lines[i].match(
/[<〈\[]\s*부\s*적\s*합\s*[>〉\]]/
);

if(!h)continue;

let section=lines[i].slice(
h.index+h[0].length
);

for(let j=i+1;j<Math.min(i+5,lines.length);j++){
if(
/<\s*종합의견|[<〈\[]\s*종\s*합\s*의\s*견|\[\s*1\s*\]|최종\s*판정|진단결과\s*귀하/.test(lines[j])
)break;

section+='\n'+lines[j];

if(section.length>420)break;
}

section=stopAtOpinion(section);

const items=splitFaultItems(section)
.map(cleanFault)
.filter(plausibleFault);

if(items.length){
blocks.push(items.slice(0,12));
}
}

return blocks;
}

function faultScore(item){
const k=compact(correctMinor(item))
.replace(/^기타/,'');

if(dict.some(([re])=>re.test(k)))return 6;
if(/활어운반장치임의설치/.test(k))return 5;
if(/안개등/.test(k))return 4;
return 2;
}

function extractFaults(back){
const blocks=faultBlocks(back);
if(!blocks.length)return [];

blocks.sort((a,b)=>{
const score=x=>x.reduce(
(n,s)=>n+faultScore(s),0
)+x.length*2;

return score(b)-score(a);
});

const seen=new Set();

return blocks[0].filter(s=>{
const k=compact(correctMinor(s));
if(seen.has(k))return false;
seen.add(k);
return true;
}).slice(0,12);
}

function translateFault(raw){
let s=correctMinor(raw).trim()
.replace(/^기타\s*[\[［(（]\s*/,'')
.replace(/[\]］)）]\s*$/,'');

const key=compact(s);

for(const [re,t] of dict){
if(re.test(key))return t;
}

return null;
}

function faultExpectedCount(back){
const counts=[
...String(back).matchAll(
/(?:상기\s*[\(（]?\s*|\[)\s*([1-9])\s*[\)）]?\s*건/g
)
].map(m=>+m[1]);

return [...new Set(counts)].length===1
?counts[0]:null;
}

function wordData(tsv,region){
if(!tsv)return [];

const out=[];

for(const row of tsv.split(/\r?\n/).slice(1)){
const a=row.split('\t');
if(a.length<12||a[0]!=='5')continue;

const s=a.slice(11).join('\t').trim();
if(!s)continue;

const [x,y,w,h]=a.slice(6,10).map(Number);

if(
![x,y,w,h].every(Number.isFinite) ||
w<=0||h<=0
)continue;

out.push({
s,
x:region.x+(x+w/2)*region.w/region.pw,
y:region.y+(y+h/2)*region.h/region.ph,
group:a.slice(1,5).join('_')
});
}

return out;
}

function textLines(words){
const map=new Map();

for(const w of words){
if(!map.has(w.group)){
map.set(w.group,[]);
}
map.get(w.group).push(w);
}

return [...map.values()].map(ws=>{
ws.sort((a,b)=>a.x-b.x);

return {
text:ws.map(w=>w.s).join(' '),
y:ws.reduce((n,w)=>n+w.y,0)/ws.length,
ws
};
}).sort((a,b)=>a.y-b.y);
}

function wordStatus(words){
const s=words.map(w=>w.s)
.join(' ')
.replace(/\s+/g,'');

const need=/점검요|점검필요|불량|부적합/.test(s);
const good=/양호|정상|이상없음/.test(s);

return need&&!good?'need':
good&&!need?'good':'unread';
}

// 표의 항목 시작 위치를 찾고
// 해당 구역의 오른쪽 진단의견 열만 연결한다.
// 경계가 불명확하면 판독 불가로 유지한다.
function geometryStates(sets,w,h){
const votes=Array.from(
{length:6},()=>[]
);

for(const words of sets){
if(!words.length)continue;

const lines=textLines(words);
const starts=[];

for(let i=0;i<6;i++){
const matches=lines.filter(l=>
l.y>h*.16 &&
l.y<h*.94 &&
categories[i].anchors.some(re=>re.test(l.text))
);

starts.push(
matches.length?matches[0].y:null
);
}

for(let i=0;i<6;i++){
const y=starts[i];
if(y===null)continue;

const prev=starts.slice(0,i)
.filter(x=>x!==null);

const next=starts.slice(i+1)
.filter(x=>x!==null);

if(
prev.length &&
y<=Math.max(...prev)+h*.012
)continue;

if(
next.length &&
y>=Math.min(...next)-h*.012
)continue;

const upper=y-h*.008;

const lower=next.length
?Math.min(...next)-h*.008
:Math.min(h*.94,y+h*.16);

if(
lower-upper<h*.015 ||
lower-upper>h*.24
)continue;

const opinion=words.filter(v=>
v.x>w*.74 &&
v.y>=upper &&
v.y<lower
);

const state=wordStatus(opinion);

if(state!=='unread'){
votes[i].push(state);
}
}
}

return votes.map(a=>
a.length&&new Set(a).size===1
?a[0]:'unread'
);
}

function textStates(front){
const out=Array(6).fill('unread');

for(const line of front.split(/\r?\n/)){
for(let i=0;i<6;i++){
const m=categories[i].head.exec(line);
if(!m)continue;

const after=line
.slice(m.index+m[0].length)
.slice(0,85);

if(
/점\s*검\s*요|점검\s*필요|불\s*량/.test(after)
){
out[i]='need';
}else if(
/(?:부분\s*)?양\s*호|정\s*상/.test(after) &&
out[i]!=='need'
){
out[i]='good';
}
}

if(
/전체\s*브레이크.{0,95}부분\s*양\s*호/.test(line) &&
out[2]!=='need'
){
out[2]='good';
}
}

return out;
}

function states(front,back,faults,geo){
const t=textStates(front);

if(geo){
const g=geometryStates(
geo.sets,geo.w,geo.h
);

for(let i=0;i<6;i++){
if(g[i]!=='unread'){
t[i]=g[i];
}
}
}

t.push('unread');

if(
/전자\s*제어\s*센서[\s\S]{0,35}진단\s*결과[\s\S]{0,25}정\s*상|센서\s*진단\s*결과[\s\S]{0,25}정\s*상/.test(back)
){
t[6]='good';
}

for(const raw of faults){
const s=compact(correctMinor(raw));

if(/등화|안개등|전조등|제동등|방향지시등/.test(s)){
t[3]='need';
}

if(/조향|타이로드/.test(s)){
t[0]='need';
}

if(/브레이크|제동력/.test(s)){
t[2]='need';
}

if(/타이어|차축/.test(s)){
t[1]='need';
}

if(/배출가스|매연/.test(s)){
t[4]='need';
}

if(/계기계통|속도계/.test(s)){
t[5]='need';
}
}

return t;
}

let frontText='';
let backText='';
let focusedDate='';
let datePhotoText='';
let geometry=null;
let manualDate='';
let manualStates=Array(7).fill('auto');
let result=null;
let busy=false;

function parse(){
const status=decision(frontText,backText);
const faults=extractFaults(backText);
const s=states(frontText,backText,faults,geometry);

for(let i=0;i<7;i++){
if(manualStates[i]!=='auto'){
s[i]=manualStates[i];
}
}

return {
status,
date:parseDate(
frontText,
focusedDate,
status,
manualDate,
datePhotoText
),
faults,
states:s,
expected:faultExpectedCount(backText)
};
}

function make(tag,cls,txt){
const e=document.createElement(tag);
if(cls)e.className=cls;
if(txt!==undefined)e.textContent=txt;
return e;
}

function render(){
if(!result)return;

const lang=$('lang').value;
const idx=langs.indexOf(lang);
const t=T[lang];

$('resultTitle').textContent=t.title;
$('itemTitle').textContent=t.items;
$('findingTitle').textContent=t.findings;
$('itemHelp').textContent=t.help;
$('warn').textContent=t.warn;

const hero=make(
'div',
'hero '+(
result.status==='fail'?'fail':
result.status==='pass'?'pass':'unknown'
)
);

hero.append(make(
'strong','',
result.status==='fail'?t.fail:
result.status==='pass'?t.pass:t.unknown
));

if(result.status!=='unknown'){
hero.append(make(
'div','label',
result.status==='fail'?t.deadline:t.next
));

hero.append(make(
'div','date',
result.date||t.date
));
}

$('hero').replaceChildren(hero);
$('rows').replaceChildren();

result.states.forEach((state,i)=>{
const tr=make('tr');

tr.append(make(
'td','',
categories[i].names[idx]
));

tr.append(make(
'td',
state==='good'?'good':
state==='need'?'need':'unread',
state==='good'?t.good:
state==='need'?t.need:t.unread
));

$('rows').append(tr);
});

$('findings').replaceChildren();

for(const raw of result.faults){
const box=make('div','issue');
const translation=translateFault(raw);

box.append(make(
'div','translated',
translation?translation[idx]:t.verify
));

box.append(make(
'div','original',raw
));

$('findings').append(box);
}

if(!result.faults.length){
$('findings').append(make(
'p','unread',t.missing
));
}

$('faultWarning').textContent=
result.expected &&
result.faults.length!==result.expected
?t.partial+' ('+
result.faults.length+'/'+result.expected+')'
:'';

$('result').style.display='block';
}

function preview(id){
const file=$(id).files[0];
const img=$(id+'Img');

if(!img)return;

if(img.dataset.url){
URL.revokeObjectURL(img.dataset.url);
}

if(file){
img.dataset.url=URL.createObjectURL(file);
img.src=img.dataset.url;
img.style.display='block';
}
}

function loadCanvas(file){
return new Promise((resolve,reject)=>{
const img=new Image();
const url=URL.createObjectURL(file);

img.onload=()=>{
const scale=Math.min(
2.2,
3200/img.width,
4200/img.height
);

const c=document.createElement('canvas');

c.width=Math.max(
1,Math.round(img.width*scale)
);

c.height=Math.max(
1,Math.round(img.height*scale)
);

c.getContext('2d').drawImage(
img,0,0,c.width,c.height
);

URL.revokeObjectURL(url);
resolve(c);
};

img.onerror=()=>{
URL.revokeObjectURL(url);
reject(Error('사진을 열 수 없습니다.'));
};

img.src=url;
});
}

function crop(c,x,y,w,h,scale=1){
const o=document.createElement('canvas');

o.width=Math.max(
1,Math.round(c.width*w*scale)
);

o.height=Math.max(
1,Math.round(c.height*h*scale)
);

o.getContext('2d').drawImage(
c,
c.width*x,
c.height*y,
c.width*w,
c.height*h,
0,0,
o.width,
o.height
);

return {
canvas:o,
region:{
x:c.width*x,
y:c.height*y,
w:c.width*w,
h:c.height*h,
pw:o.width,
ph:o.height
}
};
}

function enhanced(c){
const o=document.createElement('canvas');
o.width=c.width;
o.height=c.height;

const ctx=o.getContext('2d');
ctx.filter='grayscale(1) contrast(1.8)';
ctx.drawImage(c,0,0);

return o;
}

async function run(){
if(busy)return;

const f=$('front').files[0];
const b=$('back').files[0];

if(!f||!b){
$('progress').textContent=
'앞면과 뒷면 사진을 모두 선택하세요.';
return;
}

if(!window.Tesseract){
$('progress').textContent=
'OCR를 불러오지 못했습니다. 인터넷을 확인하세요.';
return;
}

busy=true;
$('run').disabled=true;
let worker;

try{
$('progress').textContent=
'한글 OCR 준비 중...';

worker=await Tesseract.createWorker(
'kor+eng',1,{
logger:m=>{
if(m.status==='recognizing text'){
$('progress').textContent=
'문자 인식 중 '+
Math.round((m.progress||0)*100)+'%';
}
}
}
);

const fc=await loadCanvas(f);

$('progress').textContent=
'앞면 표 위치 분석 중...';

const all=await worker.recognize(
fc,{},{tsv:true}
);

const full={
x:0,y:0,
w:fc.width,h:fc.height,
pw:fc.width,ph:fc.height
};

const table=crop(
fc,0,.20,1,.76,1.35
);

const tbl=await worker.recognize(
table.canvas,{},{tsv:true}
);

frontText=
(all.data.text||'')+
'\n\n'+
(tbl.data.text||'');

geometry={
sets:[
wordData(all.data.tsv,full),
wordData(tbl.data.tsv,table.region)
],
w:fc.width,
h:fc.height
};

$('progress').textContent=
'날짜 부분 확대 인식 중...';

const d=crop(
fc,0,.09,1,.24,1.7
);

const dr=await worker.recognize(
d.canvas
);

focusedDate=dr.data.text||'';

if(
!dateCandidates(frontText,'fail').length &&
!dateCandidates(focusedDate,'fail',true).length
){
await worker.setParameters({
tessedit_pageseg_mode:'6'
});

const d2=await worker.recognize(
enhanced(d.canvas)
);

focusedDate+='\n'+(d2.data.text||'');

await worker.setParameters({
tessedit_pageseg_mode:'3'
});
}

datePhotoText='';

const extra=$('datePhoto').files[0];

if(extra){
$('progress').textContent=
'날짜 확대 사진 판독 중...';

const ec=await loadCanvas(extra);
const er=await worker.recognize(ec);

datePhotoText=er.data.text||'';
focusedDate+='\n'+datePhotoText;
}

const bc=await loadCanvas(b);

$('progress').textContent=
'뒷면 부적합 목록 판독 중...';

const br=await worker.recognize(bc);

const sub=crop(
bc,0,.42,1,.48,1.45
);

const bs=await worker.recognize(
sub.canvas
);

backText=
(br.data.text||'')+
'\n\n'+
(bs.data.text||'');

manualDate='';
manualStates=Array(7).fill('auto');
$('dateEdit').value='';

$('frontOcr').value=
frontText+
'\n\n[날짜 부분 재인식]\n'+
focusedDate;

$('backOcr').value=backText;

document.querySelectorAll('[data-manual]')
.forEach(e=>e.value='auto');

result=parse();
render();

$('progress').textContent=
'분석 완료. 원본과 비교하여 확인하세요.';

$('result').scrollIntoView({
behavior:'smooth'
});

}catch(e){
$('progress').textContent=
'분석 오류: '+e.message;
}finally{
if(worker){
await worker.terminate().catch(()=>{});
}
busy=false;
$('run').disabled=false;
}
}

function apply(){
const raw=$('dateEdit').value.trim();

if(raw){
if(
!/^20\d{2}\.\d{2}\.\d{2}$/.test(raw) ||
strictDates(raw)[0]!==raw
){
$('progress').textContent=
'날짜는 원본 확인 후 YYYY.MM.DD 형식으로 입력하세요.';
return;
}

manualDate=raw;
}else{
manualDate='';
}

frontText=$('frontOcr').value;
backText=$('backOcr').value;
focusedDate='';
datePhotoText='';
geometry=null;

document.querySelectorAll('[data-manual]')
.forEach(e=>{
manualStates[+e.dataset.manual]=e.value;
});

result=parse();
render();

$('progress').textContent=
'수정 내용 적용 완료. 원본과 대조하세요.';
}

for(let i=0;i<7;i++){
const row=make('div','edit-row');

row.append(make(
'span','',categories[i].names[0]
));

const select=make('select');
select.dataset.manual=i;

for(const [value,label] of [
['auto','자동 판독'],
['good','원본 확인: 양호'],
['need','원본 확인: 점검요'],
['unread','판독 불가']
]){
const o=make('option','',label);
o.value=value;
select.append(o);
}

row.append(select);
$('manualStates').append(row);
}

$('lang').addEventListener(
'change',render
);

$('front').addEventListener(
'change',()=>preview('front')
);

$('back').addEventListener(
'change',()=>preview('back')
);

$('run').addEventListener(
'click',run
);

$('apply').addEventListener(
'click',apply
);
</script>
