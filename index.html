
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자동차검사 다국어 안내</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f9;color:#19334e;font-family:Arial,'Malgun Gothic',sans-serif}
header{background:#15518e;color:#fff;text-align:center;padding:25px 12px}
h1{font-size:24px;margin:0 0 7px}
header p{margin:0;font-size:14px}
main{max-width:720px;margin:auto;padding:14px}
.card{background:white;border-radius:15px;margin-bottom:14px;padding:18px;box-shadow:0 2px 10px #0001}
h2{font-size:20px;margin:0 0 14px}
select,button{width:100%;border-radius:11px;padding:15px;font-size:18px}
select{background:#fff;border:1px solid #b7c8d9}
button{background:#145aa5;color:#fff;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
label.upload{display:block;background:#f1f7ff;border:2px dashed #91b3d8;border-radius:12px;padding:16px;margin:10px 0;font-size:17px;font-weight:bold}
input[type=file]{width:100%;display:block;margin-top:12px;font-size:15px}
img.preview{display:none;max-width:100%;max-height:170px;margin:10px auto}
.hint{font-size:14px;color:#536b82;line-height:1.7}
#progress{font-size:16px;font-weight:bold;color:#1259a3;white-space:pre-wrap;line-height:1.7}
#result{display:none}
.hero{text-align:center;padding:23px 12px;border-radius:13px;margin:10px 0}
.hero.fail{background:#ffe9e8;color:#a21919}
.hero.pass{background:#e2f7ea;color:#116c3d}
.hero.unknown{background:#fff1d4;color:#845c0d}
.hero b{font-size:39px;display:block}
.hero .date-label{font-size:20px;margin:12px 0 4px;font-weight:bold}
.hero .date{font-size:31px;font-weight:800;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%}
td{border-bottom:1px solid #e0e8f0;padding:15px 8px;font-size:19px}
td:first-child{font-weight:bold;width:50%}
.good{color:#147442;font-weight:bold}
.need{color:#ba2626;font-weight:bold}
.none{color:#718096}
.fault{border-left:5px solid #bd2525;background:#fff1f0;padding:15px;margin:11px 0;border-radius:8px}
.fault .translated{font-size:23px;font-weight:800;color:#a91818;line-height:1.5}
.fault .source{font-size:16px;margin-top:8px;color:#3b4f62;white-space:pre-wrap;line-height:1.7}
.warning{background:#fff3df;padding:13px;border-radius:9px;font-size:14px;line-height:1.7;margin-top:16px}
pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:310px;overflow:auto}
details{margin-top:17px}
</style>
</head>
<body>
<header><h1>자동차검사 결과 안내</h1><p>Vehicle Inspection Result</p></header>
<main>

<section class="card">
<h2>① 언어 / Language</h2>
<select id="lang" onchange="render()">
<option value="ko">한국어</option>
<option value="en">English</option>
<option value="zh">中文</option>
<option value="vi">Tiếng Việt</option>
</select>
</section>

<section class="card">
<h2>② 진단서 사진 / Photos</h2>
<label class="upload">
📷 앞면 / Front (판정·날짜)
<input type="file" accept="image/*" id="front" onchange="showPreview('front')">
</label>
<img class="preview" id="frontImg" alt="앞면 미리보기">

<label class="upload">
📷 뒷면 / Back (종합진단 결과)
<input type="file" accept="image/*" id="back" onchange="showPreview('back')">
</label>
<img class="preview" id="backImg" alt="뒷면 미리보기">

<p class="hint">
앞면과 뒷면을 모두 올려주세요.
고객정보는 가린 시험용 진단서만 사용하세요.
</p>
</section>

<section class="card">
<h2>③ 진단서 분석</h2>
<button id="run" type="button" onclick="startAnalysis()">
진단서 분석하기
</button>
<p id="progress" role="status">
사진을 선택한 뒤 버튼을 눌러주세요.
</p>
</section>

<section class="card" id="result">
<h2 id="mainTitle"></h2>
<div id="hero"></div>
<h2 id="sectionTitle"></h2>
<table><tbody id="rows"></tbody></table>
<p class="hint" id="legend"></p>

<h2 id="faultTitle" style="margin-top:25px"></h2>
<div id="faults"></div>
<div class="warning" id="notice"></div>

<details>
<summary>OCR 원문 보기 / Original OCR text</summary>
<pre id="raw"></pre>
</details>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';

const $=id=>document.getElementById(id);
const data={
ko:{
result:'검사 결과',pass:'적합',fail:'부적합',
unknown:'판정 인식 불가',
deadline:'재검사 기한',next:'다음 검사일',

faults:'종합진단 결과 · 점검 사항',

},
en:{

},

unknown:'无法识别结果',deadline:'复检截止日期',
next:'下次检测日期',noDate:'无法识别日期',
details:'综合诊断结果',good:'良好',need:'需要检查',none:'—',
legend:'—：报告中未识别到明确状态，并不代表正常。',
faults:'综合诊断结果 · 需检查事项',
noFault:'未能可靠识别背面检查事项。',

},

result:'Kết quả kiểm định',pass:'ĐẠT',fail:'KHÔNG ĐẠT',
unknown:'KHÔNG ĐỌC ĐƯỢC',

next:'Ngày kiểm định tiếp theo',
noDate:'KHÔNG ĐỌC ĐƯỢC NGÀY',
details:'Kết quả chẩn đoán',
good:'Tốt',need:'Cần kiểm tra',none:'—',
legend:'—: Chưa xác định trạng thái từ giấy gốc; không tự coi là tốt.',
faults:'Kết quả chẩn đoán · Mục cần kiểm tra',
noFault:'Chưa nhận dạng rõ nội dung cần kiểm tra ở mặt sau.',
notice:'Chỉ dùng thử OCR. Hãy đối chiếu kết quả, ngày và lỗi với giấy gốc.',
generic:'Cần kiểm tra (xem bản gốc tiếng Hàn)'
}
};

const cats=[
{n:['조향','Steering','转向','Hệ thống lái'],re:/조향|타이로드|스티어링/},
{n:['주행','Driving','行驶','Vận hành'],re:/주행|타이어|차축|현가|휠/},
{n:['제동','Brakes','制动','Phanh'],re:/제동(?!등)|브레이크|제동력|주차제동/},
{n:['등화','Lights','灯光','Đèn'],re:/등화|전조등|하향등|상향등|변별빔|제동등|후미등|방향지시등|번호판등|안개등|광도/},
{n:['배출가스','Emissions','排放','Khí thải'],re:/배출가스|매연|일산화탄소|탄화수소|\bCO\b|\bHC\b/},
{n:['계기','Instruments','仪表','Đồng hồ đo'],re:/계기|속도계|주행거리계/},
{n:['자기진단센서','Self-diagnostic Sensors','自诊断传感器','Cảm biến tự chẩn đoán'],re:/자기진단|진단센서|전자제어|OBD|고장코드|경고등|센서/}
];

const terms=[
{
re:/전조등|하향등|상향등|변별빔|광도/,
t:['전조등 관련 점검 사항','Headlight inspection needed','需检查前照灯','Cần kiểm tra đèn pha']
},
{
re:/제동등/,
t:['제동등 관련 점검 사항','Brake light inspection needed','需检查刹车灯','Cần kiểm tra đèn phanh']
},
{
re:/방향지시등/,
t:['방향지시등 관련 점검 사항','Turn signal inspection needed','需检查转向灯','Cần kiểm tra đèn xi nhan']
},
{
re:/타이어/,
t:['타이어 관련 점검 사항','Tire inspection needed','需检查轮胎','Cần kiểm tra lốp']
},
{
re:/조향|타이로드/,
t:['조향장치 관련 점검 사항','Steering inspection needed','需检查转向系统','Cần kiểm tra hệ thống lái']
},
{
re:/제동|브레이크/,
t:['제동장치 관련 점검 사항','Brake system inspection needed','需检查制动系统','Cần kiểm tra phanh']
},
{
re:/매연|배출가스|일산화탄소|탄화수소/,
t:['배출가스 관련 점검 사항','Emissions inspection needed','需检查尾气排放','Cần kiểm tra khí thải']
},
{
re:/계기|속도계/,
t:['계기 관련 점검 사항','Instrument inspection needed','需检查仪表','Cần kiểm tra đồng hồ đo']
},
{
re:/자기진단|OBD|고장코드|센서/,
t:['자기진단센서 관련 점검 사항','Self-diagnostic sensor inspection needed','需检查自诊断传感器','Cần kiểm tra cảm biến tự chẩn đoán']
}
];

let report=null,busy=false;

function msg(s){
$('progress').textContent=s;
}

function showPreview(id){
const f=$(id).files[0],im=$(id+'Img');
if(im.dataset.url)URL.revokeObjectURL(im.dataset.url);
if(!f)return;
const url=URL.createObjectURL(f);
im.src=url;
im.dataset.url=url;
im.style.display='block';
msg('사진 선택 완료. 분석 버튼을 눌러주세요.');
}

function clean(s){
return s.replace(/[\s·:：]/g,'');
}

function decision(text){
const lines=text.split(/\r?\n/);
for(let i=0;i<lines.length;i++){
if(!/(최종\s*판정|검사\s*결과|판정\s*결과)/.test(lines[i]))continue;
const near=clean(lines.slice(i,i+2).join(' '));
if(/부적합|불합격/.test(near))return 'fail';
if(/(^|[^부불])적합|합격/.test(near))return 'pass';
}
return 'unknown';
}

function dates(s){
let a=[],re=/(20\d{2})\s*[년.\/-]\s*(\d{1,2})\s*[월.\/-]\s*(\d{1,2})\s*일?/g,m;
while((m=re.exec(s))!==null){
const y=+m[1],mo=+m[2],d=+m[3];
const valid=new Date(y,mo-1,d);
if(valid.getFullYear()===y&&valid.getMonth()===mo-1&&valid.getDate()===d){
a.push(y+'.'+String(mo).padStart(2,'0')+'.'+String(d).padStart(2,'0'));
}
}
return a;
}

function getDate(front,kind){
const ls=front.split(/\r?\n/);
const marker=kind==='fail'
?/재\s*검\s*사\s*(기\s*간|기\s*한|만\s*료)/
:/다\s*음\s*검\s*사\s*(일|날\s*짜|기\s*간)|차\s*기\s*검\s*사\s*(일|기\s*간)/;

for(let i=0;i<ls.length;i++){
if(!marker.test(ls[i]))continue;
const nearby=ls.slice(i,i+3).join(' ');
const list=dates(nearby);
if(list.length)return kind==='fail'?list[list.length-1]:list[0];
}
return null;
}

function section(text){
const ls=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
const idx=ls.findIndex(s=>/종합진단결과/.test(clean(s)));
if(idx<0)return {found:false,lines:[]};

let out=[];
for(let i=idx+1;i<Math.min(ls.length,idx+60);i++){
if(/검사\s*(수수료|책임자)|재검사\s*(기간|기한)|발행\s*(일|기관)/.test(ls[i]))break;
out.push(ls[i]);
}
return {found:true,lines:out};
}

function entries(sec){
if(!sec.found)return [];
const lines=sec.lines;
const out=[];
let cur='';

for(const line of lines){
if(/^(?:\(?\d{1,2}\)?[.)]|[①②③④⑤⑥⑦⑧⑨⑩])\s*/.test(line)){
if(cur)out.push(cur);
cur=line;
}else if(cur){
cur+=' '+line;
}else if(/^(?:조향|주행|제동|등화|배출가스|계기|자기진단)/.test(line)){
out.push(line);
}
}
if(cur)out.push(cur);
return out;
}

const abnormal=/부적합|불량|미달|초과|부족|손상|마모|불균형|고장|점검\s*(요|필요|권고|대상)|정비\s*(요|필요)|작동\s*(불가|불량|하지)|점등\s*(불량|되지|안됨)|꺼지지\s*않|이상\s*(있|발견)/;

const normal=/양호|정상|적합|이상\s*없음|문제\s*없음/;

function categoryOf(text){
const head=text.replace(/^[\s\d①②③④⑤⑥⑦⑧⑨⑩().-]+/,'').slice(0,40);
const check=[head,text];

for(const part of check){
for(let i=0;i<cats.length;i++){
if(cats[i].re.test(part))return i;
}
}
return -1;
}

function statesOf(sec){
const rows=cats.map(()=>({state:'none'}));
const problems=[];

for(const e of entries(sec)){
const id=categoryOf(e);
if(id<0)continue;

if(abnormal.test(e)){
rows[id].state='need';
problems.push({category:id,raw:e});
}else if(normal.test(e)&&rows[id].state==='none'){
rows[id].state='good';
}
}
return {rows,problems};
}

function el(tag,cls,text){
const d=document.createElement(tag);
if(cls)d.className=cls;
if(text!==undefined)d.textContent=text;
return d;
}

function render(){
if(!report)return;
const k=$('lang').value,t=data[k];
const i=['ko','en','zh','vi'].indexOf(k);

$('mainTitle').textContent=t.result;
$('sectionTitle').textContent=t.details;
$('faultTitle').textContent=t.faults;
$('legend').textContent=t.legend;
$('notice').textContent=t.notice;

const hero=$('hero');
hero.replaceChildren();

const h=el('div','hero '+(report.final==='unknown'?'unknown':report.final));
h.append(el('b','',report.final==='fail'?t.fail:report.final==='pass'?t.pass:t.unknown));

if(report.final!=='unknown'){
h.append(el('div','date-label',report.final==='fail'?t.deadline:t.next));
h.append(el('div','date',report.date||t.noDate));
}
hero.append(h);

const tb=$('rows');
tb.replaceChildren();

report.rows.forEach((r,j)=>{
const tr=el('tr');
tr.append(el('td','',cats[j].n[i]));
tr.append(el(
'td',
r.state==='need'?'need':r.state==='good'?'good':'none',
r.state==='need'?t.need:r.state==='good'?t.good:t.none
));
tb.append(tr);
});

const fs=$('faults');
fs.replaceChildren();

if(!report.problems.length){
fs.append(el('p','hint',t.noFault));
}else{
for(const item of report.problems){
const card=el('div','fault');
const short=terms.find(x=>x.re.test(item.raw));
card.append(el('div','translated',short?short.t[i]:t.generic));
card.append(el('div','source',item.raw));
fs.append(card);
}
}
$('result').style.display='block';
}

function canvasFromFile(file){
return new Promise((ok,no)=>{
const im=new Image(),u=URL.createObjectURL(file);

im.onload=()=>{
const s=Math.min(2,2400/im.width,3200/im.height);
const c=document.createElement('canvas');
c.width=Math.max(1,Math.round(im.width*s));
c.height=Math.max(1,Math.round(im.height*s));
c.getContext('2d').drawImage(im,0,0,c.width,c.height);
URL.revokeObjectURL(u);
ok(c);
};

im.onerror=()=>{
URL.revokeObjectURL(u);
no(Error('이미지 열기 실패. JPG/PNG 사진을 사용하세요.'));
};

im.src=u;
});
}

function crop(c,y,h){
const z=document.createElement('canvas');
z.width=c.width;
z.height=Math.max(1,Math.floor(c.height*h));
z.getContext('2d').drawImage(
c,0,Math.floor(c.height*y),c.width,z.height,
0,0,z.width,z.height
);
return z;
}

async function startAnalysis(){
msg('버튼 작동 확인!');
if(busy)return;

const f=$('front').files[0],b=$('back').files[0];

if(!f||!b){
msg('앞면과 뒷면 사진을 모두 선택해주세요.');
return;
}

if(!window.Tesseract){
msg('OCR 파일을 불러오지 못했습니다. 인터넷을 확인해주세요.');
return;
}

busy=true;
$('run').disabled=true;
$('result').style.display='none';
let worker;

try{
msg('한글 인식 프로그램 준비 중...');

worker=await Tesseract.createWorker('kor+eng',1,{
logger:m=>{
if(m.status==='recognizing text'){
msg('OCR 인식 중 '+Math.round((m.progress||0)*100)+'%');
}
}
});

msg('앞면 판정·날짜 인식 중...');
const front=await canvasFromFile(f);
const frontText=(await worker.recognize(front)).data.text;

msg('뒷면 종합진단 결과 인식 중...');
const back=await canvasFromFile(b);
const full=(await worker.recognize(back)).data.text;

let candidate=[full];

for(const [y,h] of [[.18,.53],[.43,.52]]){
msg('뒷면 종합진단 결과 확대 인식 중...');
candidate.push((await worker.recognize(crop(back,y,h))).data.text);
}

const variants=candidate.map(section);
const best=variants.filter(s=>s.found).sort(
(a,b)=>entries(b).length-entries(a).length||
b.lines.join('').length-a.lines.join('').length
)[0]||{found:false,lines:[]};

const frontDecision=decision(frontText);
const final=frontDecision!=='unknown'
?frontDecision:decision(full);

const statuses=statesOf(best);

report={
final,
date:final==='unknown'?null:getDate(frontText,final),
rows:statuses.rows,
problems:statuses.problems
};

$('raw').textContent=
'[앞면]\n'+frontText+
'\n\n[뒷면 전체]\n'+full+
'\n\n[종합진단 결과 추출]\n'+best.lines.join('\n');

render();
msg('분석 완료. 원문과 결과를 꼭 대조해주세요.');
$('result').scrollIntoView({behavior:'smooth'});

}catch(e){
msg('분석 오류: '+e.message);
}finally{
if(worker){
try{await worker.terminate();}catch(e){}
}
busy=false;
