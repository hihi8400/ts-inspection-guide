
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TS 자동차검사 다국어 안내</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#edf3fa;color:#1b304a;
 font-family:Arial,"Malgun Gothic",sans-serif
}
header{
 background:#164780;color:white;
 padding:25px 18px;text-align:center
}
header h1{font-size:23px;margin:0 0 8px}
header p{font-size:13px;margin:0}
main{max-width:720px;margin:auto;padding:15px}
.card{
 background:white;border-radius:16px;
 padding:20px;margin-bottom:15px;
 box-shadow:0 2px 10px #0001
}
h2{font-size:19px;margin:0 0 15px}
h3{font-size:16px;margin:16px 0 8px}
select,button,input[type=text]{
 width:100%;padding:14px;font-size:16px;
 border-radius:10px;border:1px solid #cbd6e5
}
button{
 background:#1659a7;color:white;
 border:0;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.camera{
 display:block;text-align:center;
 padding:23px;background:#edf5ff;
 border:2px dashed #83a9d4;
 border-radius:12px;margin:12px 0;
 cursor:pointer;font-weight:bold
}
.camera small{
 display:block;font-weight:normal;
 margin-top:8px;color:#52677f
}
.camera input{display:none}
.preview{
 display:none;width:100%;max-height:300px;
 object-fit:contain;margin:10px 0
}
#output{display:none}
.status{
 padding:13px;background:#e8f1ff;
 border-radius:10px;margin:12px 0
}
.fail{
 background:#ffe8e8;color:#a32121;
 padding:14px;border-radius:10px;font-weight:bold
}
.notice{
 background:#fff2dc;padding:14px;
 border-radius:10px;line-height:1.7;
 margin-top:15px
}
.item{
 padding:13px;background:#f1f6fc;
 border-radius:10px;margin:9px 0;
 line-height:1.7
}
.muted{color:#607086;font-size:13px;line-height:1.6}
#progress{white-space:pre-wrap;font-weight:bold;color:#1659a7}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
</style>
</head>

<body>
<header>
<h1>자동차검사 다국어 안내</h1>
<p>Vehicle Inspection Multilingual Guide</p>
</header>

<main>

<section class="card">
<h2>① 언어 선택 / Language</h2>
<select id="lang">
<option value="ko">한국어</option>
<option value="en">English</option>
<option value="zh">中文</option>
<option value="vi">Tiếng Việt</option>
</select>
</section>

<section class="card">
<h2>② 진단서 사진 등록</h2>

<label class="camera">
📷 앞면 촬영 또는 사진 선택
<small>Front side</small>
<input id="front" type="file" accept="image/*"
onchange="preview(this,'frontPreview')">
</label>
<img id="frontPreview" class="preview">

<label class="camera">
📷 뒷면 촬영 또는 사진 선택
<small>Back side · 부적합 사유가 있는 면</small>
<input id="back" type="file" accept="image/*"
onchange="preview(this,'backPreview')">
</label>
<img id="backPreview" class="preview">

<p class="muted">
사진은 브라우저 안에서 OCR 처리합니다.
고객 개인정보가 포함된 실제 진단서는
기관 승인 전 시범 테스트에 사용하지 마세요.
</p>
</section>

<section class="card">
<h2>③ 진단서 자동 분석</h2>
<button id="analyzeBtn" onclick="analyze()">
사진 자동 인식하기
</button>
<p id="progress"></p>
</section>

<section class="card" id="output">
<h2 id="resultTitle">분석 결과</h2>
<div id="resultContent"></div>

<div class="notice" id="warning"></div>

<details>
<summary>OCR 인식 원문 확인</summary>
<h3>뒷면</h3>
<pre id="backRaw"></pre>
<h3>앞면</h3>
<pre id="frontRaw"></pre>
</details>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
const $=id=>document.getElementById(id);

const LANGS=["ko","en","zh","vi"];

const MSG={

none:"인식된 내용이 부족합니다.",
confirm:"원본 진단서에서 확인하세요.",
warn:"⚠️ OCR 시범서비스입니다. 잘못 인식할 수 있으며, 아래 항목은 확정 판정이 아닙니다. 재검사 기한과 온라인 재검사 가능 여부는 반드시 원본 진단서 또는 검사원에게 확인하세요.",

},

repair:"Recommended action",

none:"Not enough information recognized.",

warn:"⚠️ OCR demonstration only. Results may be incorrect and are not official findings. Confirm the reinspection deadline and online eligibility on the original report or with an inspector.",

},

title:"车辆检测分析结果",
fail:"可能检测不合格",
unknown:"检测结果需要核实",
issue:"可能的不合格原因",
repair:"维修建议",
date:"可能的复检截止日期",
none:"识别的信息不足。",
confirm:"请核对正式检测报告。",
warn:"⚠️ 仅为OCR试用服务，识别可能出错，结果并非正式判定。请根据原始报告或检测员确认复检期限和在线复检资格。",
running:"正在识别照片。",
done:"文字识别完成"
},
vi:{
title:"Kết quả phân tích kiểm định",
fail:"Có thể không đạt kiểm định",
unknown:"Cần xác minh kết quả",
issue:"Nguyên nhân có thể không đạt",
repair:"Hướng dẫn sửa chữa",
date:"Ngày có thể là hạn kiểm định lại",
none:"Không nhận dạng đủ thông tin.",
confirm:"Vui lòng kiểm tra giấy gốc.",
warn:"⚠️ Đây chỉ là bản thử nghiệm OCR. Kết quả có thể sai và không phải kết luận chính thức. Hãy xác nhận thời hạn và điều kiện kiểm định lại trực tuyến trên giấy gốc hoặc với nhân viên.",
running:"Đang phân tích ảnh.",
done:"Đã hoàn tất OCR"
}
};

const ISSUES=[
{
regex:/전조등|전조등광도|변별빔|하향등|헤드램프/i,
name:[
"전조등 광도 또는 조사 상태",
"Headlight intensity or beam condition",
"前照灯亮度或照射状态",
"Cường độ hoặc hướng chiếu đèn pha"
],
repair:[
"전조등 점등 상태, 전구·LED, 광도와 조사각을 점검하고 필요시 수리·조정하세요.",
"Check the headlight, bulb or LED, light intensity and beam alignment. Repair or adjust as needed.",
"请检查前照灯、灯泡或LED、亮度及照射角度，必要时维修或调整。",
"Kiểm tra đèn pha, bóng đèn hoặc LED, cường độ sáng và góc chiếu; sửa chữa hoặc điều chỉnh khi cần."
]
},
{
regex:/번호판등|등록번호판등|번호등/i,
name:[
"번호판등",
"License plate light",
"车牌灯",
"Đèn biển số"
],
repair:[
"번호판등 점등 여부와 전구·배선을 점검하고 수리하세요.",
"Check and repair the license plate light and wiring.",
"检查并维修车牌灯及线路。",
"Kiểm tra và sửa đèn biển số cùng hệ thống dây điện."
]
},
{
regex:/제동등|정지등|브레이크등/i,
name:[
"제동등",
"Brake light",
"制动灯",
"Đèn phanh"
],
repair:[
"브레이크 작동 시 제동등이 정상 점등되는지 확인하고 수리하세요.",
"Check that the brake lights illuminate when braking and repair any faults.",
"检查制动时刹车灯是否正常亮起，并修复故障。",
"Kiểm tra đèn phanh khi đạp phanh và sửa lỗi nếu có."
]
},
{
regex:/방향지시등|방향지시기/i,
name:[
"방향지시등",
"Turn signal",
"转向灯",
"Đèn xi nhan"
],
repair:[
"방향지시등의 점등 상태와 점멸 속도를 점검하세요.",
"Check turn signal operation and flashing rate.",
"检查转向灯的工作状态和闪烁频率。",
"Kiểm tra hoạt động và tốc độ nhấp nháy của đèn xi nhan."
]
},
{
regex:/매연|배출가스|일산화탄소|탄화수소/i,
name:[
"배출가스",
"Exhaust emissions",
"尾气排放",
"Khí thải"
],
repair:[
"배출가스 관련 장치와 엔진 상태를 점검하고 정비하세요.",
"Have the engine and emission control system inspected and repaired.",
"检查并维修发动机和排放控制系统。",
"Kiểm tra và sửa động cơ cùng hệ thống kiểm soát khí thải."
]
},
{
regex:/주차제동|주차브레이크/i,
name:[
"주차제동장치",
"Parking brake",
"驻车制动装置",
"Phanh đỗ"
],
repair:[
"주차제동력과 관련 부품을 점검하고 조정·수리하세요.",
"Inspect, adjust or repair the parking brake system.",
"检查、调整或维修驻车制动系统。",
"Kiểm tra, điều chỉnh hoặc sửa chữa hệ thống phanh đỗ."
]
}
];

function preview(input,id){
const img=$(id);
if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);
if(input.files[0]){
const url=URL.createObjectURL(input.files[0]);
img.dataset.url=url;
img.src=url;
img.style.display="block";
}
}

function add(parent,tag,text,className){
const e=document.createElement(tag);
e.textContent=text;
if(className)e.className=className;
parent.appendChild(e);
return e;
}

/* 이미지 확대 및 명암 보정 */
async function preprocess(file,scale=2,threshold=false){
const bitmap=await createImageBitmap(file);
const maxWidth=2600;
const factor=Math.min(scale,maxWidth/bitmap.width);
const canvas=document.createElement("canvas");
canvas.width=Math.round(bitmap.width*factor);
canvas.height=Math.round(bitmap.height*factor);
const ctx=canvas.getContext("2d",{willReadFrequently:true});
ctx.fillStyle="white";
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
bitmap.close();

const image=ctx.getImageData(0,0,canvas.width,canvas.height);
const data=image.data;

for(let i=0;i<data.length;i+=4){
let gray=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
gray=(gray-128)*1.45+128;
if(threshold)gray=gray>160?255:0;
gray=Math.max(0,Math.min(255,gray));
data[i]=gray;
data[i+1]=gray;
data[i+2]=gray;
}
ctx.putImageData(image,0,0);

return canvas;
}

function crop(canvas,x,y,w,h){
const c=document.createElement("canvas");
c.width=Math.round(canvas.width*w);
c.height=Math.round(canvas.height*h);
const ctx=c.getContext("2d");
ctx.drawImage(
canvas,
Math.round(canvas.width*x),
Math.round(canvas.height*y),
Math.round(canvas.width*w),
Math.round(canvas.height*h),
0,0,c.width,c.height
);
return c;
}

function dateCandidates(text){
const lines=text.split(/\n/);
const result=[];
const pattern=/20\d{2}\s*[.\-/년]\s*(?:0?[1-9]|1[0-2])\s*[.\-/월]\s*(?:0?[1-9]|[12]\d|3[01])\s*일?/g;
for(let i=0;i<lines.length;i++){
const line=lines[i];
const matches=line.match(pattern)||[];
for(const date of matches){
const context=lines.slice(Math.max(0,i-2),Math.min(lines.length,i+3)).join(" ");
result.push({
date:date.trim(),
context:context,
likely:/재검사|까지|기한|기간/.test(context)
});
}
}
return result;
}

function detectIssue(text){
const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
const matches=[];
for(const issue of ISSUES){
const candidates=lines.filter(line=>issue.regex.test(line));
if(candidates.length){
matches.push({
issue,
evidence:candidates.slice(0,3),
failureHint:candidates.some(line=>/부적합|불량|미달|초과|점등되지|고장|결함/.test(line))
});
}
}
return matches;
}

async function analyze(){
const front=$("front").files[0];
const back=$("back").files[0];
if(!front&&!back){
alert("앞면 또는 뒷면 사진을 등록해 주세요.");
return;
}
if(!window.Tesseract){
alert("OCR 프로그램을 불러오지 못했습니다. 인터넷 연결을 확인하세요.");
return;
}

const lang=$("lang").value;
const index=LANGS.indexOf(lang);
const m=MSG[lang];
const btn=$("analyzeBtn");
btn.disabled=true;
$("output").style.display="none";
$("progress").textContent=m.running;

let worker=null;
try{
worker=await Tesseract.createWorker("kor+eng",1,{
logger:msg=>{
if(msg.status==="recognizing text"){
$("progress").textContent=m.running+" "+
Math.round((msg.progress||0)*100)+"%";
}
}
});

async function readPhoto(file,label){
if(!file)return "";
$("progress").textContent=label+" OCR...";
const canvas=await preprocess(file,2,false);
let combined="";
const full=await worker.recognize(canvas);
combined+=full.data.text+"\n";

if(label==="BACK"){
const sections=[
crop(canvas,0.10,0.36,0.82,0.26),
crop(canvas,0.10,0.53,0.82,0.35)
];
for(let i=0;i<sections.length;i++){
$("progress").textContent="BACK region "+(i+1)+"/2...";
const r=await worker.recognize(sections[i]);
combined+="\n--- REGION "+(i+1)+" ---\n"+r.data.text;
}
}
return combined;
}

const backText=await readPhoto(back,"BACK");
const frontText=await readPhoto(front,"FRONT");

$("backRaw").textContent=backText;
$("frontRaw").textContent=frontText;

const allText=backText+"\n"+frontText;
const content=$("resultContent");
content.replaceChildren();

$("resultTitle").textContent=m.title;

const failDetected=/최종\s*판정\s*[:：]?\s*부적합|최종판정.{0,12}부적합|부적합/.test(backText);

add(content,"div",
failDetected?m.fail:m.unknown,
failDetected?"fail":"status");

add(content,"h3",m.issue);

const found=detectIssue(backText);
if(!found.length){
add(content,"p",m.none);
}else{
for(const entry of found){
const box=add(content,"div","", "item");
add(box,"strong",entry.issue.name[index]);
add(box,"p",m.repair+": "+entry.issue.repair[index]);
add(box,"small","OCR: "+entry.evidence.join(" / "));
}
}

add(content,"h3",m.date);

const dates=dateCandidates(backText);
const likely=dates.filter(d=>d.likely);
if(likely.length){
const unique=[...new Set(likely.map(d=>d.date))];
add(content,"p",unique.join(" / "));
}else{
add(content,"p",m.confirm);
}

$("warning").textContent=m.warn;
$("output").style.display="block";
$("progress").textContent=m.done;
$("output").scrollIntoView({behavior:"smooth"});

}catch(err){
$("progress").textContent="OCR 오류: "+err.message;
}finally{
if(worker)await worker.terminate();
btn.disabled=false;
}
}
</script>
</body>
</html>
