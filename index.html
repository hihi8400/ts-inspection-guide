
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자동차검사 결과 다국어 안내</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#1c3349;background:#edf3f8}
*{box-sizing:border-box}
body{margin:0}
header{background:#155b93;color:#fff;padding:24px 16px;text-align:center}
header h1{margin:0 0 6px;font-size:25px}
main{max-width:760px;margin:auto;padding:14px}
.card{background:white;padding:22px;margin-bottom:15px;border-radius:17px;box-shadow:0 2px 12px #1636510c}
h2{font-size:22px;margin:4px 0 16px}
select,input,button,textarea{font:inherit}
select,input[type=text]{width:100%;border:1px solid #a7bacd;border-radius:10px;padding:12px;font-size:17px;background:#fff}
.upload{display:block;padding:17px;margin:12px 0;border:2px dashed #9bb8d0;border-radius:12px;background:#f3f8ff;font-weight:700;font-size:18px}
.upload input{display:block;width:100%;margin-top:10px;font-size:15px;font-weight:400}

.small{font-size:15px;color:#5a6978;line-height:1.65}

.need{color:#b12828;font-weight:800}

td{font-size:17px}

}

<body>

<header>
<h1>자동차검사 결과 안내</h1>
<div>Vehicle Inspection Result</div>
</header>

<main>
<section class="card">
<h2>① 언어 / Language</h2>
<select id="lang">
<option value="ko">한국어</option>
<option value="en">English</option>
<option value="zh">中文</option>
<option value="vi">Tiếng Việt</option>
</select>
</section>

<section class="card">
<h2>② 진단서 사진 2장</h2>
<label class="upload">
앞면 — 판정·날짜·검사 항목
<input id="front" type="file" accept="image/*">
</label>
<img id="frontImg" class="preview" alt="앞면 미리보기">

<label class="upload">
뒷면 — 최종판정·부적합 사유·센서
<input id="back" type="file" accept="image/*">
</label>
<img id="backImg" class="preview" alt="뒷면 미리보기">

<p class="small">사진은 앞면과 뒷면 각각 1장만 필요합니다. 날짜와 표는 프로그램이 사진 내부에서 자동 분석합니다.</p>
</section>

<section class="card">
<h2>③ 결과 분석</h2>
<button id="run">진단서 분석하기</button>
<p id="progress" role="status">앞면과 뒷면 사진을 선택해 주세요.</p>
</section>

<section class="card" id="result">
<h2 id="resultTitle"></h2>
<div id="hero"></div>

<h2 id="itemTitle"></h2>
<table><tbody id="rows"></tbody></table>
<p id="itemHelp" class="small"></p>

<h2 id="findingTitle"></h2>
<div id="findings"></div>
<p id="faultWarning" class="warning"></p>
<div id="warn" class="notice"></div>

<details>
<summary>OCR 원문 확인·수정 (검사원용)</summary>
<p class="small">자동 판독이 불확실한 경우에만 원본을 직접 확인하고 수정해 주세요. 수정하지 않아도 자동 분석은 실행됩니다.</p>

<label>
원본에서 직접 확인한 날짜
<input id="dateEdit" type="text" placeholder="YYYY.MM.DD">
</label>

<p>검사 항목 확인</p>
<div id="manualStates"></div>

<p>앞면 OCR</p>
<textarea id="frontOcr"></textarea>

<p>뒷면 OCR</p>
<textarea id="backOcr"></textarea>

<button id="apply">확인한 수정 내용 적용</button>
</details>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
'use strict';

const $=id=>document.getElementById(id);
const langs=['ko','en','zh','vi'];

const T={
ko:{
title:'최종 검사 결과',
pass:'적합',
fail:'부적합',
unknown:'판정 확인 필요',
deadline:'재검사 기한',
next:'다음 검사일',
date:'날짜 확인 필요',
items:'검사 항목별 진단의견',
good:'양호',
need:'점검요',
unread:'판독 불가',
help:'판독 불가는 양호를 의미하지 않습니다. 원본에 없는 결과를 추정하지 않습니다.',
findings:'종합진단 결과 — 부적합 항목',
missing:'부적합 항목을 확실하게 읽지 못했습니다. 원본 확인 필요',

warn:'자동 문자 인식에는 오류가 있을 수 있습니다. 원본에 없는 날짜·판정·결함은 만들어 내지 않습니다.',
partial:'부적합 항목이 일부 누락되었을 수 있습니다. 원본 확인 필요',

},
en:{
title:'Vehicle Inspection Result',
pass:'PASS',
fail:'FAIL',
unknown:'VERIFY RESULT',
deadline:'Reinspection Deadline',
next:'Next Inspection Date',
date:'Verify date on original',
items:'Inspection Items',
good:'Good',
need:'Inspection Required',
unread:'Not verified',
help:'Not verified does not mean Good. No unverified result is assumed.',
findings:'Comprehensive Inspection Findings',
missing:'Could not reliably read defect list. Check original.',
verify:'Verify Korean original — translation withheld',
warn:'OCR may make mistakes. Decisions, dates and defects are never invented.',
partial:'Some defects may be missing. Check the original.',
none:'No listed defects'
},
zh:{
title:'车辆检测结果',
pass:'合格',
fail:'不合格',
unknown:'请核对检测结果',
deadline:'复检截止日期',
next:'下次检测日期',
date:'请核对原件日期',
items:'检测项目',
good:'良好',
need:'需要检查',
unread:'无法确认',
help:'无法确认不代表正常，不推测未确认的结果。',
findings:'综合诊断结果 — 不合格项目',
missing:'无法可靠识别不合格项目，请核对原件',
verify:'请核对韩语原文 — 暂不翻译',
warn:'OCR可能出错，不推测检测结论、日期或缺陷。',
partial:'可能遗漏部分不合格项目，请核对原件。',
none:'无不合格项目'
},
vi:{
title:'Kết quả kiểm định xe',
pass:'ĐẠT',
fail:'KHÔNG ĐẠT',
unknown:'CẦN XÁC MINH',
deadline:'Hạn kiểm định lại',
next:'Ngày kiểm định tiếp theo',
date:'Kiểm tra ngày trên bản gốc',
items:'Các hạng mục kiểm định',
good:'Tốt',
need:'Cần kiểm tra',
unread:'Chưa xác minh',
help:'Chưa xác minh không có nghĩa là tốt. Không suy đoán kết quả.',
findings:'Kết quả chẩn đoán — Hạng mục không đạt',
missing:'Không đọc rõ danh sách lỗi. Kiểm tra bản gốc.',
verify:'Đối chiếu bản gốc tiếng Hàn — chưa dịch',
warn:'OCR có thể sai. Không tự tạo kết luận, ngày hoặc lỗi.',
partial:'Có thể còn thiếu lỗi. Kiểm tra bản gốc.',
none:'Không có lỗi được liệt kê'
}
};

const cats=[
{
names:['조향계통','Steering System','转向系统','Hệ thống lái'],
re:/조향\s*계[통동]/
},
{
names:['주행계통','Driving System','行驶系统','Hệ thống vận hành'],
re:/주행\s*계[통동]/
},
{
names:['제동계통','Braking System','制动系统','Hệ thống phanh'],
re:/제동\s*계[통동]/
},
{
names:['등화장치','Lighting','灯光装置','Hệ thống đèn'],
re:/등[화하]\s*장치/
},
{
names:['배출가스','Emissions','尾气排放','Khí thải'],
re:/배출\s*가스/
},
{
names:['계기계통','Instrument System','仪表系统','Hệ thống đồng hồ'],
re:/계기\s*계[통동]/
},
{
names:['자가진단 센서 점검','Self-Diagnostic Sensor Check','自诊断传感器检查','Kiểm tra cảm biến tự chẩn đoán'],
re:/전자\s*제어\s*센서|자[가기]\s*진단\s*센서/
}
];

const translations=[
[
/^등화장치임의변경$/,
[
'등화장치 임의변경',
'Unauthorized modification of lighting equipment',
'擅自改装灯光装置',
'Tự ý thay đổi hệ thống đèn'
]
],
[
/^물품적재장치임의변경$/,
[
'물품적재장치 임의변경',
'Unauthorized modification of cargo-loading equipment',
'擅自改装载货装置',
'Tự ý thay đổi thiết bị chở hàng'
]
],
[
/^안개등LED$/i,
[
'안개등 LED',
'Fog lamp LED',
'雾灯 LED',
'Đèn sương mù LED'
]
],
[
/^활어운반장치임의설치$/,
[
'활어운반장치 임의 설치',
'Unauthorized installation of live-fish transport equipment',
'擅自安装活鱼运输装置',
'Tự ý lắp đặt thiết bị vận chuyển cá sống'
]
]
];

const compact=s=>String(s||'').replace(/[\s<>〈〉\[\]【】(){}|:：,，.·\-]/g,'');

function validDate(y,m,d){
y=Number(y);
m=Number(m);
d=Number(d);

const x=new Date(y,m-1,d);

return y>=2020&&y<=2099&&
x.getFullYear()===y&&
x.getMonth()===m-1&&
x.getDate()===d
?`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`
:null;
}

function datesIn(s){
const found=[];
const re=/(20\d{2})\s*(?:년|[.\/-])\s*(\d{1,2})\s*(?:월|[.\/-])\s*(\d{1,2})\s*일?/g;

for(const m of String(s).matchAll(re)){
const d=validDate(m[1],m[2],m[3]);
if(d)found.push(d);
}

return [...new Set(found)];
}

function statusOf(front,back){
const values=[];

for(const text of [back,front]){
for(const line of String(text).split(/\r?\n/)){
const m=line.match(/최종\s*판정\s*[:：]?\s*(부\s*적\s*합|적\s*합|불\s*합\s*격|합\s*격)/);

if(m){
values.push(/부|불/.test(m[1])?'fail':'pass');
}
}
}

return new Set(values).size===1?values[0]:'unknown';
}

function labelledDates(text,status){
if(status==='unknown')return [];

const lines=String(text||'').split(/\r?\n/);
const label=status==='fail'
?/재\s*검\s*사\s*(?:기\s*간|기\s*한)/
:/다\s*음\s*검\s*사\s*(?:일|날짜|기\s*간)/;

const out=[];

for(let i=0;i<lines.length;i++){
const m=label.exec(lines[i]);
if(!m)continue;

const after=lines[i]
.slice(m.index+m[0].length)
.split(/최초\s*등록|검사\s*일자|주행\s*거리|차대\s*번호|소유자/)[0];

out.push(...datesIn(after));

if(!datesIn(after).length&&i+1<lines.length){
out.push(...datesIn(lines[i+1].slice(0,75)));
}
}

return [...new Set(out)];
}

function pickDate(front,attempts,status,manual=''){
if(manual)return manual;

// 날짜는 앞면의 해당 날짜 항목과 연결된 것만 인정
const a=[...labelledDates(front,status)];

for(const s of attempts){
a.push(...labelledDates(s,status));

if(status==='fail'){
for(const m of s.matchAll(/(20\d{2}\s*(?:년|[.\/-])\s*\d{1,2}\s*(?:월|[.\/-])\s*\d{1,2}\s*일?)\s*까\s*지/g)){
a.push(...datesIn(m[1]));
}
}
}

// 서로 다른 날짜가 나오면 임의로 선택하지 않음
const unique=[...new Set(a)];
return unique.length===1?unique[0]:null;
}

function stopAtOpinion(s){
return String(s).split(
/(?:[<〈\[]\s*종\s*합\s*의\s*견\s*[>〉\]]?|\n\s*\[\s*1\s*\]|\n\s*진단결과|\n\s*자동차관리법|\n\s*해당\s*검사소)/
)[0];
}

function splitItems(s){
const out=[];
let cur='',depth=0;

for(const ch of String(s)){
if('[［(（【'.includes(ch))depth++;
if(']］)）】'.includes(ch))depth=Math.max(0,depth-1);

if((ch===','||ch==='，'||ch==='\n')&&depth===0){
if(cur.trim())out.push(cur.trim());
cur='';
}else{
cur+=ch;
}
}

if(cur.trim())out.push(cur.trim());
return out;
}

function cleanFault(s){
s=String(s).replace(/^[^가-힣\[【]+/,'').trim();

if(/^기타\s*[\[［(（【]/.test(s)){
const m=s.match(/^기타\s*[\[［(（【][^\]］)）】\n]{2,70}[\]］)）】]/);
return m?m[0].trim():'';
}

return s
.replace(/\s*(?:자동차관리법|해당\s*검사소|귀하의\s*자동차|등화장치가|차량\s*물품).*$/,'')
.replace(/[|;:：.]+$/,'')
.trim();
}

function plausible(s){
return s.length>=4&&
s.length<=85&&
!/검사소|자동차관리법|원상복구|조치를|하시기|진단결과|정비하여|과태료|고객님|합니다|바랍니다|결함이/.test(s)&&
/[가-힣]/.test(s)&&
/임의\s*(?:변경|설치)|^기타\s*[\[［(（【]|불량|미달|파손|누유|초과|부식|손상|미점등|작동불량/.test(s);
}

function extractBlocks(text,allowIsolated=false){
const lines=String(text||'').split(/\r?\n/);
const blocks=[];

for(let i=0;i<lines.length;i++){
const header=lines[i].match(/[<〈\[]?\s*부\s*적\s*[합함]\s*[>〉\]]/);

if(!header&&!allowIsolated)continue;

if(!header&&(
!/임의\s*변경|임의\s*설치/.test(lines[i])||
!/기타\s*[\[［(（【]|,|，/.test(lines[i])
))continue;

let s=header
?lines[i].slice(header.index+header[0].length)
:lines[i];

for(let j=i+1;j<Math.min(i+4,lines.length);j++){
if(/[<〈\[]\s*종\s*합\s*의\s*견|\[\s*1\s*\]|최종\s*판정|진단결과\s*귀하/.test(lines[j]))break;
if(s.length>290)break;
s+='\n'+lines[j];
}

const items=splitItems(stopAtOpinion(s))
.map(cleanFault)
.filter(plausible);

if(items.length)blocks.push(items.slice(0,15));
}

return blocks;
}

function faultQuality(s){
const key=compact(s).replace(/^기타/,'');
if(translations.some(([re])=>re.test(key)))return 6;
if(/임의변경|임의설치/.test(key))return 3;
return 1;
}

function extractFaults(back,focused){
const blocks=[
...extractBlocks(back),
...focused.flatMap(s=>extractBlocks(s,true))
];

if(!blocks.length)return [];

blocks.sort((a,b)=>{
const score=x=>x.reduce((n,s)=>n+faultQuality(s),0)+x.length*3;
return score(b)-score(a);
});

const best=blocks[0],seen=new Set();

return best.filter(s=>{
const key=compact(s);
if(seen.has(key))return false;
seen.add(key);
return true;
});
}

function expectedFaultCount(text){
const n=[
...String(text).matchAll(
/(?:상기|위)\s*[\(（]?\s*([1-9])\s*[\)）]?\s*건|\[\s*([1-9])\s*\]\s*항목/g
)
].map(x=>Number(x[1]||x[2]));

return new Set(n).size===1?n[0]:null;
}

function translatedFault(raw){
const key=compact(raw).replace(/^기타/,'');
const hit=translations.find(([re])=>re.test(key));
return hit?hit[1]:null;
}

function resultWord(text){
const s=String(text||'').replace(/\s+/g,'');
const good=/양호|정상|이상없음/.test(s);
const bad=/점검요|점검필요|불량|부적합/.test(s);

return good&&!bad?'good':bad&&!good?'need':'unread';
}

function textStates(front){
const out=Array(6).fill('unread');
const lines=String(front).split(/\r?\n/);

for(let i=0;i<6;i++){
const seen=[];

for(let j=0;j<lines.length;j++){
const m=cats[i].re.exec(lines[j]);
if(!m)continue;

const segment=lines[j]
.slice(m.index+m[0].length)
.slice(0,100);

let state=resultWord(segment);

if(
state==='unread'&&
j+1<lines.length&&
!cats.slice(0,6).some(c=>c.re.test(lines[j+1]))
){
state=resultWord(
(segment+' '+lines[j+1]).slice(0,110)
);
}

if(state!=='unread')seen.push(state);
}

if(seen.length&&new Set(seen).size===1){
out[i]=seen[0];
}
}

return out;
}

function sensorState(back){
const s=String(back||'').replace(/\s+/g,'');
const m=s.match(
/(?:전자제어센서|센서진단)(?:진단)?결과.{0,30}?(정상|양호|이상없음|점검요|불량)/
);

return m?resultWord(m[1]):'unread';
}

function mergeStates(front,back,focusedStates,faults){
const out=textStates(front);

for(let i=0;i<6;i++){
const good=focusedStates[i].filter(x=>x!=='unread');

if(good.length&&new Set(good).size===1){
if(out[i]==='unread'){
out[i]=good[0];
}else if(out[i]!==good[0]){
out[i]='unread';
}
}
}

out.push(sensorState(back));

// 부적합 사유만 보고 계통별 양호/점검요를 추정하지 않음
return out;
}

function create(tag,cls,text){
const e=document.createElement(tag);
if(cls)e.className=cls;
if(text!==undefined)e.textContent=text;
return e;
}

let frontText='';
let backText='';
let dateReads=[];
let faultReads=[];
let categoryReads=Array.from({length:6},()=>[]);
let manualDate='';
let manualStates=Array(7).fill('auto');
let current=null;
let busy=false;

function parse(){
const status=statusOf(frontText,backText);
const faults=extractFaults(backText,faultReads);
const states=mergeStates(frontText,backText,categoryReads,faults);

for(let i=0;i<7;i++){
if(manualStates[i]!=='auto'){
states[i]=manualStates[i];
}
}

return {
status,
date:pickDate(frontText,dateReads,status,manualDate),
states,
faults,
expected:expectedFaultCount(backText)
};
}

$('resultTitle').textContent=t.title;

const hero=create(

hero.append(

if(current.status!=='unknown'){

);

if(!current.faults.length){

$('faultWarning').textContent=

function preview(id){
const img=$(id+'Img');
const file=$(id).files[0];

if(img.dataset.url){
URL.revokeObjectURL(img.dataset.url);
}

if(!file){
img.style.display='none';
return;
}

img.dataset.url=URL.createObjectURL(file);
img.src=img.dataset.url;
img.style.display='block';
}

function loadCanvas(file){
return new Promise((resolve,reject)=>{
const img=new Image();
const url=URL.createObjectURL(file);

img.onload=()=>{
const scale=Math.min(
2.2,
3000/img.width,
4000/img.height
);

const c=document.createElement('canvas');
c.width=Math.round(img.width*scale);
c.height=Math.round(img.height*scale);

c.getContext('2d').drawImage(
img,0,0,c.width,c.height
);

URL.revokeObjectURL(url);
resolve(c);
};

img.onerror=()=>{
URL.revokeObjectURL(url);
reject(Error('사진을 열 수 없습니다.'));
};

img.src=url;
});
}

function crop(c,x,y,w,h,scale=1.5,contrast=false){
x=Math.max(0,Math.min(1,x));
y=Math.max(0,Math.min(1,y));
w=Math.min(w,1-x);
h=Math.min(h,1-y);

const o=document.createElement('canvas');

o.width=Math.max(
1,Math.round(c.width*w*scale)
);

o.height=Math.max(
1,Math.round(c.height*h*scale)
);

const ctx=o.getContext('2d');

if(contrast){
ctx.filter='grayscale(1) contrast(1.65)';
}

ctx.drawImage(
c,
c.width*x,
c.height*y,
c.width*w,
c.height*h,
0,0,
o.width,o.height
);

return o;
}

// Tesseract TSV에서 글자 위치 추출
function wordsFrom(tsv){
const out=[];
if(!tsv)return out;

for(const line of tsv.split(/\r?\n/).slice(1)){
const a=line.split('\t');
if(a.length<12||a[0]!=='5')continue;

const s=a.slice(11).join('\t').trim();
const x=+a[6];
const y=+a[7];
const w=+a[8];
const h=+a[9];

if(
s&&
[x,y,w,h].every(Number.isFinite)&&
w>0&&h>0
){
out.push({
s,x,y,w,h,
line:a.slice(1,5).join('_')
});
}
}

return out;
}

function lineGroups(words){
const map=new Map();

for(const w of words){
if(!map.has(w.line)){
map.set(w.line,[]);
}
map.get(w.line).push(w);
}

return [...map.values()].map(ws=>{
ws.sort((a,b)=>a.x-b.x);

return {
s:ws.map(w=>w.s).join(' '),
x:Math.min(...ws.map(w=>w.x)),
y:Math.min(...ws.map(w=>w.y)),
w:Math.max(...ws.map(w=>w.x+w.w))-
Math.min(...ws.map(w=>w.x)),
h:Math.max(...ws.map(w=>w.y+w.h))-
Math.min(...ws.map(w=>w.y))
};
}).sort((a,b)=>a.y-b.y);
}

// 앞면 날짜 영역 자동 분석
function dateRegions(canvas,tsv){
const W=canvas.width;
const H=canvas.height;
const regions=[];
const lines=lineGroups(wordsFrom(tsv));

for(const l of lines){
if(
/재\s*검\s*사\s*(?:기\s*간|기\s*한)|다\s*음\s*검\s*사\s*(?:일|날짜)/.test(l.s)&&
l.y<H*.47
){
regions.push([
Math.max(0,(l.x-45)/W),
Math.max(0,(l.y-25)/H),
Math.min(.92,(l.w+W*.48)/W),
Math.min(.09,(l.h+55)/H)
]);
}
}

// 날짜 라벨 인식 실패 시 상단 날짜 표 재분석
regions.push(
[.49,.216,.29,.045],
[.33,.175,.53,.095],
[.15,.14,.76,.18]
);

return regions.slice(0,4);
}

// 표의 가로 경계선 검출
function findMainLines(canvas){
const w=canvas.width;
const h=canvas.height;

const small=document.createElement('canvas');
small.width=480;
small.height=Math.round(480*h/w);

const ctx=small.getContext('2d',{
willReadFrequently:true
});

ctx.drawImage(
canvas,0,0,small.width,small.height
);

const {data}=ctx.getImageData(
0,0,small.width,small.height
);

const W=small.width;
const H=small.height;
const score=[];

for(
let y=Math.floor(H*.21);
y<Math.floor(H*.96);
y++
){
let hits=0,total=0;

for(
let x=Math.floor(W*.15);
x<Math.floor(W*.29);
x+=2
){
const i=(y*W+x)*4;
const r=data[i];
const g=data[i+1];
const b=data[i+2];

const lum=.3*r+.59*g+.11*b;
total++;

if(
lum<155&&
Math.max(r,g,b)-Math.min(r,g,b)<85
){
hits++;
}
}

score.push({
y,
ratio:hits/Math.max(1,total)
});
}

const peaks=[];

for(let i=1;i<score.length-1;i++){
if(
score[i].ratio>.57&&
score[i].ratio>=score[i-1].ratio&&
score[i].ratio>=score[i+1].ratio
){
const y=score[i].y/H;

if(
!peaks.length||
y-peaks[peaks.length-1]>.006
){
peaks.push(y);
}
}
}

return peaks;
}

// 검사 계통별 표 영역 분석
function categoryBands(canvas,frontTsv){
const W=canvas.width;
const H=canvas.height;
const ls=lineGroups(wordsFrom(frontTsv));

const top=ls.filter(l=>
/안전진단|진단항목|앞바퀴\s*정렬/.test(l.s)&&
l.y/H>.17&&l.y/H<.42
).map(l=>l.y/H);

const bottom=ls.filter(l=>
/다음장에\s*계속|속도계\s*오차/.test(l.s)&&
l.y/H>.70
).map(l=>l.y/H);

const start=top.length
?Math.max(.17,Math.min(...top)-.015)
:.255;

const end=bottom.length
?Math.min(.96,Math.max(...bottom)+.05)
:.925;

const raw=findMainLines(canvas).filter(y=>
y>start+.035&&
y<end-.025
);

const main=raw.filter((y,i)=>
i===0||y-raw[i-1]>.023
);

if(main.length===5){
const b=[start,...main,end];

if(b.every((v,i)=>
i===0||v>b[i-1]+.018
)){
return b;
}
}

// 표 경계 검출 실패 시 보조 영역 사용
const ratios=[
0,.125,.18,.505,.67,.895,1
];

return ratios.map(r=>
start+(end-start)*r
);
}

async function recognize(
worker,
canvas,
mode='3',
tsv=false
){
await worker.setParameters({
tessedit_pageseg_mode:mode
});

return worker.recognize(
canvas,
{},
tsv?{tsv:true}:{}
);
}

async function analyze(){
if(busy)return;

const f=$('front').files[0];
const b=$('back').files[0];

if(!f||!b){
$('progress').textContent=
'앞면과 뒷면 사진을 모두 선택해 주세요.';
return;
}

if(!window.Tesseract){
$('progress').textContent=
'문자인식 기능을 불러오지 못했습니다. 인터넷을 확인해 주세요.';
return;
}

busy=true;
$('run').disabled=true;

let worker;

try{
$('progress').textContent=
'한국어 문자 인식 준비 중…';

worker=await Tesseract.createWorker(
'kor+eng',
1,
{
logger:m=>{
if(m.status==='recognizing text'){
$('progress').textContent=
`사진 분석 중… ${Math.round((m.progress||0)*100)}%`;
}
}
}
);

const fc=await loadCanvas(f);
const bc=await loadCanvas(b);

// 앞면 전체 OCR
$('progress').textContent=
'앞면 전체 판독 중…';

const fr=await recognize(
worker,fc,'3',true
);

frontText=fr.data.text||'';

// 앞면 날짜 자동 재인식
$('progress').textContent=
'앞면 날짜 자동 확인 중…';

dateReads=[];

for(const reg of dateRegions(fc,fr.data.tsv)){
const c=crop(fc,...reg,1.9,false);
const a=await recognize(worker,c,'6');

dateReads.push(a.data.text||'');

if(
!labelledDates(frontText,'fail').length&&
!labelledDates(frontText,'pass').length
){
const z=await recognize(
worker,
crop(fc,...reg,1.9,true),
'6'
);

dateReads.push(z.data.text||'');
}
}

// 앞면 검사 항목 6개 분석
$('progress').textContent=
'앞면 검사 항목 6개 분석 중…';

categoryReads=Array.from(
{length:6},()=>[]
);

const bands=categoryBands(
fc,fr.data.tsv
);

for(let i=0;i<6;i++){
const y=bands[i];
const height=bands[i+1]-y;

if(height<=.012)continue;

const c=crop(
fc,
.68,
Math.max(0,y+.004),
.23,
Math.max(.012,height-.008),
2,
true
);

const r=await recognize(
worker,c,'6'
);

const s=r.data.text||'';
const lines=s.split(/\r?\n/).filter(Boolean);

const matches=lines.filter(l=>
cats[i].re.test(l)
);

const state=matches.length
?resultWord(matches.join(' '))
:resultWord(s);

categoryReads[i].push(state);
}

// 뒷면 전체 OCR
$('progress').textContent=
'뒷면 최종판정 및 부적합 사유 판독 중…';

const br=await recognize(
worker,bc,'3',true
);

backText=br.data.text||'';
faultReads=[];

// 부적합 목록 자동 영역 분석
const backLines=lineGroups(
wordsFrom(br.data.tsv)
);

const markers=backLines.filter(l=>
/부\s*적\s*합/.test(l.s)&&
l.y/bc.height>.35&&
l.y/bc.height<.8
);

const faultRegions=markers.map(l=>[
.18,
Math.max(.28,(l.y-16)/bc.height),
.74,
Math.min(.09,(l.h+90)/bc.height)
]);

faultRegions.push(
[.19,.53,.64,.03],
[.17,.505,.76,.095],
[.17,.47,.76,.16]
);

for(const reg of faultRegions.slice(0,4)){
const c=crop(
bc,...reg,2,true
);

const r=await recognize(
worker,c,'6'
);

faultReads.push(r.data.text||'');

if(reg[3]<.05){
const r2=await recognize(
worker,
crop(bc,...reg,2,false),
'11'
);

faultReads.push(r2.data.text||'');
}
}

// 센서 진단 결과 재확인
if(sensorState(backText)==='unread'){
const r=await recognize(
worker,
crop(
bc,.46,.205,.43,.12,2,true
),
'6'
);

backText+='\n'+(r.data.text||'');
}

// 이전 수정값 초기화
manualDate='';
manualStates=Array(7).fill('auto');

$('dateEdit').value='';

document.querySelectorAll(
'[data-manual]'
).forEach(e=>{
e.value='auto';
});

$('frontOcr').value=
frontText+
'\n\n[날짜 자동 재인식]\n'+
dateReads.join('\n');

$('backOcr').value=
backText+
'\n\n[부적합 목록 자동 재인식]\n'+
faultReads.join('\n');

current=parse();
render();

$('progress').textContent=
'자동 분석 완료. 판독 불가 항목은 원본과 비교해 주세요.';

$('result').scrollIntoView({
behavior:'smooth'
});

}catch(e){
$('progress').textContent=
'분석 오류: '+(e.message||e);

}finally{
if(worker){
await worker.terminate().catch(()=>{});
}

busy=false;
$('run').disabled=false;
}
}

function apply(){
const raw=$('dateEdit').value.trim();

if(
raw&&(
!/^20\d{2}\.\d{2}\.\d{2}$/.test(raw)||
datesIn(raw)[0]!==raw
)
){
$('progress').textContent=
'날짜는 원본 확인 후 YYYY.MM.DD 형식으로 입력해 주세요.';
return;
}

manualDate=raw;
frontText=$('frontOcr').value;
backText=$('backOcr').value;

dateReads=[];
faultReads=[];
categoryReads=Array.from(
{length:6},()=>[]
);

document.querySelectorAll(
'[data-manual]'
).forEach(e=>{
manualStates[+e.dataset.manual]=e.value;
});

current=parse();
render();

$('progress').textContent=
'원본 확인 수정 내용이 적용되었습니다.';
}

// 검사원 확인용 항목
for(let i=0;i<7;i++){
const row=create('div','edit-row');

row.append(
create('span','',cats[i].names[0])
);

const s=create('select');
s.dataset.manual=i;

for(const [value,label] of [
['auto','자동 판독'],
['good','원본 확인: 양호'],
['need','원본 확인: 점검요'],
['unread','판독 불가']
]){
const o=create('option','',label);
o.value=value;
s.append(o);
}

row.append(s);
$('manualStates').append(row);
}

// 이벤트 연결
$('lang').addEventListener(
'change',render
);

$('front').addEventListener(
'change',()=>preview('front')
);

$('back').addEventListener(
'change',()=>preview('back')
);

$('run').addEventListener(
'click',analyze
);

$('apply').addEventListener(
'click',apply
);

</script>
