
<!doctype html>

<style>

<body>

<header>
<h1>자동차검사 결과 안내</h1>
<p>Vehicle Inspection Result</p>
</header>

<main>

<section class="card">
<h2>① 언어 / Language</h2>
<select id="lang">
<option value="ko">한국어</option>
<option value="en">English</option>
<option value="zh">中文</option>
<option value="vi">Tiếng Việt</option>
</select>
</section>

<section class="card">
<h2>② 진단서 사진 / Photos</h2>

<label class="upload">

<input id="front" type="file" accept="image/*">
</label>
<img id="frontPic" class="preview" alt="앞면 사진">

<label class="upload">
📷 뒷면 (부적합·종합진단 결과)
<input id="back" type="file" accept="image/*">
</label>
<img id="backPic" class="preview" alt="뒷면 사진">

<p class="hint">
글씨가 정면으로 선명하게 나오게 찍어 주세요.
고객정보를 가린 시험용 문서만 사용해 주세요.
</p>
</section>

<section class="card">
<h2>③ 진단서 분석</h2>
<button type="button" id="run" onclick="analyze()">
진단서 분석하기
</button>
<p id="progress" class="progress" role="status">
앞면과 뒷면을 선택하세요.
</p>
</section>

<section class="card" id="result">
<h2 id="resultLabel">검사 결과</h2>
<div id="hero"></div>

<h2 id="groupLabel">검사 항목</h2>
<table>
<tbody id="groupRows"></tbody>
</table>
<p id="unclearNote" class="hint"></p>

<h2 id="faultLabel" style="margin-top:26px">
종합진단 결과
</h2>
<div id="faultList"></div>

<div class="notice" id="notice"></div>

<details>
<summary>OCR 인식 문구 확인 및 수정</summary>
<p class="hint">
OCR 글자가 틀렸을 때 원본을 보면서 직접
수정하고 '수정내용 적용'을 누르세요.
잘못 읽힌 날짜나 고장 문구를 임의로
보정하지 않습니다.
</p>

<p>앞면 OCR</p>
<textarea id="frontText"></textarea>

<p>뒷면 OCR</p>
<textarea id="backText"></textarea>

<button type="button" onclick="applyText()">
수정내용 적용하기
</button>
</details>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';

const $=id=>document.getElementById(id);
const langOrder=['ko','en','zh','vi'];

const words={
ko:{
result:'최종 검사 결과',
pass:'적합',
fail:'부적합',
unknown:'판정 확인 필요',

good:'양호',
need:'점검요',
unread:'판독 불가',
fault:'종합진단 결과',
none:'이상 없음',
unreadFault:'부적합 문구를 정확히 읽지 못했습니다. 원본 확인 필요',

},
en:{
result:'Vehicle Inspection Result',
pass:'PASS',
fail:'FAIL',

good:'Good',

none:'No issues found',
unreadFault:'Defect details not reliably recognized. Check the original report.',
unknownFault:'Check the original Korean text before translation',
notice:'OCR demo. Verify the result, dates and defect descriptions against the original Korean report.',
unclear:'Not verified = the original status could not be read.'
},
zh:{
result:'车辆检测结果',
pass:'合格',
fail:'不合格',
unknown:'结果需核对',
next:'下次检测日期',
deadline:'复检截止日期',
dateUnknown:'请核对原件日期',
groups:'检测项目',
good:'良好',
need:'需要检查',
unread:'无法确认',
fault:'综合诊断结果',
none:'无异常',
unreadFault:'未能准确识别不合格内容，请核对原件',
unknownFault:'请核对韩语原文后再翻译',
notice:'仅供OCR测试，请核对原始检测报告。',
unclear:'无法确认＝尚未识别出明确结果。'
},
vi:{
result:'Kết quả kiểm định xe',
pass:'ĐẠT',
fail:'KHÔNG ĐẠT',
unknown:'CẦN XÁC MINH',
next:'Ngày kiểm định tiếp theo',
deadline:'Hạn kiểm định lại',
dateUnknown:'Kiểm tra ngày trên bản gốc',
groups:'Các hạng mục kiểm định',
good:'Tốt',
need:'Cần kiểm tra',
unread:'Chưa xác minh',
fault:'Kết quả chẩn đoán tổng hợp',
none:'Không có bất thường',
unreadFault:'Không đọc rõ nội dung không đạt. Hãy kiểm tra giấy gốc.',
unknownFault:'Đối chiếu tiếng Hàn trước khi dịch',
notice:'Chỉ dùng thử OCR. Đối chiếu kết quả, ngày và lỗi với giấy gốc.',
unclear:'Chưa xác minh = chưa đọc được trạng thái gốc.'
}
};

const groups=[
{
names:['조향계통','Steering System','转向系统','Hệ thống lái'],
re:/조향\s*계통/
},
{
names:['주행계통','Driving System','行驶系统','Hệ thống vận hành'],
re:/주행\s*계통/
},
{
names:['제동계통','Braking System','制动系统','Hệ thống phanh'],
re:/제동\s*계통/
},
{
names:['등화장치','Lighting','灯光装置','Hệ thống đèn'],
re:/등화\s*장치|전조등|제동등|안개등|방향지시등/
},
{
names:['배출가스','Emissions','尾气排放','Khí thải'],
re:/배출\s*가스/
},
{
names:['계기계통','Instrument System','仪表系统','Hệ thống đồng hồ'],
re:/계기\s*계통/
},
{
names:[
'자가진단 센서 점검',
'Self-Diagnostic Sensor Check',
'自诊断传感器检查',
'Kiểm tra cảm biến tự chẩn đoán'
],
re:/자가?\s*진단\s*센서|전자\s*제어\s*센서|OBD/
}
];

/*
정확히 확인된 용어만 번역한다.
원문에 없는 고장 원인이나 수리 방법은 추가하지 않는다.
*/
const translations=[
{
re:/^물품\s*적재\s*장치\s*임의\s*변경$/,
t:[
'물품적재장치 임의변경',
'Unauthorized modification of cargo-loading equipment',
'擅自改装载货装置',
'Tự ý thay đổi thiết bị chở hàng'
]
},
{
re:/^등화\s*장치\s*임의\s*변경$/,
t:[
'등화장치 임의변경',
'Unauthorized modification of lighting equipment',
'擅自改装灯光装置',
'Tự ý thay đổi hệ thống đèn'
]
},
{
re:/^활어\s*운반\s*장치\s*임의\s*설치$/,
t:[
'활어운반장치 임의 설치',
'Unauthorized installation of live-fish transport equipment',
'擅自安装活鱼运输装置',
'Tự ý lắp thiết bị vận chuyển cá sống'
]
},
{
re:/^안개등\s*임의\s*변경$/,
t:[
'안개등 임의변경',
'Unauthorized modification of fog lights',
'擅自改装雾灯',
'Tự ý thay đổi đèn sương mù'
]
},
{
re:/^전조등\s*광도\s*미달$/,
t:[
'전조등 광도 미달',
'Headlight intensity below standard',
'前照灯亮度低于标准',
'Cường độ đèn pha dưới mức quy định'
]
},
{
re:/^전조등\s*점등\s*불량$/,
t:[
'전조등 점등 불량',
'Headlight malfunction',
'前照灯不亮或工作异常',
'Đèn pha hoạt động không đúng'
]
}
];

let current=null;
let working=false;

function progress(s){
$('progress').textContent=s;
}

function norm(s){
return s.replace(/[\s·:：<>\[\](){}]/g,'');
}

/* 날짜는 원본에 실제 있는 값만 인식 */
function dateTokens(text){
const re=/(20\d{2})\s*[년.\/-]\s*(\d{1,2})\s*[월.\/-]\s*(\d{1,2})\s*일?/g;
let match,arr=[];

while((match=re.exec(text))){
const y=+match[1],m=+match[2],d=+match[3];
const dt=new Date(y,m-1,d);

if(
dt.getFullYear()===y &&
dt.getMonth()===m-1 &&
dt.getDate()===d
){
arr.push(
`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`
);
}
}
return [...new Set(arr)];
}

/* 최종 검사 판정 */
function findDecision(front,back){
for(const text of [front,back]){
const lines=text.split(/\n/);

for(let i=0;i<lines.length;i++){
if(!/(최종\s*판정|검사\s*결과\s*[:：])/i.test(lines[i])){
continue;
}

const v=norm(lines.slice(i,i+2).join(' ')).slice(0,55);

if(/부적합|불합격/.test(v))return 'fail';
if(/적합|합격/.test(v))return 'pass';
}
}
return 'unknown';
}

/* 앞면 재검사 기한 / 다음 검사일 구분 */
function findDate(front,kind){
const lines=front.split(/\n/);

const key=kind==='fail'
?/재\s*검\s*사\s*(기\s*간|기\s*한)/
:/다\s*음\s*검\s*사\s*(일|날\s*짜)|차\s*기\s*검\s*사/;

for(let i=0;i<lines.length;i++){
if(!key.test(lines[i]))continue;

const near=lines.slice(
i,Math.min(lines.length,i+2)
).join(' ');

const ds=dateTokens(near);

if(ds.length===1)return ds[0];
}
return null;
}

/*
뒷장 <부적합> 목록을 가장 먼저 찾는다.
종합진단 결과의 긴 설명문과 구분한다.
*/
function extractFaultSection(back){
const lines=back.split(/\r?\n/);
let start=-1;

for(let i=0;i<lines.length;i++){
const n=norm(lines[i]);

if(
/^부적합$/.test(n) ||
/^부적합[^가-힣]/.test(n)
){
start=i;
break;
}
}

if(start<0){
return {found:false,body:''};
}

let end=lines.length;

for(let j=start+1;j<Math.min(lines.length,start+18);j++){
if(
/종합\s*의\s*견|종합\s*진\s*단\s*결\s*과|<\s*리콜/.test(lines[j])
){
end=j;
break;
}
}

return {
found:true,
body:lines.slice(start+1,end).join(' ').trim()
};
}

/* 쉼표로 구분된 부적합 목록 */
function faultItems(sec){
if(!sec.found || !sec.body)return [];

let s=sec.body.replace(/^[\s:：|-]+/,'');
const parts=s.split(/[,，]\s*/)
.map(x=>x.replace(/^[\s:：;|-]+|[\s:：;|-]+$/g,'').trim())
.filter(Boolean);

return parts.slice(0,12);
}

function cleanItem(s){
return s
.replace(/^\(?\d+\)?[.)]\s*/,'')
.replace(/^기타\s*[\[（(]\s*/,'')
.replace(/[\]）)]\s*$/,'')
.trim();
}

/* 등록된 부적합 용어만 번역 */
function translateItem(s){
const pure=cleanItem(s);

for(const pair of translations){
if(pair.re.test(pure))return pair.t;
}
return null;
}

/* 7개 계통: 명확한 진단의견만 양호/점검요 */
function groupStates(front,back,items){
const st=groups.map(()=> 'unread');
const lines=front.split(/\n/).map(x=>x.trim());

for(let i=0;i<groups.length;i++){
const g=groups[i];

for(let j=0;j<lines.length;j++){
if(!g.re.test(lines[j]))continue;

const match=lines[j].match(g.re);
if(!match)continue;

const fragment=lines[j].slice(
match.index,match.index+55
);

if(/점검\s*요|불량|부적합|결함/.test(fragment)){
st[i]='need';
}else if(
/양\s*호|정\s*상|이상\s*없음/.test(fragment) &&
st[i]!=='need'
){
st[i]='good';
}
}
}

/* 뒷장에 확실하게 명시된 부적합만 반영 */
for(const item of items){
const raw=norm(item);

if(
/전조등|등화장치|제동등|안개등|후미등|방향지시등/.test(raw)
)st[3]='need';

if(/조향장치|조향계통/.test(raw))st[0]='need';

if(/브레이크|제동계통|제동력/.test(raw))st[2]='need';

if(/배출가스|매연|일산화탄소/.test(raw))st[4]='need';

if(/계기계통|속도계/.test(raw))st[5]='need';

if(/자가진단|전자제어센서|OBD/.test(raw))st[6]='need';

if(/타이어|주행계통/.test(raw))st[1]='need';
}

return st;
}

/* 전체 인식 문구 정리 */
function parse(front,back){
const decision=findDecision(front,back);
const sec=extractFaultSection(back);
const items=faultItems(sec);

return {
decision,
date:decision==='unknown'
?null:findDate(front,decision),
states:groupStates(front,back,items),
items,
sectionFound:sec.found
};
}

function div(className,text){
const n=document.createElement('div');
if(className)n.className=className;
if(text!==undefined)n.textContent=text;
return n;
}

/* 화면 출력 */
function render(){
if(!current)return;

const lang=$('lang').value;
const t=words[lang];
const li=langOrder.indexOf(lang);

$('resultLabel').textContent=t.result;
$('groupLabel').textContent=t.groups;
$('faultLabel').textContent=t.fault;
$('unclearNote').textContent=t.unclear;
$('notice').textContent=t.notice;

const h=$('hero');
h.replaceChildren();

const d=current.decision;

const hero=div(
'hero '+(
d==='pass'?'pass':
d==='fail'?'fail':'unknown'
)
);

const state=div(
'',
d==='pass'?t.pass:
d==='fail'?t.fail:t.unknown
);

state.style.cssText='font-size:39px;font-weight:800';
hero.append(state);

if(d!=='unknown'){
hero.append(div(
'label',
d==='pass'?t.next:t.deadline
));
hero.append(div(
'date',
current.date||t.dateUnknown
));
}

h.append(hero);

const rows=$('groupRows');
rows.replaceChildren();

current.states.forEach((s,i)=>{
const tr=document.createElement('tr');
const n=document.createElement('td');
n.textContent=groups[i].names[li];

const v=document.createElement('td');
v.className=
s==='good'?'ok':
s==='need'?'bad':'unclear';

v.textContent=
s==='good'?t.good:
s==='need'?t.need:t.unread;

tr.append(n,v);
rows.append(tr);
});

/* 맨 아래 종합진단 결과 */
const box=$('faultList');
box.replaceChildren();

if(current.items.length){

current.items.forEach(raw=>{
const translated=translateItem(raw);
const item=div('fault');

item.append(div(
'translated',
translated?translated[li]:t.unknownFault
));

item.append(div('original',raw));
box.append(item);
});

}else if(
d==='pass' &&
current.sectionFound
){
box.append(div('large-ok',t.none));

}else{
box.append(div(
'no-read',
d==='fail'?t.unreadFault:
d==='pass'?t.unknownFault:
t.unreadFault
));
}

$('result').style.display='block';
}

/* OCR 문구를 사용자가 수정했을 때 */
function applyText(){
const front=$('frontText').value;
const back=$('backText').value;

current=parse(front,back);
render();

progress(
'수정된 OCR 문구를 적용했습니다. 원본과 대조하세요.'
);
}

$('lang').addEventListener('change',render);

/* 사진 미리보기 */
for(const id of ['front','back']){
$(id).addEventListener('change',()=>{
const file=$(id).files[0];
const preview=$(
id==='front'?'frontPic':'backPic'
);

if(preview.dataset.url){
URL.revokeObjectURL(preview.dataset.url);
}

if(file){
const u=URL.createObjectURL(file);
preview.dataset.url=u;
preview.src=u;
preview.style.display='block';

progress(
'사진 선택 완료. 분석 버튼을 눌러 주세요.'
);
}
});
}

/* OCR용 이미지 준비 */
function imageFromFile(file){
return new Promise((resolve,reject)=>{
const img=new Image();
const u=URL.createObjectURL(file);

img.onload=()=>{
const ratio=Math.min(
2,
2300/img.width,
3100/img.height
);

const c=document.createElement('canvas');
c.width=Math.max(
1,Math.round(img.width*ratio)
);
c.height=Math.max(
1,Math.round(img.height*ratio)
);

c.getContext('2d').drawImage(
img,0,0,c.width,c.height
);

URL.revokeObjectURL(u);
resolve(c);
};

img.onerror=()=>{
URL.revokeObjectURL(u);
reject(Error(
'사진을 열 수 없습니다. JPG 또는 PNG를 사용해 주세요.'
));
};

img.src=u;
});
}

/* 중요 부분 확대 인식 */
function region(canvas,y,height){
const c=document.createElement('canvas');
c.width=canvas.width;
c.height=Math.max(
1,Math.round(canvas.height*height)
);

c.getContext('2d').drawImage(
canvas,
0,canvas.height*y,
canvas.width,canvas.height*height,
0,0,c.width,c.height
);

return c;
}

/* 분석 버튼 */
async function analyze(){

progress('버튼 작동 확인!');

if(working)return;

const f=$('front').files[0];
const b=$('back').files[0];

if(!f||!b){
progress('앞면과 뒷면 사진을 모두 선택해 주세요.');
return;
}

if(!window.Tesseract){
progress(
'OCR 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'
);
return;
}

working=true;
$('run').disabled=true;
let worker=null;

try{
progress('한글 OCR 준비 중...');

worker=await Tesseract.createWorker(
'kor+eng',1,{
logger:m=>{
if(m.status==='recognizing text'){
progress(
'글자 인식 중 '+
Math.round((m.progress||0)*100)+'%'
);
}
}
}
);

progress('앞면 인식 중...');
const fc=await imageFromFile(f);
let front=(await worker.recognize(fc)).data.text;

progress('뒷면 인식 중...');
const bc=await imageFromFile(b);
let back=(await worker.recognize(bc)).data.text;

/* 앞면 날짜 부분 추가 인식 */
if(
findDecision(front,'')==='unknown' ||
!findDate(
front,
findDecision(front,back)==='pass'?'pass':'fail'
)
){
progress('앞면 날짜 부분 확대 인식 중...');

const extra=(
await worker.recognize(
region(fc,.08,.38)
)
).data.text;

front+='\n'+extra;
}

/* 뒷면 부적합 부분 추가 인식 */
if(!extractFaultSection(back).found){
progress('뒷면 부적합 부분 확대 인식 중...');

const extra=(
await worker.recognize(
region(bc,.35,.53)
)
).data.text;

back+='\n'+extra;
}

/* 인식 결과 저장 및 화면 반영 */
$('frontText').value=front;
$('backText').value=back;

current=parse(front,back);
render();

progress(
'분석 완료. 원본 진단서와 반드시 확인해 주세요.'
);

$('result').scrollIntoView({
behavior:'smooth'
});

}catch(error){
progress('분석 오류: '+error.message);

}finally{
if(worker){
try{
await worker.terminate();
}catch(e){}
}

working=false;
$('run').disabled=false;
}
}
</script>
