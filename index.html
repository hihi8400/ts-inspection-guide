<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
'use strict';

const $=id=>document.getElementById(id);

const T={

},

},

findings:'Kết quả chẩn đoán — Hạng mục không đạt',
missing:'Không đọc rõ danh sách lỗi. Kiểm tra bản gốc.',
verify:'Đối chiếu bản gốc tiếng Hàn — chưa dịch',
warn:'OCR có thể sai. Không tự tạo kết luận, ngày hoặc lỗi.',
partial:'Có thể còn thiếu lỗi. Kiểm tra bản gốc.',
none:'Không có lỗi được liệt kê'
}
};

const cats=[
{
names:['조향계통','Steering System','转向系统','Hệ thống lái'],
re:/조향\s*계[통동]/
},
{
names:['주행계통','Driving System','行驶系统','Hệ thống vận hành'],
re:/주행\s*계[통동]/
},
{
names:['제동계통','Braking System','制动系统','Hệ thống phanh'],
re:/제동\s*계[통동]/
},
{
names:['등화장치','Lighting','灯光装置','Hệ thống đèn'],
re:/등[화하]\s*장치/
},
{
names:['배출가스','Emissions','尾气排放','Khí thải'],
re:/배출\s*가스/
},
{
names:['계기계통','Instrument System','仪表系统','Hệ thống đồng hồ'],
re:/계기\s*계[통동]/
},
{
names:['자가진단 센서 점검','Self-Diagnostic Sensor Check','自诊断传感器检查','Kiểm tra cảm biến tự chẩn đoán'],
re:/전자\s*제어\s*센서|자가\s*진단\s*센서/
}
];

const dict=[
[
/^등화장치임의변경$/,
[
'등화장치 임의변경',
'Unauthorized modification of lighting equipment',
'擅自改装灯光装置',
'Tự ý thay đổi hệ thống đèn'
]
],
[
/^물품적재장치임의변경$/,
[
'물품적재장치 임의변경',
'Unauthorized modification of cargo-loading equipment',
'擅自改装载货装置',
'Tự ý thay đổi thiết bị chở hàng'
]
],
[
/^안개등LED$/i,
[
'안개등 LED',
'Fog lamp LED',
'雾灯 LED',
'Đèn sương mù LED'
]
],
[
/^활어운반장치임의설치$/,
[
'활어운반장치 임의 설치',
'Unauthorized installation of live-fish transport equipment',
'擅自安装活鱼运输装置',
'Tự ý lắp đặt thiết bị vận chuyển cá sống'
]
]
];

const compact=s=>String(s||'').replace(/[\s<>〈〉\[\]【】(){}|:：,，.·\-]/g,'');
const unique=a=>[...new Set(a)];

function validDate(y,m,d){
y=+y;
m=+m;
d=+d;

const v=new Date(y,m-1,d);

return y>=2020&&y<=2099&&
v.getFullYear()===y&&
v.getMonth()===m-1&&
v.getDate()===d
?`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`
:null;
}

// 숫자는 임의로 보정하지 않는다.
// '2027변 02월 26밀'처럼 한글 단위만 잘못 읽힌 경우 허용.
function readDates(text){
const s=String(text||'');
const out=[];

for(const m of s.matchAll(
/(20\d{2})[^\d]{0,9}(\d{1,2})[^\d]{0,9}(\d{1,2})(?!\d)/g
)){
const d=validDate(m[1],m[2],m[3]);
if(d)out.push(d);
}

for(const m of s.matchAll(
/(?<!\d)(20\d{2})(\d{2})(\d{2})(?!\d)/g
)){
const d=validDate(m[1],m[2],m[3]);
if(d)out.push(d);
}

return unique(out);
}

function dateFromLabel(text,kind){
const lines=String(text||'').split(/\r?\n/);

const label=kind==='fail'
?/재\s*검\s*사\s*(?:기\s*[간한]|기간|기한)/
:/다\s*음\s*검\s*사\s*(?:일|날짜|기\s*간)/;

const found=[];

for(let i=0;i<lines.length;i++){
const m=label.exec(lines[i]);
if(!m)continue;

const rest=lines[i].slice(m.index+m[0].length);

found.push(...readDates(rest));

if(i+1<lines.length){
found.push(...readDates(lines[i+1].slice(0,90)));
}
}

return unique(found);
}

// 최종판정 상자와 전체 OCR을 독립적으로 확인
function decision(front,back,decisionCrops){
const v=[];

for(const text of [back,front]){
const s=String(text||'').replace(/\s+/g,'');

for(const m of s.matchAll(
/최종판[정청][：:]?(부적합|부적함|적합|불합격|합격)/g
)){
v.push(/^(부|불)/.test(m[1])?'fail':'pass');
}
}

for(const text of decisionCrops){
const s=String(text||'').replace(/\s+/g,'');

if(/부적합|부적함|불합격/.test(s)){
v.push('fail');
}else if(/(?<!부)적합|합격/.test(s)){
v.push('pass');
}
}

return unique(v).length===1?v[0]:'unknown';
}

// 날짜는 최종판정 OCR 성공 여부와 별도로 판독
function decideDate(front,reads,status,manual){
if(manual)return {value:manual,kind:status};

const fail=dateFromLabel(front,'fail');
const pass=dateFromLabel(front,'pass');

const strong={
fail:[...fail],
pass:[...pass]
};

const cell=[];

for(const r of reads){
const ds=readDates(r.text);

if(r.kind==='fail'&&r.source==='label'){
strong.fail.push(...ds);
}

if(r.kind==='pass'&&r.source==='label'){
strong.pass.push(...ds);
}

if(r.source==='cell'){
cell.push(...ds);
}

if(r.source==='context'&&/까\s*지/.test(r.text)){
strong.fail.push(...ds);
}
}

let kind=status;

if(kind==='unknown'){
if(strong.fail.length&&!strong.pass.length){
kind='fail';
}else if(strong.pass.length&&!strong.fail.length){
kind='pass';
}
}

if(kind==='unknown'){
return {value:null,kind:'unknown'};
}

const labelled=unique(strong[kind]);

if(labelled.length>1){
return {value:null,kind};
}

if(labelled.length===1){
return {value:labelled[0],kind};
}

// 재검사 날짜 전용 칸을 읽은 경우에만
// 라벨이 누락되어도 해당 칸의 날짜를 사용
if(kind==='fail'){
const a=unique(cell);

return {
value:a.length===1?a[0]:null,
kind
};
}

return {value:null,kind};
}

function resultWord(s){
const a=String(s||'').replace(/\s+/g,'');

const good=/양호|정상|이상없음/.test(a);
const bad=/점검요|점검필요|불량|부적합/.test(a);

return good&&!bad
?'good'
:bad&&!good
?'need'
:'unread';
}

function textStates(text){
const lines=String(text||'').split(/\r?\n/);
const out=Array(6).fill('unread');

for(let i=0;i<6;i++){
const v=[];

for(let j=0;j<lines.length;j++){
const m=cats[i].re.exec(lines[j]);
if(!m)continue;

const rest=lines[j].slice(m.index+m[0].length);
let state=resultWord(rest);

if(
state==='unread'&&
j+1<lines.length&&
!cats.slice(0,6).some(c=>c.re.test(lines[j+1]))
){
state=resultWord(rest+' '+lines[j+1]);
}

if(state!=='unread'){
v.push(state);
}
}

if(unique(v).length===1&&v.length){
out[i]=v[0];
}
}

return out;
}

function sensorState(s){
const a=String(s||'').replace(/\s+/g,'');

const m=a.match(
/(?:전자제어센서|센서진단)(?:진단)?결과.{0,38}?(정상|양호|이상없음|점검요|불량)/
);

return m?resultWord(m[1]):'unread';
}

function mergeStates(front,back,parts){
const out=textStates(front);

for(let i=0;i<6;i++){
const a=unique(parts[i].filter(x=>x!=='unread'));

if(a.length===1){
if(out[i]==='unread'){
out[i]=a[0];
}else if(out[i]!==a[0]){
out[i]='unread';
}
}
}

out.push(sensorState(back));
return out;
}

function cleanFault(s){
s=String(s||'')
.replace(/^[^가-힣]+/,'')
.trim();

if(/^기타\s*[\[［(（【]/.test(s)){
const m=s.match(
/^기타\s*[\[［(（【][^\]］)）】\n]{2,80}[\]］)）】]/
);

return m?m[0].trim():'';
}

return s.replace(/[;:：.]+$/,'').trim();
}

function plausible(s){
return s.length>=4&&
s.length<=90&&
/[가-힣]/.test(s)&&
!/검사소|자동차관리법|원상복구|조치를|하시기|진단결과|정비하여|과태료|고객님|합니다|바랍니다/.test(s)&&
/임의\s*(?:변경|설치)|^기타\s*[\[［(（【]|불량|미달|파손|누유|초과|부식|손상|미점등|작동불량/.test(s);
}

function splitFaults(s){
const out=[];
let part='';
let depth=0;

for(const ch of String(s)){
if('[［(（【'.includes(ch))depth++;
if(']］)）】'.includes(ch))depth=Math.max(0,depth-1);

if(
(ch===','||ch==='，'||ch==='\n')&&
depth===0
){
if(part.trim())out.push(part.trim());
part='';
}else{
part+=ch;
}
}

if(part.trim())out.push(part.trim());

return out.map(cleanFault).filter(plausible);
}

function faultBlocks(text,isolated=false){
const lines=String(text||'').split(/\r?\n/);
const blocks=[];

for(let i=0;i<lines.length;i++){
const m=lines[i].match(
/[<〈\[]?\s*부\s*적\s*[합함]\s*[>〉\]]/
);

if(!m&&!isolated)continue;

if(
!m&&
!(
/임의\s*(?:변경|설치)/.test(lines[i])&&
/기타\s*[\[［(（【]|[,，]/.test(lines[i])
)
)continue;

let s=m
?lines[i].slice(m.index+m[0].length)
:lines[i];

for(let j=i+1;j<Math.min(i+4,lines.length);j++){
if(
/종\s*합\s*의\s*견|\[\s*1\s*\]|최종\s*판정/.test(lines[j])
)break;

s+='\n'+lines[j];
}

s=s.split(/종\s*합\s*의\s*견|\[\s*1\s*\]/)[0];

const v=splitFaults(s);

if(v.length)blocks.push(v);
}

return blocks;
}

function extractFaults(back,crops){
const blocks=[
...faultBlocks(back),
...crops.flatMap(x=>faultBlocks(x,true))
];

const quality=s=>
dict.some(([r])=>
r.test(compact(s).replace(/^기타/,''))
)?7:2;

blocks.sort((a,b)=>
b.reduce((n,s)=>n+quality(s)+2,0)-
a.reduce((n,s)=>n+quality(s)+2,0)
);

const out=[];
const seen=new Set();

for(const s of blocks[0]||[]){
const k=compact(s);

if(!seen.has(k)){
seen.add(k);
out.push(s);
}
}

return out;
}

function faultCount(s){
const a=[
...String(s).matchAll(
/(?:상기|위)\s*\(?\s*([1-9])\s*\)?\s*건|\(\s*([1-9])\s*\)\s*건/g
)
].map(m=>+(m[1]||m[2]));

return unique(a).length===1?a[0]:null;
}

function translateFault(s){
const k=compact(s).replace(/^기타/,'');
return dict.find(([r])=>r.test(k))?.[1]||null;
}

function el(tag,cls,txt){
const x=document.createElement(tag);
if(cls)x.className=cls;
if(txt!==undefined)x.textContent=txt;
return x;
}

let frontText='';
let backText='';
let dateReads=[];
let statusReads=[];
let faultReads=[];
let partStates=Array.from({length:6},()=>[]);
let manualDate='';
let manualStates=Array(7).fill('auto');
let current=null;
let busy=false;

function parse(){
const status=decision(
frontText,
backText,
statusReads
);

const d=decideDate(
frontText,
dateReads,
status,
manualDate
);

const states=mergeStates(
frontText,
backText,
partStates
);

manualStates.forEach((s,i)=>{
if(s!=='auto')states[i]=s;
});

return {
status,
date:d.value,
dateKind:d.kind,
states,
faults:extractFaults(backText,faultReads),
expected:faultCount(backText)
};
}

if(!current)return;

const lang=$('lang').value;
const idx=['ko','en','zh','vi'].indexOf(lang);
const t=T[lang];

$('resultTitle').textContent=t.title;
$('itemTitle').textContent=t.items;
$('findingTitle').textContent=t.findings;
$('itemHelp').textContent=t.help;
$('warn').textContent=t.warn;

const hero=el(
'div',
'hero '+(
current.status==='fail'
?'fail'
:current.status==='pass'
?'pass'
:'unknown'
)
);

hero.append(
el(
'strong',
'',
current.status==='fail'
?t.fail
:current.status==='pass'
?t.pass
:t.unknown
)
);

if(current.dateKind!=='unknown'){
hero.append(
el(
'div',
'label',
current.dateKind==='fail'?t.deadline:t.next
)
);

hero.append(
el('div','date',current.date||t.date)
);
}

$('hero').replaceChildren(hero);
$('rows').replaceChildren();

current.states.forEach((s,i)=>{
const tr=el('tr');

tr.append(
el('td','',cats[i].names[idx]),
el(
'td',
s==='good'?'good':s==='need'?'need':'unread',

)
);

$('rows').append(tr);
});

$('findings').replaceChildren();

for(const s of current.faults){
const box=el('div','issue');
const v=translateFault(s);

box.append(

);

}

if(!current.faults.length){
$('findings').append(

)

$('faultWarning').textContent=
current.expected&&
current.expected!==current.faults.length
?t.partial+` (${current.faults.length}/${current.expected})`
:'';

function preview(id){
const img=$(id+'Img');
const file=$(id).files[0];

if(img.dataset.url){
URL.revokeObjectURL(img.dataset.url);
}

if(!file){
img.style.display='none';
return;
}

img.dataset.url=URL.createObjectURL(file);
img.src=img.dataset.url;
img.style.display='block';
}

function canvasFrom(file){
return new Promise((resolve,reject)=>{
const im=new Image();
const url=URL.createObjectURL(file);

im.onload=()=>{
const sc=Math.min(
2.2,
3000/im.width,
4000/im.height
);

const c=document.createElement('canvas');
c.width=Math.round(im.width*sc);
c.height=Math.round(im.height*sc);

c.getContext('2d').drawImage(
im,0,0,c.width,c.height
);

URL.revokeObjectURL(url);
resolve(c);
};

im.onerror=()=>{
URL.revokeObjectURL(url);
reject(Error('사진을 열 수 없습니다.'));
};

im.src=url;
});
}

function crop(c,x,y,w,h,scale=2,enhance=false){
x=Math.max(0,Math.min(.999,x));
y=Math.max(0,Math.min(.999,y));
w=Math.min(w,1-x);
h=Math.min(h,1-y);

const o=document.createElement('canvas');

o.width=Math.max(
1,
Math.round(c.width*w*scale)
);

o.height=Math.max(
1,
Math.round(c.height*h*scale)
);

const g=o.getContext('2d');

if(enhance){
g.filter='grayscale(1) contrast(1.6)';
}

g.drawImage(
c,
c.width*x,
c.height*y,
c.width*w,
c.height*h,
0,0,
o.width,
o.height
);

return o;
}

function tsvLines(tsv){
const groups=new Map();

for(const row of String(tsv||'').split(/\r?\n/).slice(1)){
const a=row.split('\t');

if(a.length<12||a[0]!=='5')continue;

const text=a.slice(11).join('\t').trim();
if(!text)continue;

const key=a.slice(1,5).join('_');

if(!groups.has(key)){
groups.set(key,[]);
}

groups.get(key).push({
text,
x:+a[6],
y:+a[7],
w:+a[8],
h:+a[9]
});
}

return [...groups.values()].map(a=>({
text:a.sort((x,y)=>x.x-y.x).map(x=>x.text).join(' '),
x:Math.min(...a.map(x=>x.x)),
y:Math.min(...a.map(x=>x.y)),
w:Math.max(...a.map(x=>x.x+x.w))-
Math.min(...a.map(x=>x.x)),
h:Math.max(...a.map(x=>x.y+x.h))-
Math.min(...a.map(x=>x.y))
})).sort((a,b)=>a.y-b.y);
}

async function ocr(worker,c,psm='6'){
await worker.setParameters({
tessedit_pageseg_mode:psm,
tessedit_char_whitelist:''
});

const r=await worker.recognize(
c,
{},
{tsv:false}
);

return r.data.text||'';
}

// 날짜 영역을 사진 내부에서 자동 분석
function dateRegions(c,tsv){
const W=c.width;
const H=c.height;
const out=[];

for(const l of tsvLines(tsv)){
if(l.y/H>.35)continue;

const s=l.text.replace(/\s+/g,'');

if(/재검사기[간한]|다음검사일/.test(s)){
const kind=/재검사/.test(s)?'fail':'pass';

out.push({
box:[
Math.max(0,(l.x-25)/W),
Math.max(0,(l.y-18)/H),
Math.min(.85,(l.w+W*.34)/W),
Math.min(.065,(l.h+36)/H)
],
kind,
source:'label'
});
}
}

// 재검사 기간이 인쇄되는 앞면 상단 표의 날짜 칸
// 날짜를 임의로 고정하지 않고 OCR로 읽는다.
out.push({
box:[.465,.198,.225,.024],
kind:'fail',
source:'cell'
});

out.push({
box:[.445,.188,.265,.043],
kind:'fail',
source:'context'
});

out.push({
box:[.31,.177,.41,.064],
kind:'fail',
source:'context'
});

out.push({
box:[.28,.162,.47,.105],
kind:'fail',
source:'context'
});

return out.slice(0,7);
}

async function readFrontDates(worker,canvas,tsv){
const out=[];

for(const region of dateRegions(canvas,tsv)){
const c=crop(
canvas,
...region.box,
2.6,
false
);

for(const mode of ['7','6']){
const text=await ocr(worker,c,mode);

out.push({
...region,
text
});
}

if(
region.source==='cell'||
region.source==='label'
){
const t=await ocr(
worker,
crop(canvas,...region.box,2.6,true),
'7'
);

out.push({
...region,
text:t
});
}
}

return out;
}

// 최종판정 전용 상자 판독
async function readDecision(worker,c){
const boxes=[
[.62,.425,.29,.043],
[.59,.435,.33,.052],
[.59,.415,.34,.075]
];

const out=[];

for(const b of boxes){
out.push(
await ocr(
worker,
crop(c,...b,2.3,true),
'6'
)
);
}

return out;
}

// 진단의견 열을 항목별로 나누어 분석
async function readCategories(worker,c){
const bands=[
[.238,.277],
[.277,.342],
[.342,.575],
[.575,.724],
[.724,.885],
[.885,.958]
];

const out=Array.from(
{length:6},
()=>[]
);

for(let i=0;i<6;i++){
const [y0,y1]=bands[i];

const a=crop(
c,
.625,
y0,
.205,
y1-y0,
2.1,
true
);

const s=await ocr(worker,a,'6');
out[i].push(resultWord(s));
}

return out;
}

// 뒷면 <부적합> 영역만 추가 판독
async function readFaultCrops(worker,c,tsv){
const regs=[];

for(const l of tsvLines(tsv)){
if(
l.y/c.height<.45||
l.y/c.height>.75
)continue;

if(/부\s*적\s*[합함]/.test(l.text)){
regs.push([
.19,
Math.max(.4,(l.y-12)/c.height),
.69,
.055
]);
}
}

regs.push(
[.20,.535,.65,.04],
[.18,.505,.72,.09],
[.18,.48,.72,.15]
);

const out=[];

for(const reg of regs.slice(0,5)){
out.push(
await ocr(
worker,
crop(c,...reg,2.1,true),
'6'
)
);
}

return out;
}

async function analyze(){
if(busy)return;

const f=$('front').files[0];
const b=$('back').files[0];

if(!f||!b){
$('progress').textContent=
'앞면과 뒷면 사진을 모두 선택해 주세요.';
return;
}

if(!window.Tesseract){
$('progress').textContent=
'OCR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';
return;
}

busy=true;
$('run').disabled=true;

let worker;

try{
$('progress').textContent=
'문자 인식 준비 중…';

worker=await Tesseract.createWorker(
'kor+eng',
1
);

const fc=await canvasFrom(f);
const bc=await canvasFrom(b);

// 앞면 전체 인식
$('progress').textContent=
'앞면 전체 판독 중…';

await worker.setParameters({
tessedit_pageseg_mode:'3'
});

const fr=await worker.recognize(
fc,
{},
{tsv:true}
);

frontText=fr.data.text||'';

// 날짜 별도 분석
$('progress').textContent=
'재검사 기간 / 다음 검사일 자동 재분석 중…';

dateReads=await readFrontDates(
worker,
fc,
fr.data.tsv
);

// 검사 항목 분석
$('progress').textContent=
'검사 항목 7개 판독 중…';

partStates=await readCategories(
worker,
fc
);

// 뒷면 전체 인식
$('progress').textContent=
'뒷면 전체 판독 중…';

await worker.setParameters({
tessedit_pageseg_mode:'3'
});

const br=await worker.recognize(
bc,
{},
{tsv:true}
);

backText=br.data.text||'';

// 최종판정 별도 확인
$('progress').textContent=
'최종판정 상자 확인 중…';

statusReads=await readDecision(
worker,
bc
);

// 부적합 사유 별도 확인
$('progress').textContent=
'부적합 항목 확인 중…';

faultReads=await readFaultCrops(
worker,
bc,
br.data.tsv
);

// 자가진단 센서
if(sensorState(backText)==='unread'){
backText+='\n'+await ocr(
worker,
crop(
bc,
.46,
.21,
.43,
.11,
2,
true
),
'6'
);
}

manualDate='';
manualStates=Array(7).fill('auto');

$('dateEdit').value='';

document.querySelectorAll(
'[data-manual]'
).forEach(x=>{
x.value='auto';
});

$('frontOcr').value=frontText;
$('backOcr').value=backText;

current=parse();
render();

$('progress').textContent=
'분석 완료. 불확실한 항목은 원본 확인이 필요합니다.';

$('result').scrollIntoView({
behavior:'smooth'
});

}catch(e){
$('progress').textContent=
'분석 오류: '+(e.message||e);

}finally{
if(worker){
await worker.terminate().catch(()=>{});
}

busy=false;
$('run').disabled=false;
}
}

function apply(){
const d=$('dateEdit').value.trim();

if(
d&&(
!/^20\d{2}\.\d{2}\.\d{2}$/.test(d)||
readDates(d)[0]!==d
)
){
$('progress').textContent=
'날짜는 YYYY.MM.DD 형식으로 입력해 주세요.';
return;
}

manualDate=d;
frontText=$('frontOcr').value;
backText=$('backOcr').value;

document.querySelectorAll(
'[data-manual]'
).forEach(x=>{
manualStates[+x.dataset.manual]=x.value;
});

current=parse();
render();

$('progress').textContent=
'원본 확인 내용이 적용되었습니다.';
}

for(let i=0;i<7;i++){
const row=el('div','edit-row');
const s=el('select');

row.append(
el('span','',cats[i].names[0])
);

s.dataset.manual=i;

for(const [v,n] of [
['auto','자동 판독'],
['good','원본 확인: 양호'],
['need','원본 확인: 점검요'],
['unread','판독 불가']
]){
const o=el('option','',n);
o.value=v;
s.append(o);
}

row.append(s);
$('manualStates').append(row);
}

$('lang').addEventListener(
'change',
render
);

$('front').addEventListener(
'change',
()=>preview('front')
);

$('back').addEventListener(
'change',
()=>preview('back')
);

$('run').addEventListener(
'click',
analyze
);

$('apply').addEventListener(
'click',
apply
);

</script>
