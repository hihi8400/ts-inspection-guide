const cats=[
{

head:/조향\s*계통/
},
{
n:['주행계통','Driving System','行驶系统','Hệ thống vận hành'],
head:/주행\s*계통/
},
{
n:['제동계통','Braking System','制动系统','Hệ thống phanh'],
head:/제동\s*계통/
},
{
n:['등화장치','Lighting System','灯光装置','Hệ thống đèn'],
head:/등화\s*장치/
},
{
n:['배출가스','Emissions','尾气排放','Khí thải'],
head:/배출\s*가스/
},
{
n:['계기계통','Instrument System','仪表系统','Hệ thống đồng hồ'],
head:/계기\s*계통/
},
{
n:[

'Self-Diagnostic Sensor Check',
'自诊断传感器检查',
'Kiểm tra cảm biến tự chẩn đoán'
],
head:/자가?\s*진단\s*센서|전자\s*제어\s*센서/
}
];

/*

원문에 없는 고장 원인이나 수리 방법은 추가하지 않는다.
*/
const dict=[
[

[

],

]
],

]
],
[

[

]

let current=null;
let working=false;
let ocrFront='';
let ocrBack='';
let verifiedDate=null;

const compact=s=>String(s||'')
.replace(/[\s·:：<>\[\](){}|]/g,'');

function message(s){
$('progress').textContent=s;
}

function preview(side){
const f=$(side).files[0];
const img=$(side+'Img');

if(img.dataset.url){
URL.revokeObjectURL(img.dataset.url);
}

if(f){
const u=URL.createObjectURL(f);
img.dataset.url=u;
img.src=u;
img.style.display='block';
message('사진 선택 완료. 분석 버튼을 눌러주세요.');
}
}

/* 날짜 형식 검증 */
function dateValues(s){
const re=/(20\d{2})\s*[년.\/-]\s*(\d{1,2})\s*[월.\/-]\s*(\d{1,2})\s*일?/g;
let m;
let out=[];

while((m=re.exec(s))!==null){
let y=+m[1];
let mo=+m[2];
let d=+m[3];
let dt=new Date(y,mo-1,d);

if(
dt.getFullYear()===y &&
dt.getMonth()===mo-1 &&
dt.getDate()===d
){
out.push(
`${y}.${String(mo).padStart(2,'0')}.${String(d).padStart(2,'0')}`
);
}
}

return [...new Set(out)];
}

/* 최종 판정 */
function decision(front,back){
for(const text of [front,back]){
const lines=text.split(/\r?\n/);

for(let i=0;i<lines.length;i++){
if(!/최종\s*판정\s*[:：]?/.test(lines[i])){
continue;
}

const near=compact(
lines.slice(i,i+2).join(' ')
).slice(0,45);

if(/부적합|불합격/.test(near)){
return 'fail';
}

if(/적합|합격/.test(near)){
return 'pass';
}
}
}
return 'unknown';
}

/* 앞면 재검사 기한 또는 다음 검사일 */
function findDate(front,kind){
const key=kind==='fail'
?/재\s*검\s*사\s*(기\s*간|기\s*한)/
:/다\s*음\s*검\s*사\s*(일|날\s*짜)|차\s*기\s*검\s*사/;

const ls=front.split(/\r?\n/);

for(let i=0;i<ls.length;i++){
if(!key.test(ls[i])){
continue;
}

const own=dateValues(ls[i]);

if(own.length===1){
return own[0];
}

const at=ls[i].search(key);
const nearbyLine=ls[i].slice(
Math.max(0,at),
Math.max(0,at)+65
);

if(/최초\s*등록|검사\s*일자/.test(nearbyLine)){
continue;
}

const nearby=dateValues(nearbyLine);

if(nearby.length===1){
return nearby[0];
}
}
return null;
}

/* 번호 제거 */
function stripNumber(s){
return s.replace(
/^\s*(?:\[?\d{1,2}\]?\s*[.)]|[①②③④⑤⑥⑦⑧⑨⑩])\s*/,
''
).trim();
}

/* 뒷면 부적합 목록만 추출 */
function extractFaults(back){
const lines=back.split(/\r?\n/);
let start=-1;

for(let i=0;i<lines.length;i++){
const n=compact(lines[i]);

if(
n==='부적합' ||
/^부적합[:：]/.test(lines[i].trim())
){
start=i;
break;
}
}

if(start<0){
return {found:false,items:[]};
}

const selected=[];

for(
let j=start+1;
j<Math.min(lines.length,start+10);
j++
){
const ln=lines[j];

if(
/종합\s*의\s*견|종합\s*진\s*단\s*결\s*과|진단\s*결과|리콜\s*정보/.test(ln)
){
break;
}

if(ln.trim()){
selected.push(ln.trim());
}
}

const joined=selected.join(' ')
.replace(/^[\s:：-]+/,'');

const candidates=joined.split(/[,，]/)
.map(x=>stripNumber(x)
.replace(/^[\s:：|_-]+|[\s:：|_-]+$/g,'')
.trim())
.filter(Boolean);

return {
found:true,
items:candidates.slice(0,12)
};
}

/* 기타 [부적합 문구] 처리 */
function cleanFault(s){
let v=stripNumber(s).trim();

v=v.replace(
/^기타\s*[\[(（]\s*/,
''
).replace(
/[\])）]\s*$/,
''
);

return compact(v);
}

/* 정확히 일치하는 부적합 용어만 번역 */
function translate(s){
const n=cleanFault(s);

for(const [re,trans] of dict){
if(re.test(n)){
return trans;
}
}

return null;
}

/* 7개 계통 진단의견 */
function statesFrom(front,back,items){
const out=cats.map(()=> 'unread');
const ls=front.split(/\r?\n/);

for(let i=0;i<cats.length;i++){
const head=cats[i].head;

for(let j=0;j<ls.length;j++){
const line=ls[j];
const m=head.exec(line);

if(!m){
continue;
}

const excerpt=
line.slice(m.index,m.index+130)+
' '+
(ls[j+1]||'').slice(0,35);

if(
/점\s*검\s*요|점검\s*필요|불량|부적합|결함/.test(excerpt)
){
out[i]='need';
}else if(
/양\s*호|정\s*상|이상\s*없음/.test(excerpt) &&
out[i]!=='need'
){
out[i]='good';
}
}
}

/* 뒷면에 명시된 부적합은 점검요 우선 */
for(const it of items){
const s=compact(it);

if(
/등화|전조등|제동등|안개등|방향지시등|후미등/.test(s)
){
out[3]='need';
}

if(/조향|타이로드/.test(s)){
out[0]='need';
}

if(/브레이크|제동계통|제동력/.test(s)){
out[2]='need';
}

if(/타이어|주행계통|차축/.test(s)){
out[1]='need';
}

if(/배출가스|매연|일산화탄소/.test(s)){
out[4]='need';
}

if(/계기계통|속도계/.test(s)){
out[5]='need';
}

if(/자가진단|전자제어센서|OBD/.test(s)){
out[6]='need';
}
}

return out;
}

/* 판독 결과 종합 */
function parse(){
const result=decision(ocrFront,ocrBack);
const faults=extractFaults(ocrBack);

return {
result,
date:verifiedDate||(
result==='unknown'
?null
:findDate(ocrFront,result)
),
found:faults.found,
items:faults.items,
states:statesFrom(
ocrFront,
ocrBack,
faults.items
)
};
}

function make(tag,cl,value){
const x=document.createElement(tag);
if(cl)x.className=cl;
if(value!==undefined)x.textContent=value;
return x;
}

/* 다국어 결과 화면 */
function render(){
if(!current)return;

const language=$('lang').value;
const t=lex[language];
const idx=langs.indexOf(language);

$('heading').textContent=t.result;
$('groupTitle').textContent=t.groups;
$('groupHelp').textContent=t.groupHelp;
$('issueTitle').textContent=t.findings;
$('warning').textContent=t.warn;

const top=$('top');
top.replaceChildren();

const h=make(
'div',
'hero '+(
current.result==='pass'
?'pass'
:current.result==='fail'
?'fail'
:'unknown'
)
);

h.append(make(
'strong',
'',
current.result==='pass'
?t.pass
:current.result==='fail'
?t.fail
:t.unknown
));

if(current.result!=='unknown'){
h.append(make(
'div',
'date-label',
current.result==='pass'
?t.next
:t.deadline
));

h.append(make(
'div',
'date',
current.date||t.dateUnknown
));
}

top.append(h);

/* 계통별 양호 / 점검요 */
const rows=$('groupRows');
rows.replaceChildren();

current.states.forEach((state,i)=>{
const tr=make('tr');

tr.append(make(
'td',
'',
cats[i].n[idx]
));

tr.append(make(
'td',
state==='good'
?'good'
:state==='need'
?'need'
:'unread',
state==='good'
?t.good
:state==='need'
?t.need
:t.unread
));

rows.append(tr);
});

/* 종합진단 결과 */
const items=$('issues');
items.replaceChildren();

if(current.items.length){
current.items.forEach(raw=>{
const tr=translate(raw);
const box=make('div','issue');

box.append(make(
'div',
'issue-title',
tr?tr[idx]:t.verify
));

box.append(make(
'div',
'issue-original',
raw
));

items.append(box);
});

}else if(
current.result==='pass' &&
/종합\s*진단\s*결과[\s\S]{0,65}(이상\s*없음|양호)/.test(ocrBack)
){
items.append(make(
'div',
'all-good',
t.noIssues
));

}else{
items.append(make(
'div',
'unread',
t.noRead
));
}

$('result').style.display='block';
}

/* OCR 원문과 날짜 직접 확인·수정 */
function applyEdits(){
ocrFront=$('frontOcr').value;
ocrBack=$('backOcr').value;

const input=$('dateEdit').value.trim();

if(input){
const v=dateValues(input);

if(
v.length!==1 ||
v[0]!==input
.replace(/\//g,'.')
.replace(/-/g,'.')
){
message(
'날짜는 원본을 보고 YYYY.MM.DD 형식으로 입력해 주세요.'
);
return;
}

verifiedDate=v[0];

}else{
verifiedDate=null;
}

current=parse();
render();

message(
'수정 내용을 적용했습니다. 원본과 대조해 주세요.'
);
}

/* 사진 준비 */
function imageCanvas(file){
return new Promise((resolve,reject)=>{
const im=new Image();
const url=URL.createObjectURL(file);

im.onload=()=>{
let scale=Math.min(
2,
2600/im.width,
3500/im.height
);

const c=document.createElement('canvas');

c.width=Math.max(
1,
Math.round(im.width*scale)
);

c.height=Math.max(
1,
Math.round(im.height*scale)
);

c.getContext('2d').drawImage(
im,0,0,c.width,c.height
);

URL.revokeObjectURL(url);
resolve(c);
};

im.onerror=()=>{
URL.revokeObjectURL(url);
reject(Error(
'이미지를 열 수 없습니다. JPG 또는 PNG를 사용해 주세요.'
));
};

im.src=url;
});
}

/* 날짜·진단의견 부분 확대 */
function crop(c,y,h){
const z=document.createElement('canvas');

z.width=c.width;
z.height=Math.max(
1,
Math.round(c.height*h)
);

z.getContext('2d').drawImage(
c,
0,c.height*y,
c.width,c.height*h,
0,0,z.width,z.height
);

return z;
}

/* 분석 버튼 */
async function startAnalysis(){
message('버튼 작동 확인!');

if(working)return;

const f=$('front').files[0];
const b=$('back').files[0];

if(!f||!b){
message(
'앞면과 뒷면 사진을 모두 선택해 주세요.'
);
return;
}

if(!window.Tesseract){
message(
'OCR 모듈 로드 실패. 인터넷 연결을 확인해 주세요.'
);
return;
}

working=true;
$('run').disabled=true;

let worker=null;

try{
message('한글 OCR 준비 중...');

worker=await Tesseract.createWorker(
'kor+eng',
1,
{
logger:m=>{
if(m.status==='recognizing text'){
message(
'글자 인식 중 '+
Math.round((m.progress||0)*100)+'%'
);
}
}
}
);

message('앞장 인식 중...');

const fc=await imageCanvas(f);
let front=(
await worker.recognize(fc)
).data.text;

message(
'앞장 진단의견과 날짜 확대 인식 중...'
);

const upper=(
await worker.recognize(
crop(fc,.02,.27)
)
).data.text;

const mid=(
await worker.recognize(
crop(fc,.28,.55)
)
).data.text;

front+='\n'+upper+'\n'+mid;

message('뒷장 부적합 목록 인식 중...');

const bc=await imageCanvas(b);

let back=(
await worker.recognize(bc)
).data.text;

const part=(
await worker.recognize(
crop(bc,.28,.55)
)
).data.text;

/*
뒷장 확대 영역에서 부적합 목록이
더 명확하게 읽히면 해당 결과 우선
*/
if(
extractFaults(part).items.length >
extractFaults(back).items.length
){
back=part+'\n\n'+back;
}

ocrFront=front;
ocrBack=back;
verifiedDate=null;

$('dateEdit').value='';
$('frontOcr').value=ocrFront;
$('backOcr').value=ocrBack;

current=parse();
render();

message(
'분석 완료. 진단서 원본과 결과를 확인해 주세요.'
);

$('result').scrollIntoView({
behavior:'smooth'
});

}catch(error){
message(
'분석 오류: '+error.message
);

}finally{
if(worker){
try{
await worker.terminate();
}catch(e){}
}

working=false;
$('run').disabled=false;
}
}
</script>
